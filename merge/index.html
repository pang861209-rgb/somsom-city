<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>솜솜시티: 솜솜 합체</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#221E18;overflow:hidden;
    font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#221E18;
    -webkit-user-select:none;user-select:none;}
  #app{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;
    background:#FDFBF5;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:15px;padding:24px;background:#FDFBF5;z-index:5;}
  .screen.hidden{display:none;}
  /* 타이틀 — 솜솜시티 공통 히어로 구성 (짝맞추기·방범대와 같은 틀) */
  #sTitle{padding:0;gap:0;justify-content:flex-start;overflow:hidden;
    background:linear-gradient(#efd9b8 0%,#e3c39a 60%,#caa26a 100%);}
  #titleBg{position:absolute;left:0;top:0;width:100%;height:calc(100% - 168px);object-fit:cover;
    object-position:center 68%;z-index:0;}
  #titleTop{position:relative;z-index:2;margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:9px;}
  .logoTop{font-size:13px;font-weight:800;color:#fff7e8;letter-spacing:5px;text-shadow:0 2px 0 rgba(96,58,38,.5);}
  #titleLogo{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:46px;line-height:1.1;font-weight:900;
    color:#fff7e8;letter-spacing:2px;transform:rotate(-2deg);margin:0;
    text-shadow:0 3px 0 #7c4a2d,0 7px 16px rgba(60,30,20,.4);}
  #titleSub{font-size:12px;font-weight:700;color:#5a4130;background:rgba(255,247,232,.88);
    border:1.5px solid rgba(124,74,45,.5);border-radius:20px;padding:5px 14px;}
  #titleBottom{position:absolute;left:0;right:0;bottom:0;z-index:2;height:168px;padding:10px 16px 8px;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    background:linear-gradient(#402419,#2f1a12);border-top:1.5px solid rgba(255,239,216,.16);
    box-shadow:0 -10px 22px rgba(40,20,10,.28);}
  #titleBottom #ladder .ln{color:#d9c9ad;}
  #titleBottom #ladder .ar{color:#8a7658;}
  #titleBottom #btnGo{font-size:17px;padding:11px 44px;border-radius:16px;background:#ffb35c;
    border:2px solid #5a2f1c;color:#4a2416;box-shadow:0 4px 0 #5a2f1c;}
  #titleBottom #btnGo:active{transform:translateY(4px);box-shadow:none;}
  #titleFoot{gap:8px;align-items:center;flex-wrap:nowrap;max-width:360px;}
  #titleBottom .ghost{padding:4px 10px;font-size:12px;background:rgba(255,239,216,.14);color:#f3e6cf;
    border-color:rgba(255,239,216,.35);box-shadow:none;}
  #titleBottom #titleHint{font-size:10.5px;color:rgba(255,239,216,.7);line-height:1.4;text-align:left;}
  /* 결과는 통을 가리지 않는다 — 끝난 통 모습이 "내 통 봐"가 된다 */
  #sResult{background:rgba(253,251,245,.28);justify-content:flex-end;padding-bottom:26px;}
  @keyframes cardUp{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
  #sResult .card{animation:cardUp .4s ease-out;background:#FDFBF5;border:2px solid #221E18;border-radius:18px;
    box-shadow:3px 3px 0 #221E18;padding:18px 22px 20px;display:flex;flex-direction:column;
    align-items:center;gap:10px;max-width:340px;width:100%;}
  button{border:2px solid #221E18;background:#fff;border-radius:11px;padding:11px 22px;
    font-size:16px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #221E18;
    font-family:inherit;color:#221E18;}
  button:active{transform:translate(2px,2px);box-shadow:0 0 0 #221E18;}
  button.big{padding:14px 32px;font-size:18px;background:#E0A12B;}
  button.ghost{background:#F3EEE2;font-size:14px;padding:8px 16px;box-shadow:1px 1px 0 #221E18;}
  h1{font-family:'Black Han Sans',sans-serif;font-size:32px;margin:0;letter-spacing:-1px;}
  .sub{font-size:13px;color:#6B6357;text-align:center;line-height:1.6;margin:0;}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .top{position:absolute;top:10px;left:10px;z-index:6;}
  .top a{text-decoration:none;border:2px solid #221E18;background:#F3EEE2;border-radius:11px;
    padding:7px 13px;font-size:13px;font-weight:800;box-shadow:1px 1px 0 #221E18;color:#221E18;}
  /* 사다리 안내 */
  #ladder{display:flex;align-items:flex-end;gap:2px;justify-content:center;flex-wrap:wrap;
    max-width:360px;}
  #ladder .lb{display:flex;flex-direction:column;align-items:center;gap:1px;}
  #ladder img{display:block;}
  #ladder .ln{font-size:9.5px;color:#8A8271;font-weight:800;}
  #ladder .ar{font-size:11px;color:#C6BEAE;padding-bottom:14px;}
  #resBig{font-size:34px;font-weight:900;font-family:'Black Han Sans',sans-serif;color:#E0A12B;}
  /* 오늘의 순위판 — 아래에서 올라오는 시트 */
  .sheetWrap{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
    background:rgba(34,30,24,.45);}
  .sheetWrap.on{display:flex;}
  .sheet{background:#FDFBF5;border:2px solid #221E18;border-bottom:0;border-radius:18px 18px 0 0;width:100%;
    max-height:72%;overflow:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;}
  .sheet .hd{display:flex;justify-content:space-between;align-items:baseline;}
  .sheet .t{font-family:'Black Han Sans',sans-serif;font-size:21px;}
  .sheet .c{font-size:12px;color:#8A8271;font-weight:800;}
  .bRow{display:flex;gap:10px;align-items:center;padding:8px 8px;border-bottom:1px solid #EFE7D6;font-weight:800;font-size:14px;}
  .bRow.me{background:#FFF1CC;border-radius:9px;border-bottom-color:transparent;}
  .bRow .rk{width:30px;color:#8A8271;font-size:12px;}
  .bRow .nm{flex:1;}
  .bRow .sc{color:#C98A12;font-family:'Black Han Sans',sans-serif;font-size:17px;}
  .bMsg{padding:18px 6px;text-align:center;color:#6B6357;font-size:13px;line-height:1.6;}
  .sheet .ghost{align-self:center;margin-top:4px;}
  #toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:20;
    background:#221E18;color:#FDFBF5;border-radius:10px;padding:7px 14px;font-size:13px;
    font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
  #toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="toast"></div>

  <!-- 타이틀 -->
  <div id="sTitle" class="screen">
    <img id="titleBg" src="../assets/title_hero_merge.jpg" alt="도토리 상점의 나무 상자 안에 차곡차곡 쌓인 여섯 친구">
    <div class="top"><a href="../">← 마을</a></div>
    <div id="titleTop">
      <div class="logoTop">솜솜시티</div>
      <h1 id="titleLogo">솜솜 합체</h1>
      <div id="titleSub">같은 친구 둘이 만나면 <b>한 뼘 더 큰 친구</b>가 됩니다</div>
    </div>
    <div id="titleBottom">
      <div id="ladder"></div>
      <button class="big" id="btnGo">떨어뜨리기</button>
      <div class="row" id="titleFoot">
        <button class="ghost" id="btnMute">🔊</button>
        <button class="ghost" id="btnBoard">오늘의 순위</button>
        <span id="titleHint"></span>
      </div>
    </div>
  </div>

  <!-- 결과 -->
  <div id="sResult" class="screen hidden">
    <div class="card">
      <h1 style="font-size:24px;" id="resTitle">한 판 끝</h1>
      <div id="resBig">0</div>
      <p class="sub" id="resNote"></p>
      <div class="row">
        <button class="big" id="btnRetry">한 판 더</button>
        <button class="ghost" id="btnShare">자랑하기</button>
        <button class="ghost" id="btnBoard2">순위</button>
        <button class="ghost" id="btnHome">타이틀</button>
      </div>
    </div>
  </div>

  <!-- 자랑하기 — 공유 시트가 없는 곳에서는 여기 띄운다 -->
  <div id="shareSheet" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">자랑하기</span><span class="c">길게 눌러 저장하거나 보내세요</span></div>
      <img id="shareImg" alt="결과 이미지" style="width:100%;border-radius:12px;border:2px solid #221E18;">
      <button class="ghost" id="shareClose">닫기</button>
    </div>
  </div>

  <!-- 오늘의 순위판 -->
  <div id="board" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">오늘의 순위</span><span class="c" id="boardDay"></span></div>
      <div id="boardList"></div>
      <button class="ghost" id="boardClose">닫기</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   솜솜시티 GAME 06 M0 — 「솜솜 합체」 (드롭 앤 머지)
   조사 문서: docs/CASUAL_GENRE_SURVEY.md

   M0 목적: 물리와 합체만으로 재미있는지 확인.
   재미없으면 여기서 멈춘다. 메타 성장·스테이지·랭킹은 아직 없다.
   ═══════════════════════════════════════════════════════════ */

// ── 합체 사다리 ─────────────────────────────────────────────
// 순서는 비주얼 바이블의 캐릭터 키 순서 그대로다.
//   미개 37 · 북거씨 43 · 라칠친 52 · 람다 61 · 끼토 91 · 보늘 100
// 반지름은 게임용으로 고르게 벌린 값이다(캐논 수치를 그대로 쓰면
// 끼토 91 → 보늘 100 구간이 거의 안 커져서 합체가 체감되지 않는다).
// R_BASE — 너비 382px 통을 기준으로 잰 반지름. 실제 반지름은 layout()에서
// 통 너비에 비례해 다시 계산한다(TIERS[i].r).
// 크기를 크게 잡은 이유: 사다리가 여섯 칸뿐이라 짝이 안 맞아 남는 조각은
// 람다·끼토·보늘 셋뿐이다. 이 셋이 통을 꽤 차지해야 비로소 판이 끝난다.
const R_BASE = [26, 35, 46, 58, 72, 92];
// r 은 여기 안 적습니다. layout() 이 통 너비에 맞춰 R_BASE 에서 계산해 넣습니다.
// (sc 는 원 안에 스프라이트를 얼마나 크게 넣을지의 비율입니다)
const TIERS = [
  { k:'migae',      n:'미개',   r:0, c:'#3A3A3A', sc:1.75 },
  { k:'bookgeo',    n:'북거씨', r:0, c:'#6E9A6A', sc:1.95 },
  { k:'lachilchin', n:'할머니', r:0, c:'#B3A8C8', sc:1.70 },
  { k:'ramda',      n:'람다',   r:0, c:'#C87F4A', sc:1.70 },
  { k:'kkito',      n:'끼토',   r:0, c:'#E9A8BE', sc:1.60 },
  { k:'boneul',     n:'보늘',   r:0, c:'#9AA39B', sc:1.55 },
];
const TOP_TIER = TIERS.length - 1;
// 합체 점수 — 위로 갈수록 가파르게.
// 예전 값 [1,3,6,12,24,50] · 연쇄 배수 0.5 로는 점수의 4/5가 연쇄에서 나왔고,
// 연쇄는 운이라 무작위 봇 1280 · 사람 봇 1298 · 완벽한 봇 1354로 실력 차가
// 6%밖에 안 났습니다(조각 50개, 같은 시드). 랭킹이 뜻을 가지려면 점수가
// "얼마나 높이 올렸나"를 따라야 하므로 위쪽을 가파르게 올리고 연쇄를 낮췄습니다.
const MERGE_SCORE = [0, 5, 15, 45, 130, 400];
const POP_SCORE = 800;   // 보늘 둘이 만나 사라질 때 — 한 판의 승부처
const CHAIN_MUL = 0.35;  // 연쇄 배수. 높이면 다시 운 게임이 됩니다
// 떨어뜨릴 수 있는 건 아래 세 단계뿐 (윗단계는 합쳐서만 나온다)
let DROPPABLE = 3;
// 한 판에 쓸 수 있는 조각 수. 이게 이 게임의 진짜 한 판 길이다.
// 넘침만으로는 판이 안 끝난다 — 사다리가 여섯 칸뿐이라 합체 속도가 투하 속도를
// 따라잡아 통이 평형에 머문다(자동 플레이 250판으로 확인). 조각 수를 묶으면
// 모두가 같은 예산으로 겨루게 되고, 빨리 누르는 사람이 유리해지지도 않는다.
const DROPS_MAX = 60;
// 보늘 둘이 만나 사라질 때 조각을 더 준다. 한 판 길이가 실력에서 나오게 하는 장치다.
// 잘 두면 70~80개까지 늘어나고, 못 두면 60개에서 끝난다.
const POP_BONUS_DROPS = 5;
// 한 판에 손에 든 조각을 옆 칸과 바꿀 수 있는 횟수. 빠른 손이 아니라 계획이 점수가 되게.
const HOLD_MAX = 3;

// ── 물리 상수 ───────────────────────────────────────────────
const GRAV = 1500;        // px/s^2
const REST = 0.12;        // 반발 계수 (낮게 — 통통 튀면 정신없다)
const FRIC = 0.86;        // 접촉 시 접선 감쇠
const AIRD = 0.999;       // 공기 저항
const ITER = 14;          // 위치 보정 반복 — 쌓임 안정성 (많이 쌓이면 8로 낮춘다)
const WALL_R = 0.10;      // 벽 반발

// ── 캔버스 ──────────────────────────────────────────────────
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');   // 자랑하기 카드를 그릴 때 잠시 바꿔 낀다
const DPR = Math.min(3, window.devicePixelRatio || 1);
let W = 420, H = 680;
let BOX = { x:0, y:0, w:0, h:0 };   // 통
let LINE = 0;                       // 넘침 기준선
const HUD = 58;

// ── 오늘의 규칙 ─────────────────────────────────────────────
// 날짜를 씨앗으로 하루에 하나. 모두 같은 규칙·같은 순서라 순위판이 공정하다.
// 규칙은 숫자만 바꾼다. 새 조작·새 조각·새 캐릭터는 없다.
const RULES = [
  { k:'plain',   n:'보통 날',           d:'',                                        w:2 },
  { k:'migae',   n:'미개가 많은 날',     d:'작은 친구가 자주 옵니다',                   w:1, weights:[.55,.30,.15] },
  { k:'granny',  n:'할머니가 많은 날',   d:'큰 친구가 자주 와서 통이 빨리 찹니다',        w:1, weights:[.15,.30,.55] },
  { k:'hold',    n:'바꾸기가 넉넉한 날', d:'바꿔 두기를 여섯 번 할 수 있습니다',          w:1, hold:6 },
  { k:'boneul',  n:'보늘이 후한 날',     d:'보늘 둘이 돌아가며 조각 열 개를 두고 갑니다', w:1, popBonus:10 },
  { k:'shallow', n:'통이 얕은 날',       d:'통이 낮아 넘치기 쉽습니다',                 w:1, boxH:0.82 },
];
function todayRule(){
  const r = mulberry32(dayKey()*31 + 7)();
  const tot = RULES.reduce((a,x)=>a+x.w, 0);
  let acc = 0;
  for(const R of RULES){ acc += R.w/tot; if(r < acc) return R; }
  return RULES[0];
}
let RULE = todayRule();

let bodies = [];              // {x,y,vx,vy,r,t,id,born}
let cur = null;               // 손에 든 것 {t, x}
const REF_W = 382;            // R_BASE 를 잰 기준 통 너비
// 통 높이 = 너비 × 이 값(상한). 화면 세로를 그대로 쓰면 끝없이 깊은 통이
// 되지만, 너무 낮게 묶으면 세로로 긴 폰에서 위쪽이 텅 빈 채로 남는다.
// 420×680 에서는 애초에 이 상한에 못 미치므로(1.29) 값이 걸리지 않고,
// 긴 폰에서만 작동한다.
let BOX_RATIO = 1.9;

function layout(){
  const r = cv.getBoundingClientRect();
  W = Math.max(300, Math.round(r.width || 420));
  H = Math.max(420, Math.round(r.height || 680));
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  const margin = Math.max(10, Math.round(W*0.045));
  BOX.x = margin; BOX.w = W - margin*2;
  // 조각 크기를 통 너비에 비례시킨다.
  // 고정 픽셀로 두면 좁은 폰에서만 통이 빨리 차서, 기기에 따라 난이도가 달라진다.
  const k = BOX.w / REF_W;
  TIERS.forEach((t,i)=>{ t.r = Math.max(7, Math.round(R_BASE[i]*k)); });
  // 손에 든 조각이 HUD를 가리지 않을 만큼만 위를 비운다
  const TOPGAP = TIERS[DROPPABLE-1].r*2 + 20;
  // 통 높이는 너비의 1.45배로 묶는다. 화면 세로 길이를 그대로 쓰면
  // 긴 폰일수록 통이 깊어져서 같은 게임이 기기마다 쉬워진다.
  BOX.h = Math.min(Math.round(BOX.w*BOX_RATIO), H - (HUD+TOPGAP) - margin);
  BOX.h = Math.max(220, BOX.h);
  if(RULE.boxH) BOX.h = Math.round(BOX.h * RULE.boxH);   // 통이 얕은 날
  BOX.y = Math.max(HUD + TOPGAP, H - margin - BOX.h);   // 통은 아래에 붙인다
  LINE = BOX.y;
  // 화면이 바뀌면 이미 놓인 것도 같이 줄이고 통 안으로 넣는다
  for(const b of bodies){
    b.r = TIERS[b.t].r;
    if(b.rT){ b.rT = b.r; b.r0 = Math.min(b.r0, b.r); }
    b.x = Math.max(BOX.x+b.r, Math.min(BOX.x+BOX.w-b.r, b.x));
    b.y = Math.min(BOX.y+BOX.h-b.r, b.y);
  }
  if(cur){ const cr = TIERS[cur.t].r;
           cur.x = Math.max(BOX.x+cr+1, Math.min(BOX.x+BOX.w-cr-1, cur.x)); }
}
layout();
addEventListener('resize', ()=>{ layout(); });
addEventListener('orientationchange', ()=>setTimeout(layout,250));

// ── 스프라이트 ──────────────────────────────────────────────
// 벽 배경과 널빤지 — 통을 나무 상자로, 뒤를 상점 벽으로. 못 불러오면 예전 평면 그리기로 간다.
let BG_WALL = null, PLANK = null, PLANK_PAT = null;

// ── 소리 (낙엽피하기와 같은 WebAudio 합성) ────────────────────
let AC=null, muted = localStorage.getItem('somsom_muted')==='1';
function ac(){
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,d,type,g,when,slide){
  const a=ac(), o=a.createOscillator(), gn=a.createGain(), t0=a.currentTime+(when||0);
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  gn.gain.setValueAtTime(g||0.06,t0); gn.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0+d+0.02);
}
function sfx(name, tier){
  if(muted) return;
  try{
    if(name==='drop') tone(200,0.07,'triangle',0.05);
    else if(name==='merge'){
      // 단계가 올라갈수록 높은 음 — 합체가 귀로도 느껴지게
      const base = 420 + (tier||0)*110;
      tone(base,0.10,'sine',0.055); tone(base*1.5,0.13,'sine',0.05,0.055);
    }
    else if(name==='chain') tone(1200,0.16,'square',0.045,0,1700);
    else if(name==='swap'){ tone(660,0.06,'triangle',0.045); tone(880,0.07,'triangle',0.04,0.06); }
    else if(name==='top'){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.22,'square',0.055,i*0.10)); }
    else if(name==='over'){ [392,311,233].forEach((f,i)=>tone(f,0.26,'triangle',0.065,i*0.18)); }
  }catch(e){}
}
function buzz(ms){ if(muted) return; try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

// 오늘의 통 — 하루 동안 모든 사람에게 같은 조각 순서가 나온다.
// 같이 안 해도 "그 판에서 몇 점"이 성립해야 랭킹이 뜻을 갖는다.
function dayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function dayLabel(){ const d=new Date(); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rng = Math.random;
function pickTier(){
  const w = RULE.weights;
  if(!w) return (rng()*DROPPABLE)|0;
  const r = rng(); let acc = 0;
  for(let i=0;i<DROPPABLE;i++){ acc += w[i]; if(r < acc) return i; }
  return DROPPABLE-1;
}

function startGame(){
  bodies = []; score = 0; merges = 0; maxTier = 0; overT = 0;
  left = DROPS_MAX; doneT = 0; endT = 0; overReason = 'over';
  chain = 0; chainT = 0; maxChain = 0; stat = { pops:0 };
  pops = []; floats = []; ghosts = []; shake = 0; dropLock = 0; tut = 0; tutMerged = 0;
  RULE = window.FORCE_RULE || todayRule(); layout();   // 자정을 넘겼을 수 있다 (FORCE_RULE 은 테스트용)
  hold = null; holdLeft = RULE.hold || HOLD_MAX;
  rng = mulberry32(dayKey() * 7919 + 13);      // 오늘의 통
  cur = { t: pickTier(), x: W/2 };
  nextT = pickTier();
  mode = 'PLAY'; show(null);
  acc = 0;                            // 이전 판의 누적 시간이 넘어오지 않게
  tut = (plays < 2) ? 4.5 : 0;        // 첫 두 판에만 안내 한 줄
  last = performance.now();
}

// ── 조작 ────────────────────────────────────────────────────
function px(ev){
  const r = cv.getBoundingClientRect();
  const c = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
  return c - r.left;
}
function togglePause(){
  if(mode==='PLAY'){ mode='PAUSE'; }
  else if(mode==='PAUSE'){ mode='PLAY'; last = performance.now(); acc = 0; }
}
function aim(ev){
  if(mode!=='PLAY' || !cur) return;
  if(!muted){ try{ ac(); }catch(e){} }
  const r = TIERS[cur.t].r;
  cur.x = Math.max(BOX.x + r + 1, Math.min(BOX.x + BOX.w - r - 1, px(ev)));
}
function hitPause(ev){
  const r = cv.getBoundingClientRect();
  const c = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0] : ev;
  const x = c.clientX - r.left, y = c.clientY - r.top;
  return x > W-46 && x < W-6 && y > HUD/2-18 && y < HUD/2+18;
}
// 바꾸기 칸 — 드롭 공간 왼쪽에 둔다. HUD는 이미 꽉 찼다.
function holdPos(){ return { x: BOX.x + 30, y: HUD + Math.round((BOX.y-HUD)/2), r: 24 }; }
function hitHold(ev){
  const rc = cv.getBoundingClientRect();
  const c = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0] : ev;
  const x = c.clientX - rc.left, y = c.clientY - rc.top, h = holdPos();
  return Math.hypot(x-h.x, y-h.y) < h.r + 12;
}
function swapHold(){
  if(mode!=='PLAY' || !cur || dropLock>0) return;
  if(holdLeft <= 0){ toast('바꾸기를 다 썼습니다'); return; }
  if(hold == null){ hold = cur.t; cur = { t: nextT, x: cur.x }; nextT = pickTier(); }
  else { const t = hold; hold = cur.t; cur = { t, x: cur.x }; }
  holdLeft--;
  const r = TIERS[cur.t].r;
  cur.x = Math.max(BOX.x + r + 1, Math.min(BOX.x + BOX.w - r - 1, cur.x));
  dropLock = 0.18;
  sfx('swap'); buzz(8);
}
function drop(){
  if(mode!=='PLAY' || !cur || dropLock>0) return;
  const t = cur.t, r = TIERS[t].r;
  bodies.push({ x:cur.x, y:BOX.y - r - 8, vx:0, vy:0, r, t, id:nextId++, born:0 });
  if(!seen[t]){ seen[t] = 1; saveAll(); }      // 떨어뜨린 단계도 도감에
  sfx('drop'); buzz(6);
  dropLock = 0.36;
  left--;
  if(left > 0){ cur = { t: nextT, x: cur.x }; nextT = pickTier(); }
  else cur = null;                             // 마지막 조각을 놓았다
}
let touchOnHold = false;      // 바꾸기 칸을 누른 채로는 조준·투하를 안 한다
cv.addEventListener('touchstart', e=>{
  touchOnHold = hitHold(e);
  if(!hitPause(e) && !touchOnHold) aim(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchmove',  e=>{ if(!touchOnHold) aim(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend',   e=>{
  if(hitPause(e)){ togglePause(); e.preventDefault(); return; }
  if(touchOnHold){ touchOnHold = false; if(hitHold(e)) swapHold(); e.preventDefault(); return; }
  drop(); e.preventDefault();
}, {passive:false});
cv.addEventListener('mousemove',  e=>{ if(!touchOnHold) aim(e); });
cv.addEventListener('mousedown',  e=>{ touchOnHold = hitHold(e); if(!touchOnHold) aim(e); });
cv.addEventListener('mouseup',    e=>{
  if(hitPause(e)){ togglePause(); return; }
  if(touchOnHold){ touchOnHold = false; if(hitHold(e)) swapHold(); return; }
  drop(); });
addEventListener('keydown', e=>{
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ togglePause(); return; }
  if(mode!=='PLAY' || !cur) return;
  const r = TIERS[cur.t].r;
  if(e.key==='ArrowUp'||e.key==='c'||e.key==='C'||e.key==='Shift'){ swapHold(); e.preventDefault(); return; }
  if(e.key==='ArrowLeft')  cur.x = Math.max(BOX.x+r+1, cur.x-24);
  if(e.key==='ArrowRight') cur.x = Math.min(BOX.x+BOX.w-r-1, cur.x+24);
  if(e.key===' '||e.key==='ArrowDown'){ drop(); e.preventDefault(); }
});

// ── 물리 ────────────────────────────────────────────────────
function stepPhysics(dt){
  // 적분
  for(const b of bodies){
    b.born += dt;
    if(b.rT && b.r < b.rT){                    // 합체 직후 0.12초 동안 제 크기로 부푼다
      b.gt += dt;
      b.r = Math.min(b.rT, b.r0 + (b.rT - b.r0) * (b.gt/0.12));
    }
    b.vy += GRAV*dt;
    b.vx *= AIRD; b.vy *= AIRD;
    b.x += b.vx*dt; b.y += b.vy*dt;
  }
  // 충돌 — 위치 보정 반복
  // 순서가 중요하다. 원끼리 밀어낸 다음 벽으로 가둔다.
  // 반대로 하면 마지막에 밀어낸 결과가 벽 밖으로 삐져나온 채 프레임이 끝나고,
  // 그걸 나중에 한 번에 밀어 넣으면 이번엔 그 자리가 겹친 채로 남는다.
  const iters = bodies.length > 60 ? 8 : ITER;
  for(let it=0; it<iters; it++){
    // 원끼리
    for(let i=0;i<bodies.length;i++){
      const a = bodies[i];
      for(let j=i+1;j<bodies.length;j++){
        const c = bodies[j];
        let dx = c.x-a.x, dy = c.y-a.y;
        let d2 = dx*dx+dy*dy;
        const rr = a.r + c.r;
        if(d2 >= rr*rr || d2 === 0) continue;
        let d = Math.sqrt(d2);
        if(d < 0.0001){ dx = 0.01; dy = -1; d = 1; }
        const nx = dx/d, ny = dy/d;
        const pen = rr - d;
        // 질량은 면적에 비례
        const ma = a.r*a.r, mc = c.r*c.r, tot = ma+mc;
        const sa = (mc/tot), sc2 = (ma/tot);
        a.x -= nx*pen*sa; a.y -= ny*pen*sa;
        c.x += nx*pen*sc2; c.y += ny*pen*sc2;
        if(it===0){
          // 상대속도의 법선 성분만 감쇠
          const rvx = c.vx-a.vx, rvy = c.vy-a.vy;
          const vn = rvx*nx + rvy*ny;
          if(vn < 0){
            const imp = -(1+REST)*vn;
            a.vx -= nx*imp*sa; a.vy -= ny*imp*sa;
            c.vx += nx*imp*sc2; c.vy += ny*imp*sc2;
            if(vn < -260){                       // 세게 맞으면 아래쪽이 눌린 얼굴
              const low = (c.y > a.y) ? c : a;
              if(low.born > 0.3 && low.face !== 'win'){ low.face = 'hit'; low.faceT = 0.5; }
            }
          }
        }
      }
    }
    // 벽·바닥 — 반복의 마지막이라, 프레임은 항상 통 안에서 끝난다.
    // 위치는 매번 잡되 속도는 첫 번째에만 건드린다. 매번 감쇠하면 바닥 마찰이
    // 열네 번 곱해져(0.86^14 ≈ 0.12) 굴러가지 못하고 그 자리에 박힌다.
    for(const b of bodies){
      const L = BOX.x + b.r, R = BOX.x + BOX.w - b.r, B = BOX.y + BOX.h - b.r;
      if(b.x < L){ b.x = L; if(it===0 && b.vx<0) b.vx = -b.vx*WALL_R; else if(b.vx<0) b.vx = 0; }
      if(b.x > R){ b.x = R; if(it===0 && b.vx>0) b.vx = -b.vx*WALL_R; else if(b.vx>0) b.vx = 0; }
      if(b.y > B){ b.y = B;
        if(it===0){ if(b.vy>420 && b.face!=='win'){ b.face='hit'; b.faceT=0.45; }
                    if(b.vy>0) b.vy = -b.vy*REST; b.vx *= FRIC; }
        else if(b.vy>0) b.vy = 0; }
    }
  }
}

// ── 합체 ────────────────────────────────────────────────────
function resolveMerges(){
  const gone = new Set();
  let did = false;
  // 최종 단계끼리 만나면 둘 다 사라진다. 안 그러면 통이 보늘로 막혀 판이 죽는다.
  for(let i=0;i<bodies.length;i++){
    const a = bodies[i];
    if(gone.has(a.id) || a.t !== TOP_TIER) continue;
    for(let j=i+1;j<bodies.length;j++){
      const c = bodies[j];
      if(gone.has(c.id) || c.t !== TOP_TIER) continue;
      const dx=c.x-a.x, dy=c.y-a.y, rr=a.r+c.r;
      if(dx*dx+dy*dy > rr*rr*1.02) continue;
      gone.add(a.id); gone.add(c.id);
      // 연쇄 배수를 안 붙인다. 보늘 둘을 붙이는 건 작정하고 만드는 일이지
      // 굴러가다 우연히 터지는 게 아니고, 배수까지 붙이면 운으로 한 판이 갈린다.
      score += POP_SCORE;
      ghosts.push({ x:a.x, y:a.y, r:a.r, t:0 }, { x:c.x, y:c.y, r:c.r, t:0 });
      floats.push({ x:(a.x+c.x)/2, y:Math.min(a.y,c.y) - a.r, txt:'+'+POP_SCORE, t:0, big:true });
      merges++; chain++; chainT = 0.55; if(chain>maxChain) maxChain = chain;
      pops.push({ x:(a.x+c.x)/2, y:(a.y+c.y)/2, r:a.r*1.4, t:0 });
      pops.push({ x:(a.x+c.x)/2, y:(a.y+c.y)/2, r:a.r*0.7, t:-0.08 });
      sfx('top'); buzz(60); shake = 0.34;
      // 조각을 더 두고 간다. 마지막 조각을 이미 놓은 뒤라면 손을 다시 채운다.
      const bonus = RULE.popBonus || POP_BONUS_DROPS;
      left += bonus; doneT = 0; endT = 0;
      if(!cur){ cur = { t: pickTier(), x: W/2 }; nextT = pickTier(); }
      toast('보늘 둘이 돌아가며 조각 ' + bonus + '개를 두고 갔다  +' + POP_SCORE);
      stat.pops++;
      did = true;
      break;
    }
  }
  for(let i=0;i<bodies.length;i++){
    const a = bodies[i];
    if(gone.has(a.id) || a.t >= TOP_TIER) continue;
    for(let j=i+1;j<bodies.length;j++){
      const c = bodies[j];
      if(gone.has(c.id) || c.t !== a.t) continue;
      const dx=c.x-a.x, dy=c.y-a.y;
      const rr = a.r + c.r;
      if(dx*dx+dy*dy > rr*rr*1.02) continue;
      // 합친다
      gone.add(a.id); gone.add(c.id);
      const nt = a.t + 1, T = TIERS[nt];
      // 합쳐진 것은 부모보다 크므로, 중간 지점 그대로 두면 통 밖으로 삐져나온다.
      // 만들 때 바로 가둔다 (물리 스텝을 기다리면 한 프레임 동안 벽을 뚫고 보인다).
      const mx = Math.max(BOX.x + T.r, Math.min(BOX.x + BOX.w - T.r, (a.x+c.x)/2));
      const my = Math.min(BOX.y + BOX.h - T.r, (a.y+c.y)/2);
      bodies.push({ x:mx, y:my, r:a.r, r0:a.r, rT:T.r, gt:0, t:nt, id:nextId++, born:0,
                    vx:(a.vx+c.vx)/2, vy:(a.vy+c.vy)/2 - 60,
                    face:'win', faceT: nt===TOP_TIER ? 1.6 : 0.9 });   // 태어난 김에 기뻐한다
      const gain = Math.round(MERGE_SCORE[nt] * (1 + chain*CHAIN_MUL));
      score += gain;
      floats.push({ x:mx, y:my - T.r*0.6, txt:'+'+gain + (chain>0 ? ' ×'+(chain+1) : ''), t:0, big: nt>=4 });
      merges++;
      if(nt > maxTier){
        maxTier = nt;
        if(nt === TOP_TIER){ sfx('top'); buzz(60); toast('보늘이 나왔다!'); }
        else toast(T.n + ' 등장');
      }
      if(!seen[nt]){ seen[nt] = 1; saveAll(); }   // 처음 본 단계는 도감에
      pops.push({ x:mx, y:my, r:T.r, t:0 });
      if(plays<2 && !tutMerged){ tutMerged=1; tut=3.2; }
      chain++; chainT = 0.55; if(chain>maxChain) maxChain = chain;
      if(chain>1){ sfx('chain'); toast('연쇄 ×'+chain); }
      else sfx('merge', nt);
      buzz(10); shake = Math.min(0.3, 0.08 + nt*0.03);
      did = true;
      break;
    }
  }
  if(gone.size) bodies = bodies.filter(b=>!gone.has(b.id));
  return did;
}

// ── 넘침 판정 ───────────────────────────────────────────────
function checkOver(dt){
  let out = false;
  for(const b of bodies){
    if(b.born < 1.0) continue;                 // 막 떨어뜨린 건 봐준다
    if(Math.abs(b.vy) > 42) continue;          // 아직 움직이는 중이면 봐준다
    if(b.y - b.r < LINE){ out = true; break; }
  }
  overT = out ? overT + dt : 0;
  if(overT > 1.15){ overReason = 'over'; gameOver(); return; }
  // 조각을 다 쓰고 판이 잠잠해지면 끝난다.
  // 통이 꽉 차면 조각들이 서로 밀며 미세하게 계속 떨리므로 "완전히 멈춤"만
  // 기다리면 판이 영영 안 끝난다(조각 17개에서 확인). 그래서 마지막 조각을
  // 놓은 뒤 3.5초가 지나면 잠잠해지지 않아도 끝냅니다.
  if(left <= 0 && !cur){
    endT += dt;
    const moving = bodies.some(b => Math.abs(b.vy)>24 || Math.abs(b.vx)>24 || (b.rT && b.r<b.rT));
    doneT = moving ? 0 : doneT + dt;
    if(doneT > 0.7 || endT > 3.5){ overReason = 'done'; gameOver(); }
  }
}
function gameOver(){
  mode = 'OVER';
  sfx('over');
  score = Math.round(score);
  const isBest = score > best;
  if(isBest) best = score;
  if(maxTier > bestTier) bestTier = maxTier;
  plays++;
  saveAll();
  hubReport();
  pushRanking();

  $('resTitle').textContent = overReason === 'over' ? '통이 넘쳤다' : '조각을 다 놓았다';
  $('resBig').textContent = score + '점';
  const parts = [];
  parts.push(overReason === 'over'
    ? '통이 넘쳤습니다 · 조각 ' + (DROPS_MAX - left) + '개'
    : '조각 ' + DROPS_MAX + '개를 다 놓았습니다');
  parts.push('합체 ' + merges + '번' + (maxChain>1 ? ' · 최고 ' + maxChain + '연쇄' : ''));
  parts.push('제일 큰 친구 · <b>' + TIERS[maxTier].n + '</b>');
  if(stat.pops) parts.push('보늘 ' + stat.pops + '번 돌려보냄');
  parts.push(isBest ? '<b>최고 기록을 세웠습니다</b>' : '최고 ' + best + '점');
  $('resNote').innerHTML = parts.join('<br>');
  show('sResult');
}

function achLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_ach')||'{}'); }catch(e){ return {}; } }
function achUnlock(id){
  const a = achLoad(); if(a[id]) return;
  a[id] = Date.now(); try{ localStorage.setItem('somsom_ach', JSON.stringify(a)); }catch(e){}
  toast('🏅 업적 달성');

function hubReport(){
  const st = hubStats();
  st.played = st.played || {}; st.played.merge = (st.played.merge||0) + 1;
  st.chars  = st.chars  || {};
  const topK = TIERS[maxTier].k;               // 허브의 캐릭터 키와 같은 문자열이다
  st.chars[topK] = (st.chars[topK]||0) + 1; st.last = topK;
  // 도토리는 마을 공용 지갑이다. 점수 눈금이 커졌으므로 나누는 값도 같이 키운다.
  // 한 판에 30~40개 — 낙엽피하기·달리기에서 주워 오는 양과 비슷한 수준이다.
  // (칭호는 누적 2000개에서 열리므로 한 판에 수백 개를 주면 하루 만에 끝난다)
  st.coins = (st.coins||0) + Math.floor(score/200);
  try{ localStorage.setItem('somsom_stats', JSON.stringify(st)); }catch(e){}
  // 도감 — 처음 본 단계
  try{
    const dx = JSON.parse(localStorage.getItem('somsom_dex')||'{}');
    for(const k in seen) dx['merge_' + TIERS[k].k] = 1;
    localStorage.setItem('somsom_dex', JSON.stringify(dx));
  }catch(e){}
  // 마을 공통 업적 — 합체로도 채워질 수 있어야 한다
  const pl = st.played || {};
  if(pl.leaf && pl.run && pl.match)             achUnlock('all_three');
  if(pl.leaf && pl.run && pl.match && pl.defense) achUnlock('all_four');
  if(Object.keys(st.chars||{}).length >= 6)     achUnlock('all_chars');
  if((st.coins||0) >= 500)                      achUnlock('coins_500');
  // 합체 업적
  if(merges > 0)          achUnlock('merge_first');
  if(maxTier >= 4)        achUnlock('merge_kkito');
  if(maxTier >= TOP_TIER) achUnlock('merge_boneul');
  if(maxChain >= 6)       achUnlock('merge_chain6');
  if(score >= 4000)       achUnlock('merge_4000');
  // 오늘의 미션
  try{
    const mk = String(new Date().getFullYear()*10000 + (new Date().getMonth()+1)*100 + new Date().getDate());
    const ms = JSON.parse(localStorage.getItem('somsom_missions')||'{}');
    if(maxTier >= 3){ ms[mk] = ms[mk]||{}; ms[mk].merge = 1;
      localStorage.setItem('somsom_missions', JSON.stringify(ms)); }
  }catch(e){}
}

// ── 루프 ────────────────────────────────────────────────────
let last = 0, acc = 0;
const FIXED = 1/120;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(!(dt>0)) dt = 0;
  dt = Math.min(0.05, dt);

  if(mode==='PAUSE'){ draw(); return; }
  if(mode==='PLAY'){
    if(dropLock>0) dropLock -= dt;
    if(tut>0) tut -= dt;
    if(chainT>0){ chainT -= dt; if(chainT<=0) chain = 0; }
    if(shake>0) shake -= dt;
    for(const b of bodies) if(b.faceT>0){ b.faceT -= dt; if(b.faceT<=0){ b.face=null; b.faceT=0; } }
    acc += dt;
    let guard = 0;
    while(acc >= FIXED && guard++ < 8){
      stepPhysics(FIXED);
      let n = 0;
      while(resolveMerges() && n++ < 6){}
      acc -= FIXED;
    }
    checkOver(dt);
  }
  for(let i=pops.length-1;i>=0;i--){ pops[i].t += dt; if(pops[i].t>0.35) pops.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t += dt; f.y -= 46*dt; if(f.t>0.95) floats.splice(i,1); }
  for(let i=ghosts.length-1;i>=0;i--){ const g=ghosts[i]; g.t += dt; g.y -= 95*dt; if(g.t>1.05) ghosts.splice(i,1); }
  draw();
}

// ── 그리기 ──────────────────────────────────────────────────
function drawChar(t, x, y, r, alpha, face){
  const T = TIERS[t];
  const im = (face==='hit' && IMG_HIT[T.k]) || (face==='win' && IMG_WIN[T.k]) || IMG[T.k];
  ctx.save();
  if(alpha!=null) ctx.globalAlpha = alpha;
  // 바탕 원 — 실루엣이 또렷해야 단계가 구분된다
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.fillStyle = T.c; ctx.globalAlpha = (alpha==null?1:alpha) * 0.28; ctx.fill();
  ctx.globalAlpha = (alpha==null?1:alpha);
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#221E18'; ctx.stroke();
  if(im){
    const h = r*2*T.sc*0.72, w = h*(im.width/im.height);
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r-1.5, 0, 7); ctx.clip();
    ctx.drawImage(im, x-w/2, y-h/2 + r*0.10, w, h);
    ctx.restore();
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#FDFBF5'; ctx.fillRect(0,0,W,H);
  const sx = shake>0 ? (Math.random()-0.5)*7 : 0;
  ctx.save(); ctx.translate(sx,0);

  // 벽 — HUD 아래를 상점 벽으로 덮는다 (cover 맞춤, 위쪽 정렬)
  drawWall(ctx, 0, HUD, W, H-HUD);
  drawCrate();
  // 몸통
  for(const b of bodies) drawChar(b.t, b.x, b.y, b.r, null, b.face);
  // 보늘 소멸 — 떠올라 사라지는 둘
  for(const g of ghosts){
    const k = g.t/1.05;
    drawChar(TOP_TIER, g.x, g.y, g.r*(1+k*0.25), 1-k, 'win');
  }
  // 합체 이펙트
  for(const p of pops){
    const k = p.t/0.35;
    ctx.strokeStyle = 'rgba(224,161,43,'+(1-k)+')';
    ctx.lineWidth = 3*(1-k)+1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(1+k*0.8), 0, 7); ctx.stroke();
  }
  // 점수 글자
  for(const f of floats){
    const k = f.t/0.95, a = k<0.7 ? 1 : (1-k)/0.3;
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = (f.big ? '900 22px' : '900 15px') + ' sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = '#FDFBF5'; ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = f.big ? '#D8542F' : '#8A5A12'; ctx.fillText(f.txt, f.x, f.y);
    ctx.restore();
  }
  ctx.restore();

  // 손에 든 것 + 낙하 가이드
  if(mode==='PLAY' && cur){
    const r = TIERS[cur.t].r;
    ctx.strokeStyle = 'rgba(34,30,24,.18)'; ctx.lineWidth = 2; ctx.setLineDash([4,7]);
    ctx.beginPath(); ctx.moveTo(cur.x, BOX.y-4); ctx.lineTo(cur.x, BOX.y+BOX.h); ctx.stroke();
    ctx.setLineDash([]);
    drawChar(cur.t, cur.x, BOX.y - r - 8, r, dropLock>0 ? 0.35 : 1);
  }
  // 오늘의 규칙 — 보통 날이면 안 그린다
  if((mode==='PLAY' || mode==='PAUSE') && RULE.k !== 'plain'){
    ctx.save(); ctx.font = '800 10.5px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const msg = '오늘의 규칙 · ' + RULE.n, tw = ctx.measureText(msg).width;
    ctx.fillStyle = 'rgba(34,30,24,.78)';
    ctx.beginPath(); ctx.roundRect(W-14-tw-16, HUD+8, tw+16, 22, 11); ctx.fill();
    ctx.fillStyle = '#FDFBF5'; ctx.fillText(msg, W-22, HUD+19);
    ctx.restore();
  }
  // 바꾸기 칸
  if(mode==='PLAY' || mode==='PAUSE'){
    const h = holdPos(), on = holdLeft > 0;
    ctx.save(); ctx.globalAlpha = on ? 1 : 0.4;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7);
    ctx.fillStyle = '#F4EFE1'; ctx.fill();
    ctx.setLineDash(hold==null ? [4,4] : []); ctx.lineWidth = 2; ctx.strokeStyle = '#221E18'; ctx.stroke();
    ctx.setLineDash([]);
    if(hold != null) drawChar(hold, h.x, h.y, h.r-5);
    ctx.fillStyle = '#8A8271'; ctx.font = '800 10px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('바꾸기 ' + holdLeft, h.x, h.y + h.r + 10);
    ctx.restore();
  }
  drawHud();
}
function drawCrate(){
  // 통 — 나무 상자. 안쪽은 크림에 널빤지를 옅게 깔아 조각이 잘 읽히게 한다
  if(PLANK && !PLANK_PAT){ try{ PLANK_PAT = ctx.createPattern(PLANK, 'repeat'); }catch(e){} }
  ctx.fillStyle = '#F4EFE1';
  ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
  if(PLANK_PAT){
    ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = PLANK_PAT;
    ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h); ctx.restore();
  }
  // 넘침선
  ctx.strokeStyle = overT>0 ? '#E0605F' : '#C9BFA8';
  ctx.lineWidth = 2; ctx.setLineDash([7,6]);
  ctx.beginPath(); ctx.moveTo(BOX.x, LINE); ctx.lineTo(BOX.x+BOX.w, LINE); ctx.stroke();
  ctx.setLineDash([]);
  // 상자 널빤지 테두리 (좌·우·아래) — 통의 바깥쪽 여백에 그린다
  const RW = Math.max(9, Math.min(13, Math.round(BOX.x*0.6)));
  const rails = [[BOX.x-RW, BOX.y-6, RW, BOX.h+6+RW], [BOX.x+BOX.w, BOX.y-6, RW, BOX.h+6+RW],
                 [BOX.x-RW, BOX.y+BOX.h, BOX.w+RW*2, RW]];
  for(const [rx,ry,rw,rh] of rails){
    ctx.fillStyle = PLANK_PAT || '#D8BC93'; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = 'rgba(120,80,40,.18)'; ctx.fillRect(rx, ry, rw, rh);   // 안쪽보다 조금 진하게
    ctx.strokeStyle = '#221E18'; ctx.lineWidth = 2.5; ctx.strokeRect(rx+1, ry+1, rw-2, rh-2);
  }
}
function drawWall(g, x, y, w, h){
  if(!BG_WALL) return;
  const iw = BG_WALL.width, ih = BG_WALL.height;
  const k = Math.max(w/iw, h/ih), dw = iw*k, dh = ih*k;
  g.drawImage(BG_WALL, x+(w-dw)/2, y, dw, dh);
}

function drawHud(){
  ctx.fillStyle = '#FDFBF5'; ctx.fillRect(0,0,W,HUD);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#221E18'; ctx.font = '900 24px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(Math.round(score), 14, HUD/2);
  ctx.fillStyle = '#8A8271'; ctx.font = '800 11.5px sans-serif';
  ctx.fillText('최고 ' + best, 14, HUD/2 + 18);
  // 남은 조각 — 이 게임의 한 판 길이
  if(mode==='PLAY' || mode==='PAUSE'){
    const warn = left <= 8;
    ctx.textAlign = 'center';
    ctx.fillStyle = warn ? '#D8542F' : '#8A8271';
    ctx.font = '800 10.5px sans-serif';
    ctx.fillText('남은 조각', W/2-16, HUD/2-9);
    ctx.font = '900 19px sans-serif';
    ctx.fillStyle = warn ? '#D8542F' : '#221E18';
    ctx.fillText(String(left), W/2-16, HUD/2+9);
  }
  // 다음
  if(mode==='PLAY' || mode==='PAUSE'){
    ctx.fillStyle = '#8A8271'; ctx.font = '800 11px sans-serif'; ctx.textAlign = 'right';
    if(cur){ ctx.fillText('다음', W-104, HUD/2); drawChar(nextT, W-70, HUD/2, 17); }
    else { ctx.fillText('마지막', W-104, HUD/2); }
    // 일시정지 버튼
    ctx.strokeStyle = '#221E18'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(W-40, HUD/2-14, 28, 28, 7); ctx.stroke();
    ctx.fillStyle = '#221E18';
    if(mode==='PLAY'){ ctx.fillRect(W-31,HUD/2-7,4,14); ctx.fillRect(W-24,HUD/2-7,4,14); }
    else { ctx.beginPath(); ctx.moveTo(W-30,HUD/2-8); ctx.lineTo(W-18,HUD/2); ctx.lineTo(W-30,HUD/2+8); ctx.fill(); }
  }
  // 튜토리얼 한 줄
  if(mode==='PLAY' && tut>0){
    const msg = tutMerged ? '둘이 만나 한 뼘 커졌습니다 · 왼쪽 칸을 누르면 조각을 바꿔 둘 수 있습니다'
                          : '조각 ' + DROPS_MAX + '개로 몇 점까지 · 문질러 자리를 고르고 손을 떼면 떨어집니다';
    ctx.globalAlpha = Math.min(1, tut);
    ctx.fillStyle = 'rgba(34,30,24,.88)';
    ctx.font = '800 13px sans-serif'; ctx.textAlign = 'center';
    const tw = ctx.measureText(msg).width;
    ctx.beginPath(); ctx.roundRect(W/2-tw/2-13, BOX.y+BOX.h-56, tw+26, 32, 9); ctx.fill();
    ctx.fillStyle = '#FDFBF5'; ctx.textBaseline = 'middle';
    ctx.fillText(msg, W/2, BOX.y+BOX.h-40);
    ctx.globalAlpha = 1;
  }
  // 일시정지 덮개
  if(mode==='PAUSE'){
    ctx.fillStyle = 'rgba(253,251,245,.86)'; ctx.fillRect(0,HUD,W,H-HUD);
    ctx.fillStyle = '#221E18'; ctx.font = '900 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('잠깐 멈춤', W/2, H/2-10);
    ctx.font = '800 13px sans-serif'; ctx.fillStyle = '#6B6357';
    ctx.fillText('오른쪽 위 버튼을 다시 누르면 이어집니다', W/2, H/2+18);
  }
}

// ── 타이틀의 사다리 안내 ────────────────────────────────────
function buildLadder(){
  const el = $('ladder'); el.innerHTML = '';
  TIERS.forEach((t,i)=>{
    if(i){ const a=document.createElement('span'); a.className='ar'; a.textContent='›'; el.appendChild(a); }
    const d = document.createElement('div'); d.className='lb';
    const im = document.createElement('img');
    im.src = '../assets/sd_'+t.k+'_t.png';
    im.style.height = (16 + i*5) + 'px'; im.style.width = 'auto';
    im.alt = t.n;
    const n = document.createElement('span'); n.className='ln'; n.textContent = t.n;
    d.appendChild(im); d.appendChild(n); el.appendChild(d);
  });
}

// ── 버튼 ────────────────────────────────────────────────────
$('btnGo').onclick    = startGame;
$('btnRetry').onclick = startGame;
$('btnHome').onclick  = ()=>{ mode='TITLE'; show('sTitle'); refreshTitle(); };
$('btnMute').onclick  = ()=>{
  muted = !muted;
  try{ localStorage.setItem('somsom_muted', muted?'1':'0'); }catch(e){}
  $('btnMute').textContent = muted?'🔇':'🔊';
  if(!muted) sfx('drop');
};
function refreshTitle(){
  $('btnMute').textContent = muted?'🔇':'🔊';
  RULE = window.FORCE_RULE || todayRule();
  $('titleHint').innerHTML = '오늘의 통 · ' + dayLabel() + ' · <b>' + RULE.n + '</b>'
    + (RULE.d ? ' — ' + RULE.d : ' · 모두 같은 순서로 떨어집니다') + '<br>' + (best
    ? ('최고 ' + best + '점 · 제일 큰 친구 ' + TIERS[bestTier].n)
    : ('조각 ' + DROPS_MAX + '개로 몇 점까지 쌓을 수 있을까요'));
}

buildLadder();
refreshTitle();
show('sTitle');
requestAnimationFrame(t=>{ last = t; frame(t); });
</script>
