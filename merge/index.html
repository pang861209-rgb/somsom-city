<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>솜솜시티: 솜솜 합체</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#221E18;overflow:hidden;
    font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#221E18;
    -webkit-user-select:none;user-select:none;}
  #app{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;
    background:#FDFBF5;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:15px;padding:24px;background:#FDFBF5;z-index:5;}
  .screen.hidden{display:none;}
  /* 타이틀 — 솜솜시티 공통 히어로 구성 (짝맞추기·방범대와 같은 틀) */
  #sTitle{padding:0;gap:0;justify-content:flex-start;overflow:hidden;
    background:linear-gradient(#efd9b8 0%,#e3c39a 60%,#caa26a 100%);}
  #titleBg{position:absolute;left:0;top:0;width:100%;height:calc(100% - 190px);object-fit:cover;
    object-position:center 68%;z-index:0;}
  #titleTop{position:relative;z-index:2;margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:9px;}
  .logoTop{font-size:13px;font-weight:800;color:#fff7e8;letter-spacing:5px;text-shadow:0 2px 0 rgba(96,58,38,.5);}
  #titleLogo{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:46px;line-height:1.1;font-weight:900;
    color:#fff7e8;letter-spacing:2px;transform:rotate(-2deg);margin:0;
    text-shadow:0 3px 0 #7c4a2d,0 7px 16px rgba(60,30,20,.4);}
  #titleSub{font-size:12px;font-weight:700;color:#5a4130;background:rgba(255,247,232,.88);
    border:1.5px solid rgba(124,74,45,.5);border-radius:20px;padding:5px 14px;}
  #titleBottom{position:absolute;left:0;right:0;bottom:0;z-index:2;height:190px;padding:9px 16px 10px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:linear-gradient(#402419,#2f1a12);border-top:1.5px solid rgba(255,239,216,.16);
    box-shadow:0 -10px 22px rgba(40,20,10,.28);}
  #titleBottom #ladder .ln{color:#d9c9ad;}
  #titleBottom #ladder .ar{color:#8a7658;}
  #goRow{gap:8px;flex-wrap:nowrap;}
  #titleBottom #btnGo, #titleBottom #btnPuzzle{font-size:16px;padding:11px 20px;border-radius:16px;
    border:2px solid #5a2f1c;color:#4a2416;box-shadow:0 4px 0 #5a2f1c;white-space:nowrap;}
  #titleBottom #btnGo{background:#ffb35c;}
  #titleBottom #btnPuzzle{background:#f3e3c4;}
  #titleBottom #btnGo:active, #titleBottom #btnPuzzle:active{transform:translateY(4px);box-shadow:none;}
  #resBig .stars{font-size:26px;letter-spacing:3px;color:#E0A12B;line-height:1.1;}
  #titleFoot{gap:7px;align-items:center;flex-wrap:nowrap;}
  #titleFoot .ghost{padding:5px 13px;font-size:12.5px;}
  #evBand{position:absolute;top:12px;right:12px;z-index:3;background:#2A2350;color:#FFE9B0;
    border:1.5px solid #FFE9B0;border-radius:14px;padding:5px 11px;font-size:11.5px;font-weight:800;
    box-shadow:0 2px 0 rgba(0,0,0,.25);}
  #evBand.hidden{display:none;}
  #skinGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .skin{border:2px solid #221E18;border-radius:13px;overflow:hidden;background:#FDFBF5;cursor:pointer;text-align:left;
    padding:0;box-shadow:none;font:inherit;}
  .skin .sw{height:66px;background-size:120px;border-bottom:2px solid #221E18;}
  .skin .sn{display:block;padding:7px 9px 1px;font-size:13px;font-weight:900;}
  .skin .ss{display:block;padding:0 9px 8px;font-size:11px;font-weight:800;color:#8A8271;}
  .skin.on{box-shadow:0 0 0 3px #E0A12B;}
  .skin.lock .sw{filter:grayscale(1) brightness(.75);opacity:.55;}
  .wn{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border:1.5px solid #E6DCC6;border-radius:11px;background:#FFF9EC;}
  .wn b{font-size:14px;}
  .wn span{font-size:12.5px;color:#6B6357;line-height:1.5;}
  #wnClose{align-self:center;margin-top:6px;}
  /* 앨범 — 모은 컷을 3열 격자로. 295장이라 안 연 칸은 그리지 않고 수만 적는다 */
  #albumGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
  #albumGrid .agrp{grid-column:1/-1;font-size:12px;font-weight:800;color:#8A6A1A;padding:6px 2px 0;}
  #albumGrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;
    border:1.5px solid #221E18;cursor:zoom-in;background:#F4EFE1;}
  #titleBottom .ghost{padding:4px 10px;font-size:12px;background:rgba(255,239,216,.14);color:#f3e6cf;
    border-color:rgba(255,239,216,.35);box-shadow:none;}
  #titleBottom #titleHint{font-size:10.5px;color:rgba(255,239,216,.72);line-height:1.45;
    text-align:center;margin:0;}
  /* 결과는 통을 가리지 않는다 — 끝난 통 모습이 "내 통 봐"가 된다 */
  #sResult{background:rgba(253,251,245,.28);justify-content:flex-end;padding-bottom:26px;}
  @keyframes cardUp{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
  #sResult .card{animation:cardUp .4s ease-out;background:#FDFBF5;border:2px solid #221E18;border-radius:18px;
    box-shadow:3px 3px 0 #221E18;padding:18px 22px 20px;display:flex;flex-direction:column;
    align-items:center;gap:10px;max-width:340px;width:100%;}
  button{border:2px solid #221E18;background:#fff;border-radius:11px;padding:11px 22px;
    font-size:16px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #221E18;
    font-family:inherit;color:#221E18;}
  button:active{transform:translate(2px,2px);box-shadow:0 0 0 #221E18;}
  button.big{padding:14px 32px;font-size:18px;background:#E0A12B;}
  button.ghost{background:#F3EEE2;font-size:14px;padding:8px 16px;box-shadow:1px 1px 0 #221E18;}
  h1{font-family:'Black Han Sans',sans-serif;font-size:32px;margin:0;letter-spacing:-1px;}
  .sub{font-size:13px;color:#6B6357;text-align:center;line-height:1.6;margin:0;}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .top{position:absolute;top:10px;left:10px;z-index:6;}
  .top a{text-decoration:none;border:2px solid #221E18;background:#F3EEE2;border-radius:11px;
    padding:7px 13px;font-size:13px;font-weight:800;box-shadow:1px 1px 0 #221E18;color:#221E18;}
  /* 사다리 안내 */
  #ladder{display:flex;align-items:flex-end;gap:2px;justify-content:center;flex-wrap:wrap;
    max-width:360px;}
  #ladder .lb{display:flex;flex-direction:column;align-items:center;gap:1px;}
  #ladder img{display:block;}
  #ladder .ln{font-size:9.5px;color:#8A8271;font-weight:800;}
  #ladder .ar{font-size:11px;color:#C6BEAE;padding-bottom:14px;}
  #resCut{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;}
  #resCut.hidden{display:none;}
  /* 삽화는 3:4 세로다. width:100% + max-height 로 자르면 절반이 날아간다. */
  #resCut img{height:210px;width:auto;max-width:100%;object-fit:contain;
    border-radius:13px;border:2px solid #221E18;box-shadow:2px 2px 0 #221E18;cursor:zoom-in;}
  #resCut span{font-size:11.5px;font-weight:800;color:#8A6A1A;}
  /* 컷 크게 보기 */
  #cutBig{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(34,30,24,.88);padding:18px;}
  #cutBig.on{display:flex;}
  #cutBig img{max-width:100%;max-height:100%;border-radius:13px;border:2px solid #FDFBF5;}
  #resBig{font-size:34px;font-weight:900;font-family:'Black Han Sans',sans-serif;color:#E0A12B;}
  /* 오늘의 순위판 — 아래에서 올라오는 시트 */
  .sheetWrap{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
    background:rgba(34,30,24,.45);}
  .sheetWrap.on{display:flex;}
  .sheet{background:#FDFBF5;border:2px solid #221E18;border-bottom:0;border-radius:18px 18px 0 0;width:100%;
    max-height:72%;overflow:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;}
  .sheet .hd{display:flex;justify-content:space-between;align-items:baseline;}
  .sheet .t{font-family:'Black Han Sans',sans-serif;font-size:21px;}
  .sheet .c{font-size:12px;color:#8A8271;font-weight:800;}
  .bRow{display:flex;gap:10px;align-items:center;padding:8px 8px;border-bottom:1px solid #EFE7D6;font-weight:800;font-size:14px;}
  .bRow.me{background:#FFF1CC;border-radius:9px;border-bottom-color:transparent;}
  .bRow .rk{width:30px;color:#8A8271;font-size:12px;}
  .bRow .nm{flex:1;}
  .bRow .sc{color:#C98A12;font-family:'Black Han Sans',sans-serif;font-size:17px;}
  .bMsg{padding:18px 6px;text-align:center;color:#6B6357;font-size:13px;line-height:1.6;}
  .tabs{display:flex;gap:6px;}
  .tab{flex:1;padding:7px 0;font-size:13px;background:#F3EEE2;box-shadow:none;border-radius:9px;}
  .tab.on{background:#E0A12B;}
  .sheet .ghost{align-self:center;margin-top:4px;}
  #toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:20;
    background:#221E18;color:#FDFBF5;border-radius:10px;padding:7px 14px;font-size:13px;
    font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
  #toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="toast"></div>

  <!-- 타이틀 -->
  <div id="sTitle" class="screen">
    <img id="titleBg" src="../assets/title_hero_merge.jpg" alt="도토리 상점의 나무 상자 안에 차곡차곡 쌓인 여섯 친구">
    <div class="top"><a href="../">← 마을</a></div>
    <div id="evBand" class="hidden"></div>
    <div id="titleTop">
      <div class="logoTop">솜솜시티</div>
      <h1 id="titleLogo">솜솜 합체</h1>
      <div id="titleSub">같은 친구 둘이 만나면 <b>한 뼘 더 큰 친구</b>가 됩니다</div>
    </div>
    <div id="titleBottom">
      <div id="ladder"></div>
      <div class="row" id="goRow">
        <button class="big" id="btnGo">떨어뜨리기</button>
        <button class="big" id="btnPuzzle">오늘의 퍼즐</button>
      </div>
      <div class="row" id="titleFoot">
        <button class="ghost" id="btnMute">🔊</button>
        <button class="ghost" id="btnBoard">순위</button>
        <button class="ghost" id="btnAlbum">앨범</button>
        <button class="ghost" id="btnSkin">상자</button>
      </div>
      <p id="titleHint"></p>
    </div>
  </div>

  <!-- 결과 -->
  <div id="sResult" class="screen hidden">
    <div class="card">
      <h1 style="font-size:24px;" id="resTitle">한 판 끝</h1>
      <div id="resBig">0</div>
      <p class="sub" id="resNote"></p>
      <div id="resCut" class="hidden">
        <img id="resCutImg" alt="새로 열린 솜솜시티 한 컷">
        <span id="resCutCap"></span>
      </div>
      <div class="row">
        <button class="big" id="btnRetry">한 판 더</button>
        <button class="ghost" id="btnShare">자랑하기</button>
        <button class="ghost" id="btnBoard2">순위</button>
        <button class="ghost" id="btnHome">타이틀</button>
      </div>
    </div>
  </div>

  <div id="cutBig"><img id="cutBigImg" alt="솜솜시티 한 컷"></div>

  <!-- 자랑하기 — 공유 시트가 없는 곳에서는 여기 띄운다 -->
  <div id="shareSheet" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">자랑하기</span><span class="c">길게 눌러 저장하거나 보내세요</span></div>
      <img id="shareImg" alt="결과 이미지" style="width:100%;border-radius:12px;border:2px solid #221E18;">
      <button class="ghost" id="shareClose">닫기</button>
    </div>
  </div>

  <!-- 상자 꾸미기 -->
  <div id="skinSheet" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">상자 꾸미기</span><span class="c">업적으로 열려요</span></div>
      <div id="skinGrid"></div>
      <button class="ghost" id="skinClose">닫기</button>
    </div>
  </div>

  <!-- 새로워진 것 -->
  <div id="wnSheet" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">새로워진 것</span><span class="c">v3 · 한가위 업데이트</span></div>
      <div class="wn"><b>오늘의 퍼즐</b><span>반쯤 찬 통에, 전부 보이는 조각 12개로 최대한 높이. 하루 한 문제, 모두 같은 문제입니다.</span></div>
      <div class="wn" id="wnEvent"><b>한가위 보름달</b><span>10월 5일까지. 보름달 벽, 보늘 소멸 1.5배, 한가위 컷 3장.</span></div>
      <div class="wn"><b>상자 꾸미기</b><span>보늘 10번 · 과열 10번 · 완벽 정리로 새 상자가 열립니다.</span></div>
      <button class="big" id="wnClose">좋아요</button>
    </div>
  </div>

  <!-- 앨범 -->
  <div id="album" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">앨범</span><span class="c" id="albumCount"></span></div>
      <div id="albumGrid"></div>
      <div class="bMsg" id="albumMsg"></div>
      <button class="ghost" id="albumClose">닫기</button>
    </div>
  </div>

  <!-- 오늘의 순위판 -->
  <div id="board" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">순위</span><span class="c" id="boardDay"></span></div>
      <div class="tabs">
        <button class="tab on" data-r="today">오늘</button>
        <button class="tab" data-r="week">이번 주</button>
        <button class="tab" data-r="all">전체</button>
      </div>
      <div id="boardList"></div>
      <button class="ghost" id="boardClose">닫기</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   솜솜시티 GAME 06 M0 — 「솜솜 합체」 (드롭 앤 머지)
   조사 문서: docs/CASUAL_GENRE_SURVEY.md

   M0 목적: 물리와 합체만으로 재미있는지 확인.
   재미없으면 여기서 멈춘다. 메타 성장·스테이지·랭킹은 아직 없다.
   ═══════════════════════════════════════════════════════════ */

// ── 합체 사다리 ─────────────────────────────────────────────
// 순서는 비주얼 바이블의 캐릭터 키 순서 그대로다.
//   미개 37 · 북거씨 43 · 라칠친 52 · 람다 61 · 끼토 91 · 보늘 100
// 반지름은 게임용으로 고르게 벌린 값이다(캐논 수치를 그대로 쓰면
// 끼토 91 → 보늘 100 구간이 거의 안 커져서 합체가 체감되지 않는다).
// R_BASE — 너비 382px 통을 기준으로 잰 반지름. 실제 반지름은 layout()에서
// 통 너비에 비례해 다시 계산한다(TIERS[i].r).
// 크기를 크게 잡은 이유: 사다리가 여섯 칸뿐이라 짝이 안 맞아 남는 조각은
// 람다·끼토·보늘 셋뿐이다. 이 셋이 통을 꽤 차지해야 비로소 판이 끝난다.
const R_BASE = [26, 35, 46, 58, 72, 92];
// r 은 여기 안 적습니다. layout() 이 통 너비에 맞춰 R_BASE 에서 계산해 넣습니다.
// (sc 는 원 안에 스프라이트를 얼마나 크게 넣을지의 비율입니다)
const TIERS = [
  { k:'migae',      n:'미개',   r:0, c:'#3A3A3A', sc:1.75 },
  { k:'bookgeo',    n:'북거씨', r:0, c:'#6E9A6A', sc:1.95 },
  { k:'lachilchin', n:'할머니', r:0, c:'#B3A8C8', sc:1.70 },
  { k:'ramda',      n:'람다',   r:0, c:'#C87F4A', sc:1.70 },
  { k:'kkito',      n:'끼토',   r:0, c:'#E9A8BE', sc:1.60 },
  { k:'boneul',     n:'보늘',   r:0, c:'#9AA39B', sc:1.55 },
];
const TOP_TIER = TIERS.length - 1;
// 합체 점수 — 위로 갈수록 가파르게.
// 예전 값 [1,3,6,12,24,50] · 연쇄 배수 0.5 로는 점수의 4/5가 연쇄에서 나왔고,
// 연쇄는 운이라 무작위 봇 1280 · 사람 봇 1298 · 완벽한 봇 1354로 실력 차가
// 6%밖에 안 났습니다(조각 50개, 같은 시드). 랭킹이 뜻을 가지려면 점수가
// "얼마나 높이 올렸나"를 따라야 하므로 위쪽을 가파르게 올리고 연쇄를 낮췄습니다.
const MERGE_SCORE = [0, 5, 15, 45, 130, 400];
const POP_SCORE = 800;   // 보늘 둘이 만나 사라질 때 — 한 판의 승부처
// 연쇄 배수 — 4연쇄부터 확 오른다. 조각 60개로 얻을 수 있는 재료는
// 보늘 4개어치(140단위)가 끝이라 재료로는 6000~7500점이 천장이다.
// 천장을 뚫는 건 재료가 아니라 배수이고, 배수는 통을 읽고 일부러
// 쌓아야 나온다. n 은 이번 합체 직전까지의 연쇄 수.
//   0→×1  1→×1.6  2→×2.2  3→×3.0  4→×4.0  5→×5.1  6→×6.4  8↑→×9(상한)
function chainMul(n){ return Math.min(9, 1 + 0.5*n + 0.1*n*n); }
const CHAIN_WINDOW = 0.75;   // 이 안에 이어지면 연쇄 (0.55 → 여유를 줬다)
const FEVER_AT = 4;          // 이 연쇄를 내면 과열
const FEVER_TIME = 8;        // 과열 지속 (초). 과열 중 또 내면 다시 채운다
const FEVER_MUL = 2;         // 과열 중 모든 점수
const CLEAR_SCORE = 1500;    // 통을 깨끗이 비웠을 때
const CLEAR_DROPS = 5;       // 그때 더 주는 조각
// 떨어뜨릴 수 있는 건 아래 세 단계뿐 (윗단계는 합쳐서만 나온다)
let DROPPABLE = 3;
// 한 판에 쓸 수 있는 조각 수. 이게 이 게임의 진짜 한 판 길이다.
// 넘침만으로는 판이 안 끝난다 — 사다리가 여섯 칸뿐이라 합체 속도가 투하 속도를
// 따라잡아 통이 평형에 머문다(자동 플레이 250판으로 확인). 조각 수를 묶으면

// 규칙은 숫자만 바꾼다. 새 조작·새 조각·새 캐릭터는 없다.
const RULES = [
  { k:'plain',   n:'보통 날',           d:'',                                        w:2 },
  { k:'migae',   n:'미개가 많은 날',     d:'작은 친구가 자주 옵니다',                   w:1, weights:[.55,.30,.15] },

];
function todayRule(){
  const r = mulberry32(dayKey()*31 + 7)();
  const tot = RULES.reduce((a,x)=>a+x.w, 0);
  let acc = 0;
  for(const R of RULES){ acc += R.w/tot; if(r < acc) return R; }
  return RULES[0];
}
let RULE = todayRule();

let bodies = [];              // {x,y,vx,vy,r,t,id,born}
let cur = null;               // 손에 든 것 {t, x}
const REF_W = 382;            // R_BASE 를 잰 기준 통 너비
// 통 높이 = 너비 × 이 값(상한). 화면 세로를 그대로 쓰면 끝없이 깊은 통이
// 되지만, 너무 낮게 묶으면 세로로 긴 폰에서 위쪽이 텅 빈 채로 남는다.
// 420×680 에서는 애초에 이 상한에 못 미치므로(1.29) 값이 걸리지 않고,
// 긴 폰에서만 작동한다.
let BOX_RATIO = 1.9;

function layout(){
  const r = cv.getBoundingClientRect();
  W = Math.max(300, Math.round(r.width || 420));
  H = Math.max(420, Math.round(r.height || 680));
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  const margin = Math.max(10, Math.round(W*0.045));
  BOX.x = margin; BOX.w = W - margin*2;
  // 조각 크기를 통 너비에 비례시킨다.
  // 고정 픽셀로 두면 좁은 폰에서만 통이 빨리 차서, 기기에 따라 난이도가 달라진다.
  const k = BOX.w / REF_W;
  TIERS.forEach((t,i)=>{ t.r = Math.max(7, Math.round(R_BASE[i]*k)); });
  // 손에 든 조각이 HUD를 가리지 않을 만큼만 위를 비운다
  const TOPGAP = TIERS[DROPPABLE-1].r*2 + 20;
  // 통 높이는 너비의 1.45배로 묶는다. 화면 세로 길이를 그대로 쓰면
  // 긴 폰일수록 통이 깊어져서 같은 게임이 기기마다 쉬워진다.
  BOX.h = Math.min(Math.round(BOX.w*BOX_RATIO), H - (HUD+TOPGAP) - margin);
  BOX.h = Math.max(220, BOX.h);
  if(RULE.boxH) BOX.h = Math.round(BOX.h * RULE.boxH);   // 통이 얕은 날
  BOX.y = Math.max(HUD + TOPGAP, H - margin - BOX.h);   // 통은 아래에 붙인다
  LINE = BOX.y;
  // 화면이 바뀌면 이미 놓인 것도 같이 줄이고 통 안으로 넣는다
  for(const b of bodies){
    b.r = TIERS[b.t].r;
    if(b.rT){ b.rT = b.r; b.r0 = Math.min(b.r0, b.r); }
    b.x = Math.max(BOX.x+b.r, Math.min(BOX.x+BOX.w-b.r, b.x));
    b.y = Math.min(BOX.y+BOX.h-b.r, b.y);
  }
  if(cur){ const cr = TIERS[cur.t].r;
           cur.x = Math.max(BOX.x+cr+1, Math.min(BOX.x+BOX.w-cr-1, cur.x)); }
}

// 숙제를 끝내면 연속 일수를 올린다. 어제 한 게 아니면 1부터 다시.
function questSave(){
  const q = questLoad(), d = dayKey();
  if(q.day === d) return q.streak || 1;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yk = y.getFullYear()*10000 + (y.getMonth()+1)*100 + y.getDate();
  const streak = (q.day === yk ? (q.streak||0) : 0) + 1;
  try{ localStorage.setItem(QKEY, JSON.stringify({ day:d, streak })); }catch(e){}
  return streak;
}

const CUT_KEY = 'somsom_merge_cuts';
function cutsSeen(){ try{ return JSON.parse(localStorage.getItem(CUT_KEY)||'[]'); }catch(e){ return []; } }
function unlockCut(){
  if(score < CUT_AT) return null;
  const seen = cutsSeen();
  const left = CUTS.filter(c => seen.indexOf(c) < 0);
  if(!left.length) return null;                       // 295장을 다 모았다
  const pick = left[(mulberry32(dayKey()*131 + plays)() * left.length) | 0];
  seen.push(pick);
  try{ localStorage.setItem(CUT_KEY, JSON.stringify(seen)); }catch(e){}
  return pick;
}

let AC=null, muted = localStorage.getItem('somsom_muted')==='1';
function ac(){
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,d,type,g,when,slide){
  const a=ac(), o=a.createOscillator(), gn=a.createGain(), t0=a.currentTime+(when||0);
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  gn.gain.setValueAtTime(g||0.06,t0); gn.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0+d+0.02);
}
function sfx(name, tier){
  if(muted) return;
  try{
    if(name==='drop') tone(200,0.07,'triangle',0.05);
    else if(name==='merge'){
      // 단계가 올라갈수록 높은 음 — 합체가 귀로도 느껴지게
      const base = 420 + (tier||0)*110;
      tone(base,0.10,'sine',0.055); tone(base*1.5,0.13,'sine',0.05,0.055);
    }
    else if(name==='chain') tone(1200,0.16,'square',0.045,0,1700);
    else if(name==='shake'){ tone(150,0.22,'triangle',0.05,0,90); tone(300,0.16,'sine',0.035,0.05); }
    else if(name==='fever'){ [440,554,659,880,1108].forEach((f,i)=>tone(f,0.3,'square',0.06,i*0.07)); }
    else if(name==='swap'){ tone(660,0.06,'triangle',0.045); tone(880,0.07,'triangle',0.04,0.06); }
    else if(name==='top'){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.22,'square',0.055,i*0.10)); }
    else if(name==='over'){ [392,311,233].forEach((f,i)=>tone(f,0.26,'triangle',0.065,i*0.18)); }
  }catch(e){}
}
function buzz(ms){ if(muted) return; try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

// 오늘의 통 — 하루 동안 모든 사람에게 같은 조각 순서가 나온다.

function dayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function dayLabel(){ const d=new Date(); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rng = Math.random;
// ── 오늘의 퍼즐 ─────────────────────────────────────────────
// 이미 반쯤 찬 통에, 전부 보이는 조각 12개로, 최대한 높이. 운이 없는 짧은 생각.
// 시작 통은 기준 상자(382×491)에서 가라앉혀 비율로 옮긴다 — 기기가 달라도 같은 문제.
let GMODE = 'daily';              // daily | puzzle
const PUZZLE_N = 12;
const PKEY = 'somsom_merge_puzzle';
let pq = [], pqi = 0;             // 퍼즐 조각 줄과 다음 꺼낼 자리
function puzzleRng(){ return mulberry32(dayKey()*9973 + 41); }
function puzzleLoad(){ try{ const p = JSON.parse(localStorage.getItem(PKEY)||'{}'); return p.day===dayKey() ? p : {day:dayKey()}; }catch(e){ return {day:dayKey()}; } }
function puzzleStars(){ return (maxTier>=4?1:0) + (maxTier>=5?1:0) + ((stat.pops>0||clears>0)?1:0); }
function starText(n){ return '★'.repeat(n) + '☆'.repeat(3-n); }
function buildPuzzle(){
  const r = puzzleRng(), REF_H = 491;
  const save = { x:BOX.x, y:BOX.y, w:BOX.w, h:BOX.h };
  BOX.x = 0; BOX.y = 0; BOX.w = REF_W; BOX.h = REF_H;
  bodies = [];
  const n = 7 + ((r()*3)|0), pool = [0,1,1,2,2,2,3,3];
  for(let i=0;i<n;i++){
    const t = pool[(r()*pool.length)|0], rr = R_BASE[t];
    bodies.push({ x: rr + r()*(REF_W-2*rr), y: -rr-8, vx:0, vy:0, r:rr, t, id:nextId++, born:5 });
    for(let k=0;k<90;k++) stepPhysics(FIXED);
  }
  // 같은 단계끼리 닿아 있으면 시작하자마자 저절로 합쳐진다. 한 단계 올려 다시 가라앉힌다.
  for(let pass=0; pass<6; pass++){
    for(let k=0;k<240;k++) stepPhysics(FIXED);
    let bumped = false;
    for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++){
      const a = bodies[i], c = bodies[j];
      if(a.t !== c.t || c.t >= 4) continue;
      if(Math.hypot(c.x-a.x, c.y-a.y) > (a.r+c.r)*1.04) continue;
      c.t++; c.r = R_BASE[c.t]; bumped = true;
    }
    if(!bumped) break;
  }
  const snap = bodies.map(b => ({ fx:b.x/REF_W, fyb:(REF_H-b.y)/REF_W, t:b.t }));
  BOX.x = save.x; BOX.y = save.y; BOX.w = save.w; BOX.h = save.h;
  bodies = snap.map(q => ({ x:BOX.x + q.fx*BOX.w, y:BOX.y + BOX.h - q.fyb*BOX.w, vx:0, vy:0,
                            r:TIERS[q.t].r, t:q.t, id:nextId++, born:5 }));
  pq = []; for(let i=0;i<PUZZLE_N+4;i++) pq.push((r()*DROPPABLE)|0);   // 4개는 바꾸기·미리 보기 여유분
  pqi = 0;
}
function pickTier(){
  if(GMODE === 'puzzle') return pqi < pq.length ? pq[pqi++] : 0;
  const w = RULE.weights;
  if(!w) return (rng()*DROPPABLE)|0;
  const r = rng(); let acc = 0;
  for(let i=0;i<DROPPABLE;i++){ acc += w[i]; if(r < acc) return i; }
  return DROPPABLE-1;
}

function startGame(m){
  GMODE = (m === 'puzzle') ? 'puzzle' : 'daily';
  bodies = []; score = 0; merges = 0; maxTier = 0; overT = 0;
  left = GMODE==='puzzle' ? PUZZLE_N : DROPS_MAX; doneT = 0; endT = 0; overReason = 'over';
  chain = 0; chainT = 0; maxChain = 0; stat = { pops:0 };
  fever = 0; feverCount = 0; comboT = 0; comboN = 0; clears = 0;
  warnT = 3; made = []; shakeLeft = 1; overGrace = 0; questDone = false;
  QUEST = todayQuest();
  pops = []; floats = []; ghosts = []; moons = []; shake = 0; dropLock = 0; tut = 0; tutMerged = 0;
  RULE = GMODE==='puzzle' ? RULES[0] : (window.FORCE_RULE || todayRule());   // 퍼즐은 규칙 없이
  layout();                                    // 자정을 넘겼을 수 있다 (FORCE_RULE 은 테스트용)
  hold = null; holdLeft = GMODE==='puzzle' ? 1 : (RULE.hold || HOLD_MAX);
  rng = mulberry32(dayKey() * 7919 + 13);      // 오늘의 통
  if(GMODE === 'puzzle'){ buildPuzzle(); shakeLeft = 0; }
  cur = { t: pickTier(), x: W/2 };
  nextT = pickTier(); nextT2 = pickTier();
  mode = 'PLAY'; show(null);
  acc = 0;                            // 이전 판의 누적 시간이 넘어오지 않게
  tut = (plays < 2 && GMODE==='daily') ? 4.5 : 0;   // 첫 두 판에만 안내 한 줄
  last = performance.now();
}

function px(ev){
  const r = cv.getBoundingClientRect();
  const c = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
  return c - r.left;
}
function togglePause(){
  if(mode==='PLAY'){ mode='PAUSE'; }
  else if(mode==='PAUSE'){ mode='PLAY'; last = performance.now(); acc = 0; }
}
function aim(ev){
  if(mode!=='PLAY' || !cur) return;
  if(!muted){ try{ ac(); }catch(e){} }
  const r = TIERS[cur.t].r;
  cur.x = Math.max(BOX.x + r + 1, Math.min(BOX.x + BOX.w - r - 1, px(ev)));
}
function hitPause(ev){
  const r = cv.getBoundingClientRect();
  const c = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0] : ev;
  const x = c.clientX - r.left, y = c.clientY - r.top;
  return x > W-46 && x < W-6 && y > HUD/2-18 && y < HUD/2+18;
}
// 바꾸기 칸 — 드롭 공간 왼쪽에 둔다. HUD는 이미 꽉 찼다.
function holdPos(){ return { x: BOX.x + 30, y: HUD + Math.round((BOX.y-HUD)/2), r: 24 }; }
function shakePos(){ return { x: BOX.x + BOX.w - 30, y: HUD + Math.round((BOX.y-HUD)/2), r: 22 }; }
function hitShake(ev){
  const rc = cv.getBoundingClientRect();
  const c = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0] : ev;
  const x = c.clientX - rc.left, y = c.clientY - rc.top, h = shakePos();
  return Math.hypot(x-h.x, y-h.y) < h.r + 12;
}
// 통을 흔들어 조각을 다시 앉힌다. 한 판 1번. 잘못 쌓았을 때의 유일한 구제책이다.
// 흔들면 조각이 위로 튀므로 1.2초 동안 넘침을 봐준다. 안 그러면 구제가 사형이 된다.
function shakeBox(){
  if(mode !== 'PLAY' || shakeLeft <= 0 || !bodies.length) return;
  shakeLeft--;
  // 중력이 1500이라 위로 v 만큼 띄우면 v²/3000 만큼 떠오른다.
  // 예전 값(190~280)으로는 18px, 즉 제자리에서 꿈틀댈 뿐이었다.
  // 480~640이면 75~135px 떠올라 조각이 실제로 자리를 바꾼다.
  for(const b of bodies){
    const small = 26 / Math.max(26, b.r);       // 작은 조각이 더 잘 튀어 틈으로 파고든다
    b.vy -= (480 + Math.random()*160) * (0.78 + small*0.30);
    b.vx += (Math.random()-0.5) * 620;
    b.face = 'hit'; b.faceT = 0.7;              // 다들 놀란 얼굴
  }
  overGrace = 1.9; shake = 0.85; sfx('shake'); buzz(70);
  toast('통을 흔들었다');
}
function hitHold(ev){
  const rc = cv.getBoundingClientRect();
  const c = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0] : ev;
  const x = c.clientX - rc.left, y = c.clientY - rc.top, h = holdPos();
  return Math.hypot(x-h.x, y-h.y) < h.r + 12;
}
function swapHold(){
  if(mode!=='PLAY' || !cur || dropLock>0) return;
  if(holdLeft <= 0){ toast('바꾸기를 다 썼습니다'); return; }
  if(hold == null){ hold = cur.t; cur = { t: nextT, x: cur.x }; nextT = nextT2; nextT2 = pickTier(); }
  else { const t = hold; hold = cur.t; cur = { t, x: cur.x }; }
  holdLeft--;
  const r = TIERS[cur.t].r;
  cur.x = Math.max(BOX.x + r + 1, Math.min(BOX.x + BOX.w - r - 1, cur.x));
  dropLock = 0.18;
  sfx('swap'); buzz(8);
}
function drop(){
  if(mode!=='PLAY' || !cur || dropLock>0) return;
  const t = cur.t, r = TIERS[t].r;
  bodies.push({ x:cur.x, y:BOX.y - r - 8, vx:0, vy:0, r, t, id:nextId++, born:0 });
  if(!seen[t]){ seen[t] = 1; saveAll(); }      // 떨어뜨린 단계도 도감에
  sfx('drop'); buzz(6);
  dropLock = 0.36;
  left--;
  if(left > 0){ cur = { t: nextT, x: cur.x }; nextT = nextT2; nextT2 = pickTier(); }
  else cur = null;                             // 마지막 조각을 놓았다
}
// 버튼을 누른 채로는 조준·투하를 안 한다
let touchOnHold = false, touchOnShake = false;
cv.addEventListener('touchstart', e=>{
  touchOnHold = hitHold(e); touchOnShake = hitShake(e);
  if(!hitPause(e) && !touchOnHold && !touchOnShake) aim(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchmove',  e=>{ if(!touchOnHold && !touchOnShake) aim(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend',   e=>{
  if(hitPause(e)){ togglePause(); e.preventDefault(); return; }
  if(touchOnHold){ touchOnHold = false; if(hitHold(e)) swapHold(); e.preventDefault(); return; }
  if(touchOnShake){ touchOnShake = false; if(hitShake(e)) shakeBox(); e.preventDefault(); return; }
  drop(); e.preventDefault();
}, {passive:false});
cv.addEventListener('mousemove',  e=>{ if(!touchOnHold && !touchOnShake) aim(e); });
cv.addEventListener('mousedown',  e=>{ touchOnHold = hitHold(e); touchOnShake = hitShake(e);
  if(!touchOnHold && !touchOnShake) aim(e); });
cv.addEventListener('mouseup',    e=>{
  if(hitPause(e)){ togglePause(); return; }
  if(touchOnHold){ touchOnHold = false; if(hitHold(e)) swapHold(); return; }
  if(touchOnShake){ touchOnShake = false; if(hitShake(e)) shakeBox(); return; }
  drop(); });
addEventListener('keydown', e=>{
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ togglePause(); return; }
  if(mode!=='PLAY' || !cur) return;
  const r = TIERS[cur.t].r;
  if(e.key==='ArrowUp'||e.key==='c'||e.key==='C'||e.key==='Shift'){ swapHold(); e.preventDefault(); return; }
  if(e.key==='s'||e.key==='S'){ shakeBox(); e.preventDefault(); return; }
  if(e.key==='ArrowLeft')  cur.x = Math.max(BOX.x+r+1, cur.x-24);
  if(e.key==='ArrowRight') cur.x = Math.min(BOX.x+BOX.w-r-1, cur.x+24);
  if(e.key===' '||e.key==='ArrowDown'){ drop(); e.preventDefault(); }
});

// ── 물리 ────────────────────────────────────────────────────
function stepPhysics(dt){
  // 적분
  for(const b of bodies){
    b.born += dt;
    if(b.rT && b.r < b.rT){                    // 합체 직후 0.12초 동안 제 크기로 부푼다
      b.gt += dt;
      b.r = Math.min(b.rT, b.r0 + (b.rT - b.r0) * (b.gt/0.12));
    }
    b.vy += GRAV*dt;
    b.vx *= AIRD; b.vy *= AIRD;
    b.x += b.vx*dt; b.y += b.vy*dt;
  }
  // 충돌 — 위치 보정 반복
  // 순서가 중요하다. 원끼리 밀어낸 다음 벽으로 가둔다.
  // 반대로 하면 마지막에 밀어낸 결과가 벽 밖으로 삐져나온 채 프레임이 끝나고,
  // 그걸 나중에 한 번에 밀어 넣으면 이번엔 그 자리가 겹친 채로 남는다.
  const iters = bodies.length > 60 ? 8 : ITER;
  for(let it=0; it<iters; it++){
    // 원끼리
    for(let i=0;i<bodies.length;i++){
      const a = bodies[i];
      for(let j=i+1;j<bodies.length;j++){
        const c = bodies[j];
        let dx = c.x-a.x, dy = c.y-a.y;
        let d2 = dx*dx+dy*dy;
        const rr = a.r + c.r;
        if(d2 >= rr*rr || d2 === 0) continue;
        let d = Math.sqrt(d2);
        if(d < 0.0001){ dx = 0.01; dy = -1; d = 1; }
        const nx = dx/d, ny = dy/d;
        const pen = rr - d;
        // 질량은 면적에 비례
        const ma = a.r*a.r, mc = c.r*c.r, tot = ma+mc;
        const sa = (mc/tot), sc2 = (ma/tot);
        a.x -= nx*pen*sa; a.y -= ny*pen*sa;
        c.x += nx*pen*sc2; c.y += ny*pen*sc2;
        if(it===0){
          // 상대속도의 법선 성분만 감쇠
          const rvx = c.vx-a.vx, rvy = c.vy-a.vy;
          const vn = rvx*nx + rvy*ny;
          if(vn < 0){
            const imp = -(1+REST)*vn;
            a.vx -= nx*imp*sa; a.vy -= ny*imp*sa;
            c.vx += nx*imp*sc2; c.vy += ny*imp*sc2;
            if(vn < -260){                       // 세게 맞으면 아래쪽이 눌린 얼굴
              const low = (c.y > a.y) ? c : a;
              if(low.born > 0.3 && low.face !== 'win'){ low.face = 'hit'; low.faceT = 0.5; }
            }
          }
        }
      }
    }
    // 벽·바닥 — 반복의 마지막이라, 프레임은 항상 통 안에서 끝난다.
    // 위치는 매번 잡되 속도는 첫 번째에만 건드린다. 매번 감쇠하면 바닥 마찰이
    // 열네 번 곱해져(0.86^14 ≈ 0.12) 굴러가지 못하고 그 자리에 박힌다.
    for(const b of bodies){
      const L = BOX.x + b.r, R = BOX.x + BOX.w - b.r, B = BOX.y + BOX.h - b.r;
      if(b.x < L){ b.x = L; if(it===0 && b.vx<0) b.vx = -b.vx*WALL_R; else if(b.vx<0) b.vx = 0; }
      if(b.x > R){ b.x = R; if(it===0 && b.vx>0) b.vx = -b.vx*WALL_R; else if(b.vx>0) b.vx = 0; }
      if(b.y > B){ b.y = B;
        if(it===0){ if(b.vy>420 && b.face!=='win'){ b.face='hit'; b.faceT=0.45; }
                    if(b.vy>0) b.vy = -b.vy*REST; b.vx *= FRIC; }
        else if(b.vy>0) b.vy = 0; }
    }
  }
}

// 이 합체가 앞의 합체에서 "이어진" 것인가.
// 합체로 태어난 조각이 끼어 있어야 진짜 연쇄다. 통 여기저기서 따로 터진
// 합체가 시간만 겹쳐 연쇄로 세어지면, 아무 데나 던져도 11연쇄가 나온다
// (자동 플레이 실측: 무작위 봇 maxChain 11, 40159점). 연쇄가 배수를 만드는
// 이상 연쇄의 정의가 곧 실력의 정의다.
function isCascade(a, c){
  return !!((a.rT && a.born < CHAIN_WINDOW) || (c.rT && c.born < CHAIN_WINDOW));
}
// 연쇄를 한 칸 올리고, 4연쇄에 닿으면 과열에 들어간다
function bumpChain(){
  chain++; chainT = CHAIN_WINDOW;
  if(chain > maxChain) maxChain = chain;
  if(chain > 1){ comboN = chain; comboT = 0.9; }
  if(chain >= FEVER_AT && fever <= 0){
    fever = FEVER_TIME; feverCount++;
    sfx('fever'); buzz(50); shake = 0.4;
    toast('과열! ' + FEVER_TIME + '초 동안 점수 ' + FEVER_MUL + '배');
  } else if(chain >= FEVER_AT){
    fever = FEVER_TIME;                       // 과열 중에 또 내면 다시 채운다
    toast('과열 연장');
  }
}
// 통을 깨끗이 비웠다 — 보늘 소멸로만 일어난다. 드물고, 순전히 실력이다
function perfectClear(){
  clears++;
  const gain = CLEAR_SCORE * (fever>0 ? FEVER_MUL : 1);
  score += gain; left += CLEAR_DROPS; doneT = 0; endT = 0;
  if(!cur && left > 0){ cur = { t: pickTier(), x: W/2 }; nextT = pickTier(); nextT2 = pickTier(); }
  floats.push({ x:BOX.x+BOX.w/2, y:BOX.y+BOX.h*0.45, txt:'완벽 정리 +'+gain, t:0, big:true });
  sfx('fever'); buzz(80); shake = 0.5;
  toast('통을 깨끗이 비웠다!  조각 ' + CLEAR_DROPS + '개 더');
}

// ── 합체 ────────────────────────────────────────────────────
function resolveMerges(){
  const gone = new Set();
  let did = false;
  // 최종 단계끼리 만나면 둘 다 사라진다. 안 그러면 통이 보늘로 막혀 판이 죽는다.
  for(let i=0;i<bodies.length;i++){
    const a = bodies[i];
    if(gone.has(a.id) || a.t !== TOP_TIER) continue;
    for(let j=i+1;j<bodies.length;j++){
      const c = bodies[j];
      if(gone.has(c.id) || c.t !== TOP_TIER) continue;
      const dx=c.x-a.x, dy=c.y-a.y, rr=a.r+c.r;
      if(dx*dx+dy*dy > rr*rr*1.02) continue;
      gone.add(a.id); gone.add(c.id);
      // 연쇄 배수를 안 붙인다. 보늘 둘을 붙이는 건 작정하고 만드는 일이지
      // 굴러가다 우연히 터지는 게 아니고, 배수까지 붙이면 운으로 한 판이 갈린다.
      if(!isCascade(a, c)) chain = 0;
      const popGain = Math.round(POP_SCORE * (fever>0 ? FEVER_MUL : 1) * popMul());
      score += popGain;
      ghosts.push({ x:a.x, y:a.y, r:a.r, t:0 }, { x:c.x, y:c.y, r:c.r, t:0 });
      if(popMul() > 1) moons.push({ x:(a.x+c.x)/2, y:Math.min(a.y,c.y), r:a.r*0.9, t:0 });   // 보름달 소원
      floats.push({ x:(a.x+c.x)/2, y:Math.min(a.y,c.y) - a.r,
                    txt:'+'+popGain + (popMul()>1 ? ' 보름달' : ''), t:0, big:true });
      merges++; bumpChain();
      pops.push({ x:(a.x+c.x)/2, y:(a.y+c.y)/2, r:a.r*1.4, t:0 });
      pops.push({ x:(a.x+c.x)/2, y:(a.y+c.y)/2, r:a.r*0.7, t:-0.08 });
      sfx('top'); buzz(60); shake = 0.34;
      // 조각을 더 두고 간다. 마지막 조각을 이미 놓은 뒤라면 손을 다시 채운다.
      const bonus = RULE.popBonus || POP_BONUS_DROPS;
      left += bonus; doneT = 0; endT = 0;
      if(!cur){ cur = { t: pickTier(), x: W/2 }; nextT = pickTier(); nextT2 = pickTier(); }
      toast('보늘 둘이 돌아가며 조각 ' + bonus + '개를 두고 갔다  +' + POP_SCORE);
      stat.pops++;
      did = true;
      break;
    }
  }
  for(let i=0;i<bodies.length;i++){
    const a = bodies[i];
    if(gone.has(a.id) || a.t >= TOP_TIER) continue;
    for(let j=i+1;j<bodies.length;j++){
      const c = bodies[j];
      if(gone.has(c.id) || c.t !== a.t) continue;
      const dx=c.x-a.x, dy=c.y-a.y;
      const rr = a.r + c.r;
      if(dx*dx+dy*dy > rr*rr*1.02) continue;
      // 합친다
      gone.add(a.id); gone.add(c.id);
      const nt = a.t + 1, T = TIERS[nt];
      // 합쳐진 것은 부모보다 크므로, 중간 지점 그대로 두면 통 밖으로 삐져나온다.
      // 만들 때 바로 가둔다 (물리 스텝을 기다리면 한 프레임 동안 벽을 뚫고 보인다).
      const mx = Math.max(BOX.x + T.r, Math.min(BOX.x + BOX.w - T.r, (a.x+c.x)/2));
      const my = Math.min(BOX.y + BOX.h - T.r, (a.y+c.y)/2);
      bodies.push({ x:mx, y:my, r:a.r, r0:a.r, rT:T.r, gt:0, t:nt, id:nextId++, born:0,
                    vx:(a.vx+c.vx)/2, vy:(a.vy+c.vy)/2 - 60,
                    face:'win', faceT: nt===TOP_TIER ? 1.6 : 0.9 });   // 태어난 김에 기뻐한다
      maybeSay(bodies[bodies.length-1], SAY[T.k], nt === TOP_TIER);
      made[nt] = (made[nt]||0) + 1;                  // 오늘의 숙제 집계
      if(!isCascade(a, c)) chain = 0;
      const gain = Math.round(MERGE_SCORE[nt] * chainMul(chain) * (fever>0 ? FEVER_MUL : 1));
      score += gain;
      floats.push({ x:mx, y:my - T.r*0.6, txt:'+'+gain + (chain>0 ? ' ×'+(chain+1) : ''), t:0, big: nt>=4 });
      merges++;
      if(nt > maxTier){
        maxTier = nt;
        if(nt === TOP_TIER){ sfx('top'); buzz(60); toast('보늘이 나왔다!'); }
        else toast(T.n + ' 등장');
      }
      if(!seen[nt]){ seen[nt] = 1; saveAll(); }   // 처음 본 단계는 도감에
      pops.push({ x:mx, y:my, r:T.r, t:0 });
      if(plays<2 && !tutMerged){ tutMerged=1; tut=3.2; }
      bumpChain();
      if(chain>1) sfx('chain'); else sfx('merge', nt);
      buzz(10); shake = Math.min(0.3, 0.08 + nt*0.03);
      did = true;
      break;
    }
  }
  if(gone.size) bodies = bodies.filter(b=>!gone.has(b.id));
  if(did && !bodies.length && mode === 'PLAY' && merges > 0) perfectClear();
  return did;
}

// ── 넘침 판정 ───────────────────────────────────────────────
function checkOver(dt){
  if(overGrace > 0){ overGrace -= dt; overT = 0; return; }
  let out = false;
  for(const b of bodies){
    if(b.born < 1.0) continue;                 // 막 떨어뜨린 건 봐준다
    if(Math.abs(b.vy) > 42) continue;          // 아직 움직이는 중이면 봐준다
    if(b.y - b.r < LINE){ out = true; break; }
  }
  overT = out ? overT + dt : 0;
  if(overT > 1.15){ overReason = 'over'; gameOver(); return; }
  // 조각을 다 쓰고 판이 잠잠해지면 끝난다.
  // 통이 꽉 차면 조각들이 서로 밀며 미세하게 계속 떨리므로 "완전히 멈춤"만
  // 기다리면 판이 영영 안 끝난다(조각 17개에서 확인). 그래서 마지막 조각을
  // 놓은 뒤 3.5초가 지나면 잠잠해지지 않아도 끝냅니다.
  if(left <= 0 && !cur){
    endT += dt;
    const moving = bodies.some(b => Math.abs(b.vy)>24 || Math.abs(b.vx)>24 || (b.rT && b.r<b.rT));
    doneT = moving ? 0 : doneT + dt;
    if(doneT > 0.7 || endT > 3.5){ overReason = 'done'; gameOver(); }
  }
}
function puzzleOver(){
  const stars = puzzleStars(), p = puzzleLoad();
  const isBest = !p.best || score > p.best;
  if(isBest){ p.best = score; }
  p.stars = Math.max(p.stars||0, stars); p.tries = (p.tries||0) + 1;
  try{ localStorage.setItem(PKEY, JSON.stringify(p)); }catch(e){}
  hubReport(); lifeAdd();
  pushPuzzle(stars);
  $('resTitle').textContent = '오늘의 퍼즐 · ' + dayLabel();
  $('resBig').innerHTML = score + '점<div class="stars">' + starText(stars) + '</div>';
  $('resNote').innerHTML = [
    overReason === 'over' ? '통이 넘쳤습니다' : '조각 ' + PUZZLE_N + '개를 다 놓았습니다',
    '★ 끼토 · ★★ 보늘 · ★★★ 보늘 소멸이나 완벽 정리',
    '합체 ' + merges + '번' + (maxChain>1 ? ' · 최고 ' + maxChain + '연쇄' : ''),
    isBest ? '<b>오늘 최고 기록</b>' : '오늘 최고 ' + p.best + '점 · ' + starText(p.stars),
  ].join('<br>');
  $('resCut').classList.add('hidden');
  $('btnRetry').textContent = '다시 풀기';
  show('sResult');
}
function gameOver(){
  mode = 'OVER';
  sfx('over');
  score = Math.round(score);
  if(GMODE === 'puzzle'){ puzzleOver(); return; }
  $('btnRetry').textContent = '한 판 더';
  const isBest = score > best;
  if(isBest) best = score;
  if(maxTier > bestTier) bestTier = maxTier;
  plays++;
  saveAll();
  hubReport();
  pushRanking();

  $('resTitle').textContent = overReason === 'over' ? '통이 넘쳤다' : '조각을 다 놓았다';
  $('resBig').innerHTML = score + '점';
  const parts = [];
  parts.push(overReason === 'over'
    ? '통이 넘쳤습니다 · 조각 ' + (DROPS_MAX - left) + '개'
    : '조각 ' + DROPS_MAX + '개를 다 놓았습니다');
  parts.push('합체 ' + merges + '번' + (maxChain>1 ? ' · 최고 ' + maxChain + '연쇄' : ''));
  parts.push('제일 큰 친구 · <b>' + TIERS[maxTier].n + '</b>');
  if(stat.pops) parts.push('보늘 ' + stat.pops + '번 돌려보냄');
  if(feverCount)parts.push('<b>과열 ' + feverCount + '번</b>');
  if(clears)    parts.push('<b>완벽 정리 ' + clears + '번</b>');
  parts.push(questDone ? '<b>오늘의 숙제 완료 · ' + QUEST.n + '</b>'
                       : '<span style="color:#8A8271;">오늘의 숙제 · ' + QUEST.n + '</span>');
  parts.push(isBest ? '<b>최고 기록을 세웠습니다</b>' : '최고 ' + best + '점');
  $('resNote').innerHTML = parts.join('<br>');
  lifeAdd();
  const ecut = unlockEventCut(), cut = unlockCut();

  }catch(e){}
  // 마을 공통 업적 — 합체로도 채워질 수 있어야 한다
  const pl = st.played || {};
  if(pl.leaf && pl.run && pl.match)             achUnlock('all_three');
  if(pl.leaf && pl.run && pl.match && pl.defense) achUnlock('all_four');
  if(Object.keys(st.chars||{}).length >= 6)     achUnlock('all_chars');
  if((st.coins||0) >= 500)                      achUnlock('coins_500');
  // 합체 업적
  if(merges > 0)          achUnlock('merge_first');
  if(maxTier >= 4)        achUnlock('merge_kkito');
  if(maxTier >= TOP_TIER) achUnlock('merge_boneul');
  if(maxChain >= 6)       achUnlock('merge_chain6');
  if(maxChain >= 9)       achUnlock('merge_chain9');
  if(feverCount >= 3)     achUnlock('merge_fever3');
  if(clears > 0)          achUnlock('merge_clear');
  if(score >= 4000)       achUnlock('merge_4000');
  if(score >= 15000)      achUnlock('merge_15000');
  { const L = lifeLoad(); if(SKINS.every(x => skinOpen(x, L))) achUnlock('merge_skins'); }
  // 오늘의 미션
  try{
    const mk = String(new Date().getFullYear()*10000 + (new Date().getMonth()+1)*100 + new Date().getDate());
    const ms = JSON.parse(localStorage.getItem('somsom_missions')||'{}');
    if(maxTier >= 3){ ms[mk] = ms[mk]||{}; ms[mk].merge = 1;
      localStorage.setItem('somsom_missions', JSON.stringify(ms)); }
  }catch(e){}
}

function buildShareCard(){
  const cw = 1080, chh = 1350;
  const c = document.createElement('canvas'); c.width = cw; c.height = chh;
  const g = c.getContext('2d');
  g.fillStyle = '#FDFBF5'; g.fillRect(0, 0, cw, chh);
  drawWall(g, 0, 0, cw, chh);
  g.fillStyle = 'rgba(253,251,245,.35)'; g.fillRect(0, 0, cw, chh);
  // 통 스냅샷 — 카드 가운데에 맞춰 축소
  // 통은 위 글자(~200)와 아래 점수(~1080) 사이에만 들어간다
  const areaW = cw - 180, areaH = chh - 700, k = Math.min(areaW/(BOX.w+30), areaH/(BOX.h+30));
  const ox = (cw - BOX.w*k)/2, oy = 230 + (areaH - BOX.h*k)/2;
  const saved = ctx; ctx = g;
  g.save(); g.translate(ox, oy); g.scale(k, k); g.translate(-BOX.x, -BOX.y);
  PLANK_PAT = null;                              // 패턴은 컨텍스트마다 새로
  drawCrate();
  for(const b of bodies) drawChar(b.t, b.x, b.y, b.r, null, b.face);
  g.restore();
  ctx = saved; PLANK_PAT = null;
  // 글자
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#221E18';
  g.font = '800 34px sans-serif'; g.fillStyle = '#8A8271';
  g.fillText('솜솜시티 · 솜솜 합체', cw/2, 90);
  g.font = '900 52px sans-serif'; g.fillStyle = '#221E18';
  g.fillText('오늘의 통 · ' + dayLabel() + (RULE.k!=='plain' ? ' · ' + RULE.n : ''), cw/2, 160);
  const nm = localStorage.getItem('somsom_name') || '';
  g.font = '900 150px sans-serif'; g.fillStyle = '#E0A12B';
  g.lineWidth = 10; g.strokeStyle = '#221E18'; g.strokeText(Math.round(score) + '점', cw/2, chh - 200);
  g.fillText(Math.round(score) + '점', cw/2, chh - 200);
  g.font = '800 44px sans-serif'; g.fillStyle = '#221E18';
  g.fillText((nm ? nm + ' · ' : '') + '합체 ' + merges + '번 · 제일 큰 친구 ' + TIERS[maxTier].n, cw/2, chh - 105);
  g.font = '700 28px sans-serif'; g.fillStyle = '#8A8271';
  g.fillText('pang861209-rgb.github.io/somsom-city', cw/2, chh - 56);
  return c;
}

// ── 오늘의 순위판 ────────────────────────────────────────────
// d == 오늘 조건 하나로만 읽고 정렬은 여기서 한다. 정렬을 서버에 시키면
// 복합 인덱스를 콘솔에서 따로 만들어야 한다.
// 범위: today = d 가 오늘 · week = 최근 7일(t 기준) · all = 전부
// 어느 쪽도 정렬은 서버에 안 시킨다 (복합 인덱스 없이 단일 필드 조건만).
let boardRange = 'today';
function weekStart(){ return Date.now() - 7*24*3600*1000; }
async function fetchScores(range, col){
  const q = { from:[{collectionId: col || 'merge_scores'}], limit: range==='all' ? 1000 : 500 };
  if(range==='today') q.where = {fieldFilter:{field:{fieldPath:'d'},op:'EQUAL',value:{integerValue:String(dayKey())}}};
  else if(range==='week') q.where = {fieldFilter:{field:{fieldPath:'t'},op:'GREATER_THAN_OR_EQUAL',value:{integerValue:String(weekStart())}}};
  const r = await fetch(FB_DOCS+':runQuery?key='+FB_KEY,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:q})});
  const j = await r.json();
  if(!Array.isArray(j)) throw new Error('bad');
  const best = {};
  for(const e of j){
    if(!e.document) continue;
    const f = e.document.fields||{};
    const n = String((f.n&&f.n.stringValue)||'?').slice(0,12), sc = +((f.s&&f.s.integerValue)||0);
    if(!(n in best) || sc > best[n]) best[n] = sc;
  }
  return best;
}

// ── 루프 ────────────────────────────────────────────────────
let last = 0, acc = 0;
const FIXED = 1/120;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(!(dt>0)) dt = 0;
  dt = Math.min(0.05, dt);

  if(mode==='PAUSE'){ draw(); return; }
  if(mode==='PLAY'){
    if(dropLock>0) dropLock -= dt;
    if(tut>0) tut -= dt;
    if(chainT>0){ chainT -= dt; if(chainT<=0) chain = 0; }
    if(fever>0){ fever -= dt; if(fever<0) fever = 0; }
    if(comboT>0) comboT -= dt;
    if(shake>0) shake -= dt;
    for(const b of bodies){
      if(b.faceT>0){ b.faceT -= dt; if(b.faceT<=0){ b.face=null; b.faceT=0; } }
      if(b.sayT>0){ b.sayT -= dt; if(b.sayT<=0) b.say = null; }
    }
    checkQuest();
    warnT -= dt;
    if(warnT <= 0 && bodies.length){                 // 넘침이 가까우면 위쪽 조각이 알려 준다
      warnT = 2.6;
      let top = null;
      for(const b of bodies) if(b.born > 1 && (!top || b.y-b.r < top.y-top.r)) top = b;
      if(top && top.y - top.r < LINE + top.r*0.9) maybeSay(top, SAY_WARN, true);
    }
    acc += dt;
    let guard = 0;
    while(acc >= FIXED && guard++ < 8){
      stepPhysics(FIXED);
      let n = 0;
      while(resolveMerges() && n++ < 6){}
      acc -= FIXED;
    }
    checkOver(dt);
  }
  for(let i=pops.length-1;i>=0;i--){ pops[i].t += dt; if(pops[i].t>0.35) pops.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t += dt; f.y -= 46*dt; if(f.t>0.95) floats.splice(i,1); }
  for(let i=ghosts.length-1;i>=0;i--){ const g=ghosts[i]; g.t += dt; g.y -= 95*dt; if(g.t>1.05) ghosts.splice(i,1); }
  for(let i=moons.length-1;i>=0;i--){ const m=moons[i]; m.t += dt; m.y -= 70*dt; if(m.t>1.8) moons.splice(i,1); }
  draw();
}

// ── 그리기 ──────────────────────────────────────────────────
function drawChar(t, x, y, r, alpha, face){
  const T = TIERS[t];
  const im = (face==='hit' && IMG_HIT[T.k]) || (face==='win' && IMG_WIN[T.k]) || IMG[T.k];
  ctx.save();
  if(alpha!=null) ctx.globalAlpha = alpha;
  // 바탕 원 — 실루엣이 또렷해야 단계가 구분된다
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.fillStyle = T.c; ctx.globalAlpha = (alpha==null?1:alpha) * 0.28; ctx.fill();
  ctx.globalAlpha = (alpha==null?1:alpha);
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#221E18'; ctx.stroke();
  if(im){
    const h = r*2*T.sc*0.72, w = h*(im.width/im.height);
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r-1.5, 0, 7); ctx.clip();
    ctx.drawImage(im, x-w/2, y-h/2 + r*0.10, w, h);
    ctx.restore();
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#FDFBF5'; ctx.fillRect(0,0,W,H);
  // 흔들림 세기를 shake 값에 비례시킨다. 합체(0.1~0.3)는 살짝, 통 흔들기(0.85)는 크게.
  const amp = shake>0 ? Math.min(15, shake*17) : 0;
  const sx = amp ? (Math.random()-0.5)*amp : 0;
  const sy = amp ? (Math.random()-0.5)*amp*0.6 : 0;
  ctx.save(); ctx.translate(sx,sy);

  // 벽 — HUD 아래를 상점 벽으로 덮는다 (cover 맞춤, 위쪽 정렬)
  drawWall(ctx, 0, HUD, W, H-HUD);
  drawCrate();
  // 몸통
  for(const b of bodies) drawChar(b.t, b.x, b.y, b.r, null, b.face);
  for(const b of bodies) if(b.say) drawSay(b);
  // 보늘 소멸 — 떠올라 사라지는 둘
  for(const g of ghosts){
    const k = g.t/1.05;
    drawChar(TOP_TIER, g.x, g.y, g.r*(1+k*0.25), 1-k, 'win');
  }
  // 보름달 — 은은하게 떠올라 사라진다
  for(const m of moons){
    const k = m.t/1.8, a = k<0.25 ? k/0.25 : (1-k)/0.75;
    ctx.save(); ctx.globalAlpha = Math.max(0, a)*0.9;
    const g = ctx.createRadialGradient(m.x, m.y, m.r*0.2, m.x, m.y, m.r*1.6);
    g.addColorStop(0, 'rgba(255,240,190,1)'); g.addColorStop(0.55, 'rgba(255,226,150,.55)'); g.addColorStop(1, 'rgba(255,226,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, m.r*1.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFF1C4'; ctx.strokeStyle = 'rgba(200,160,80,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r*0.75, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // 합체 이펙트
  for(const p of pops){
    const k = p.t/0.35;
    ctx.strokeStyle = 'rgba(224,161,43,'+(1-k)+')';
    ctx.lineWidth = 3*(1-k)+1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(1+k*0.8), 0, 7); ctx.stroke();
  }
  // 점수 글자
  for(const f of floats){
    const k = f.t/0.95, a = k<0.7 ? 1 : (1-k)/0.3;
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = (f.big ? '900 22px' : '900 15px') + ' sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = '#FDFBF5'; ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = f.big ? '#D8542F' : '#8A5A12'; ctx.fillText(f.txt, f.x, f.y);
    ctx.restore();
  }
  ctx.restore();

  // 손에 든 것 + 낙하 가이드
  if(mode==='PLAY' && cur){
    const r = TIERS[cur.t].r;
    ctx.strokeStyle = 'rgba(34,30,24,.18)'; ctx.lineWidth = 2; ctx.setLineDash([4,7]);
    ctx.beginPath(); ctx.moveTo(cur.x, BOX.y-4); ctx.lineTo(cur.x, BOX.y+BOX.h); ctx.stroke();
    ctx.setLineDash([]);
    drawChar(cur.t, cur.x, BOX.y - r - 8, r, dropLock>0 ? 0.35 : 1);
  }
  // 과열 — 남은 시간 띠를 통 위에 붙인다
  if(fever > 0 && (mode==='PLAY' || mode==='PAUSE')){
    const k = fever/FEVER_TIME, bw = BOX.w*0.66, bx = BOX.x + (BOX.w-bw)/2, by = HUD + 8;
    ctx.save();
    ctx.fillStyle = 'rgba(196,82,28,.92)';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, 20, 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,214,140,.95)';
    ctx.beginPath(); ctx.roundRect(bx+3, by+3, (bw-6)*k, 14, 7); ctx.fill();
    ctx.fillStyle = '#4A1B06'; ctx.font = '900 11.5px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('과열 · 점수 ' + FEVER_MUL + '배  ' + fever.toFixed(1) + '초', bx+bw/2, by+10);
    ctx.restore();
  }
  // 연쇄 — 통 가운데에 크게. 배수가 곧 점수라 눈에 보여야 한다
  if(comboT > 0 && comboN > 1){
    const k = 1 - comboT/0.9, sc = 1 + Math.max(0, 0.5 - k*2.2);
    ctx.save();
    ctx.globalAlpha = k > 0.72 ? (1-k)/0.28 : 1;
    ctx.translate(BOX.x + BOX.w/2, BOX.y + BOX.h*0.34); ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 46px sans-serif';
    ctx.lineWidth = 9; ctx.strokeStyle = '#FDFBF5'; ctx.strokeText(comboN + '연쇄', 0, 0);
    ctx.fillStyle = comboN >= FEVER_AT ? '#C4521C' : '#E0A12B'; ctx.fillText(comboN + '연쇄', 0, 0);
    ctx.font = '900 15px sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = '#FDFBF5';
    ctx.strokeText('점수 ×' + chainMul(comboN-1).toFixed(1), 0, 33);
    ctx.fillStyle = '#6B4A1A'; ctx.fillText('점수 ×' + chainMul(comboN-1).toFixed(1), 0, 33);
    ctx.restore();
  }
  // 오늘의 규칙 — 보통 날이면 안 그린다
  if((mode==='PLAY' || mode==='PAUSE') && RULE.k !== 'plain' && fever <= 0){
    ctx.save(); ctx.font = '800 10.5px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const msg = '오늘의 규칙 · ' + RULE.n, tw = ctx.measureText(msg).width;
    ctx.fillStyle = 'rgba(34,30,24,.78)';
    ctx.beginPath(); ctx.roundRect(W-14-tw-16, HUD+8, tw+16, 22, 11); ctx.fill();
    ctx.fillStyle = '#FDFBF5'; ctx.fillText(msg, W-22, HUD+19);
    ctx.restore();
  }
  // 바꾸기 칸
  if(mode==='PLAY' || mode==='PAUSE'){
    const h = holdPos(), on = holdLeft > 0;
    ctx.save(); ctx.globalAlpha = on ? 1 : 0.4;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7);
    ctx.fillStyle = '#F4EFE1'; ctx.fill();
    ctx.setLineDash(hold==null ? [4,4] : []); ctx.lineWidth = 2; ctx.strokeStyle = '#221E18'; ctx.stroke();
    ctx.setLineDash([]);
    if(hold != null) drawChar(hold, h.x, h.y, h.r-5);
    ctx.fillStyle = '#8A8271'; ctx.font = '800 10px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('바꾸기 ' + holdLeft, h.x, h.y + h.r + 10);
    ctx.restore();
    // 흔들기 (퍼즐에는 없다)
    if(GMODE === 'puzzle'){ drawHud(); return; }
    const k = shakePos(), able = shakeLeft > 0;
    ctx.save(); ctx.globalAlpha = able ? 1 : 0.35;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 7);
    ctx.fillStyle = able ? '#F3E3C4' : '#F4EFE1'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#221E18'; ctx.stroke();
    ctx.fillStyle = '#221E18'; ctx.font = '900 17px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('↯', k.x, k.y);
    ctx.fillStyle = '#8A8271'; ctx.font = '800 10px sans-serif';
    ctx.fillText('흔들기 ' + shakeLeft, k.x, k.y + k.r + 10);
    ctx.restore();
  }
  drawHud();
}
// 말풍선 — 조각 바로 위에
function drawSay(b){
  const a = b.sayT > 1.35 ? (1.6-b.sayT)/0.25 : Math.min(1, b.sayT/0.35);
  ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.font = '800 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(b.say).width, w = tw+16, h = 20;
  let x = Math.max(BOX.x+w/2+2, Math.min(BOX.x+BOX.w-w/2-2, b.x));
  const y = Math.max(BOX.y+h/2+2, b.y - b.r - 13);
  ctx.fillStyle = '#FDFBF5'; ctx.strokeStyle = '#221E18'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.roundRect(x-w/2, y-h/2, w, h, 9); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-4, y+h/2-1); ctx.lineTo(x, y+h/2+5); ctx.lineTo(x+4, y+h/2-1);
  ctx.fillStyle = '#FDFBF5'; ctx.fill();
  ctx.strokeStyle = '#221E18'; ctx.beginPath();
  ctx.moveTo(x-4, y+h/2-1); ctx.lineTo(x, y+h/2+5); ctx.lineTo(x+4, y+h/2-1); ctx.stroke();
  ctx.fillStyle = '#221E18'; ctx.fillText(b.say, x, y);
  ctx.restore();
}
function drawCrate(){
  // 통 — 나무 상자. 안쪽은 크림에 널빤지를 옅게 깔아 조각이 잘 읽히게 한다
  if(PLANK && !PLANK_PAT){ try{ PLANK_PAT = ctx.createPattern(PLANK, 'repeat'); }catch(e){} }
  ctx.fillStyle = '#F4EFE1';
  ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
  if(PLANK_PAT){
    ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = PLANK_PAT;
    ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h); ctx.restore();
  }
  // 넘침선
  ctx.strokeStyle = overT>0 ? '#E0605F' : '#C9BFA8';
  ctx.lineWidth = 2; ctx.setLineDash([7,6]);
  ctx.beginPath(); ctx.moveTo(BOX.x, LINE); ctx.lineTo(BOX.x+BOX.w, LINE); ctx.stroke();
  ctx.setLineDash([]);
  // 상자 널빤지 테두리 (좌·우·아래) — 통의 바깥쪽 여백에 그린다
  const RW = Math.max(9, Math.min(13, Math.round(BOX.x*0.6)));
  const rails = [[BOX.x-RW, BOX.y-6, RW, BOX.h+6+RW], [BOX.x+BOX.w, BOX.y-6, RW, BOX.h+6+RW],
                 [BOX.x-RW, BOX.y+BOX.h, BOX.w+RW*2, RW]];
  for(const [rx,ry,rw,rh] of rails){
    ctx.fillStyle = PLANK_PAT || '#D8BC93'; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = 'rgba(120,80,40,.18)'; ctx.fillRect(rx, ry, rw, rh);   // 안쪽보다 조금 진하게
    if(fever > 0){                               // 과열 — 상자가 달아오른다
      const p = 0.35 + 0.25*Math.sin(performance.now()/90);
      ctx.fillStyle = 'rgba(224,110,43,'+p.toFixed(2)+')'; ctx.fillRect(rx, ry, rw, rh);
    }
    ctx.strokeStyle = fever>0 ? '#C4521C' : '#221E18';
    ctx.lineWidth = fever>0 ? 3.5 : 2.5; ctx.strokeRect(rx+1, ry+1, rw-2, rh-2);
  }
}
function drawWall(g, x, y, w, h){
  if(!BG_WALL) return;
  const iw = BG_WALL.width, ih = BG_WALL.height;
  const k = Math.max(w/iw, h/ih), dw = iw*k, dh = ih*k;
  g.drawImage(BG_WALL, x+(w-dw)/2, y, dw, dh);
}

function drawHud(){
  ctx.fillStyle = '#FDFBF5'; ctx.fillRect(0,0,W,HUD);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#221E18'; ctx.font = '900 24px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(Math.round(score), 14, HUD/2);
  ctx.fillStyle = '#8A8271'; ctx.font = '800 11.5px sans-serif';
  ctx.fillText('최고 ' + (GMODE==='puzzle' ? (puzzleLoad().best||0) : best), 14, HUD/2 + 18);
  // 남은 조각 — 이 게임의 한 판 길이
  if((mode==='PLAY' || mode==='PAUSE') && GMODE !== 'puzzle'){
    const warn = left <= 8;
    ctx.textAlign = 'center';
    ctx.fillStyle = warn ? '#D8542F' : '#8A8271';
    ctx.font = '800 10.5px sans-serif';
    ctx.fillText('남은 조각', W/2-16, HUD/2-9);
    ctx.font = '900 19px sans-serif';
    ctx.fillStyle = warn ? '#D8542F' : '#221E18';
    ctx.fillText(String(left), W/2-16, HUD/2+9);
  }
  // 다음
  if(mode==='PLAY' || mode==='PAUSE'){
    ctx.fillStyle = '#8A8271'; ctx.font = '800 11px sans-serif'; ctx.textAlign = 'right';
    if(GMODE === 'puzzle'){
      // 다음 줄 전부 — 이 모드의 핵심이다
      const up = cur ? [nextT, nextT2].concat(pq.slice(pqi)).slice(0, Math.max(0, left-1)) : [];
      const x0 = 122, x1 = W - 52, n = up.length;
      const sp = n ? Math.min(22, (x1-x0)/n) : 0, rr = Math.min(9, sp*0.44);
      ctx.textAlign = 'left'; ctx.fillStyle = '#8A8271'; ctx.font = '800 10px sans-serif';
      ctx.fillText(n ? '다음 줄 · ' + n + '개' : '마지막 조각', x0, 13);
      up.forEach((t,i)=> drawChar(t, x0 + rr + i*sp, 37, i===0 ? rr+2 : rr, i===0 ? 1 : Math.max(0.45, 1-i*0.05)));
    } else if(cur){
      ctx.fillText('다음', W-122, HUD/2);
      drawChar(nextT,  W-94, HUD/2, 15);
      drawChar(nextT2, W-64, HUD/2, 10, 0.55);   // 그다음 — 연쇄를 미리 설계하라고
    } else ctx.fillText('마지막', W-104, HUD/2);
    // 일시정지 버튼
    ctx.strokeStyle = '#221E18'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(W-40, HUD/2-14, 28, 28, 7); ctx.stroke();
    ctx.fillStyle = '#221E18';
    if(mode==='PLAY'){ ctx.fillRect(W-31,HUD/2-7,4,14); ctx.fillRect(W-24,HUD/2-7,4,14); }
    else { ctx.beginPath(); ctx.moveTo(W-30,HUD/2-8); ctx.lineTo(W-18,HUD/2); ctx.lineTo(W-30,HUD/2+8); ctx.fill(); }
  }
  // 튜토리얼 한 줄
  if(mode==='PLAY' && tut>0){
    const msg = tutMerged ? '둘이 만나 한 뼘 커졌습니다 · 왼쪽 칸을 누르면 조각을 바꿔 둘 수 있습니다'
                          : '조각 ' + DROPS_MAX + '개로 몇 점까지 · 문질러 자리를 고르고 손을 떼면 떨어집니다';
    ctx.globalAlpha = Math.min(1, tut);
    ctx.fillStyle = 'rgba(34,30,24,.88)';
    ctx.textAlign = 'center';
    let fs = 13, tw;                       // 긴 안내가 화면 밖으로 나가지 않게 줄인다
    do { ctx.font = '800 ' + fs + 'px sans-serif'; tw = ctx.measureText(msg).width; fs -= 0.5; }
    while(tw > W - 40 && fs > 8);
    ctx.beginPath(); ctx.roundRect(W/2-tw/2-13, BOX.y+BOX.h-56, tw+26, 32, 9); ctx.fill();
    ctx.fillStyle = '#FDFBF5'; ctx.textBaseline = 'middle';
    ctx.fillText(msg, W/2, BOX.y+BOX.h-40);
    ctx.globalAlpha = 1;
  }
  // 일시정지 덮개
  if(mode==='PAUSE'){
    ctx.fillStyle = 'rgba(253,251,245,.86)'; ctx.fillRect(0,HUD,W,H-HUD);
    ctx.fillStyle = '#221E18'; ctx.font = '900 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('잠깐 멈춤', W/2, H/2-10);
    ctx.font = '800 13px sans-serif'; ctx.fillStyle = '#6B6357';
    ctx.fillText('오른쪽 위 버튼을 다시 누르면 이어집니다', W/2, H/2+18);
  }
}

// ── 타이틀의 사다리 안내 ────────────────────────────────────
function buildLadder(){
  const el = $('ladder'); el.innerHTML = '';
  TIERS.forEach((t,i)=>{
    if(i){ const a=document.createElement('span'); a.className='ar'; a.textContent='›'; el.appendChild(a); }
    const d = document.createElement('div'); d.className='lb';
    const im = document.createElement('img');
    im.src = '../assets/sd_'+t.k+'_t.png';
    im.style.height = (13 + i*3.6) + 'px'; im.style.width = 'auto';
    im.alt = t.n;
    const n = document.createElement('span'); n.className='ln'; n.textContent = t.n;
    d.appendChild(im); d.appendChild(n); el.appendChild(d);
  });
}

// ── 버튼 ────────────────────────────────────────────────────
$('btnGo').onclick     = ()=> startGame('daily');
$('btnPuzzle').onclick = ()=> startGame('puzzle');
$('btnRetry').onclick  = ()=> startGame(GMODE);
$('btnHome').onclick  = ()=>{ mode='TITLE'; show('sTitle'); refreshTitle(); };
$('btnMute').onclick  = ()=>{
  muted = !muted;
  try{ localStorage.setItem('somsom_muted', muted?'1':'0'); }catch(e){}
  $('btnMute').textContent = muted?'🔇':'🔊';
  if(!muted) sfx('drop');
};
function refreshTitle(){
  $('btnMute').textContent = muted?'🔇':'🔊';
  RULE = window.FORCE_RULE || todayRule(); QUEST = todayQuest();
  const band = $('evBand');
  if(eventOn()){ band.textContent = '🌕 ' + EVENT.n + ' · ' + EVENT.until + '까지'; band.classList.remove('hidden'); }
  else band.classList.add('hidden');
  const pz = puzzleLoad();
  $('btnPuzzle').textContent = pz.best ? '퍼즐 ' + starText(pz.stars||0) : '오늘의 퍼즐';
  const qs = questLoad(), qDoneToday = qs.day === dayKey();
  // 두 줄로 묶는다. 세 줄이면 좁은 화면에서 하단 바를 넘친다.
  // 규칙 설명은 판이 시작되면 HUD에 다시 뜨므로 여기선 이름만 적는다.
  $('titleHint').innerHTML =
      '오늘의 통 · ' + dayLabel() + ' · <b>' + RULE.n + '</b>'
    + (best ? ' · 최고 ' + best + '점' : '')
    + '<br>숙제 · ' + QUEST.n + (qDoneToday ? ' <b>완료</b>' : '')
    + (qs.streak > 1 && qDoneToday ? ' · ' + qs.streak + '일 연속' : '');
}

buildLadder();
refreshTitle();
show('sTitle');
maybeWhatsNew();
requestAnimationFrame(t=>{ last = t; frame(t); });
</script>
