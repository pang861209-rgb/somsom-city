<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>솜솜시티: 솜솜 우체국</title>
<meta name="theme-color" content="#2F3A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<!-- M0 시제품: 그림 없이 색깔만으로 재미를 본다. 허브 연결·순위판·그림은 M1~M2에서 (docs/POST_기획서.md §8) -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#2F3A4A;touch-action:none;}
  body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#2B2118;word-break:keep-all;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;}
  #cv{position:fixed;inset:0;width:100vw;height:100dvh;display:block;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .homeBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:6;background:rgba(20,26,36,.8);border-radius:13px;padding:6px 13px;
    font:700 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#EFE7D6;text-decoration:none;}
  .wrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(20,26,36,.55);padding:18px;}
  .card{width:100%;max-width:380px;background:#FFF8EC;border:2px solid #2F3A4A;border-radius:20px;padding:20px 18px;
    display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 16px 40px -18px rgba(0,0,0,.6);animation:up .3s ease-out;}
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
  .t{font-family:'Black Han Sans',sans-serif;font-size:26px;color:#2F3A4A;}
  .big{background:#F2A13B;color:#2B1A08;font-weight:900;font-size:18px;border-radius:16px;padding:13px 0;width:100%;box-shadow:0 5px 0 #B06A1C;}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #B06A1C;}
  .how{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55;color:#3E4652;width:100%;}
  .how i{flex:none;width:22px;height:22px;border-radius:50%;background:#F2A13B;color:#2B1A08;font-style:normal;font-weight:900;font-size:12px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;}
  #resBig{font-family:'Black Han Sans',sans-serif;font-size:46px;color:#D9822B;line-height:1;}
  #resNote{font-size:13.5px;color:#5B6370;text-align:center;line-height:1.7;}
  #resNote b{color:#2F3A4A;}
  .tag{font-size:11px;color:#8A93A0;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="homeBtn" href="../">← 솜솜시티</a>

<div class="wrap" id="sTitle">
  <div class="card">
    <div class="t">솜솜 우체국</div>
    <div class="how"><i>1</i><span>아래 편지 더미를 끌어서 분류대 빈칸에 내려놓아요.</span></div>
    <div class="how"><i>2</i><span>옆칸 맨 위가 <b>같은 주민 편지</b>면 한 곳으로 모여요.</span></div>
    <div class="how"><i>3</i><span>같은 편지가 <b>10장</b> 모이면 배달 출발! 줄줄이 이어지면 점수가 몇 배로.</span></div>
    <div class="how"><i>4</i><span>빈칸이 없어서 더미를 못 놓으면 끝이에요.</span></div>
    <button class="big" id="btnStart">시작</button>
    <div class="tag">시험판 M0 · 그림 없이 색깔로만 만든 판이에요</div>
  </div>
</div>

<div class="wrap hidden" id="sResult">
  <div class="card">
    <div class="t" id="resTitle">우체국 문 닫을 시간</div>
    <div id="resBig">0</div>
    <div id="resNote"></div>
    <button class="big" id="btnAgain">한 판 더</button>
  </div>
</div>

<script src="core.js"></script>
<script>
const C = window.PostCore, OW = C.OWNERS;
const NAME = {kkito:'끼토', migae:'미개', lachilchin:'할머니', ramda:'람다', boneul:'보늘', bookgeo:'북거씨'};
const INI  = {kkito:'끼', migae:'미', lachilchin:'할', ramda:'람', boneul:'보', bookgeo:'북'};
// 색만으로 구분해야 하는 시험판이라 창고 정리 색보다 진하게 — 같은 계열 유지
const COL  = {kkito:'#EE8FAE', migae:'#7D8597', lachilchin:'#A98BD8', ramda:'#EF8F45', boneul:'#5FA88A', bookgeo:'#8CC65E'};
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, HEX = 30, BX = 0, BY = 0, TRAY_Y = 0;
let g = null, disp = null, anim = [], fx = [], busy = false, drag = null, sel = -1, t0 = performance.now(), notice = null;
let best = +(localStorage.getItem('somsom_post_best') || 0);

function shade(hex, f){ const n = parseInt(hex.slice(1), 16); const r=(n>>16)&255, gg=(n>>8)&255, b=n&255;
  return 'rgb('+Math.round(r*f)+','+Math.round(gg*f)+','+Math.round(b*f)+')'; }
function resize(){
  DPR = Math.min(3, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const R = C.DEFAULTS.R, cols = 2*R+1;
  HEX = Math.min((W - 24) / (cols * Math.sqrt(3)), (H * 0.56) / ((2*R)*1.5 + 2));
  // 분류대 + 받침대 묶음을 세로 가운데에 (점수판 아래 90px부터)
  const block = HEX*(R*3+2) + 70 + HEX*1.6, top0 = Math.max(90, 90 + (H - 90 - block) / 2 - 20);
  BX = W/2; BY = top0 + HEX*(R*1.5+1); TRAY_Y = BY + HEX*(R*1.5+1) + 70;
}
addEventListener('resize', resize);
const cellXY = i => { const [q,r] = g.cells[i]; return { x: BX + HEX*Math.sqrt(3)*(q + r/2), y: BY + HEX*1.5*r }; };
const trayXY = i => ({ x: W/2 + (i-1) * Math.min(W/3.2, 120), y: TRAY_Y });

function hexPath(x, y, s){ ctx.beginPath(); for(let k=0;k<6;k++){ const a = Math.PI/180*(60*k-30); ctx.lineTo(x + s*Math.cos(a), y + s*Math.sin(a)); } ctx.closePath(); }
// 편지 더미 — 아래부터 얇은 육각 판을 겹쳐 그리고, 맨 위에 그 주민 첫 글자와 맨 위 장수
function drawStack(st, x, y, s, alpha){
  if(!st.length) return;
  const step = Math.min(s*0.075, 3), shown = st.length > 12 ? st.slice(-12) : st;   // 높이는 12장까지만 그림 — 숫자로 정확히 보여 줌
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  shown.forEach((c, j) => { const yy = y - j*step; hexPath(x, yy + step*0.6, s*0.86); ctx.fillStyle = shade(COL[OW[c]], 0.62); ctx.fill();
    hexPath(x, yy, s*0.86); ctx.fillStyle = COL[OW[c]]; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = shade(COL[OW[c]], 0.5); ctx.stroke(); });
  const yt = y - (shown.length-1)*step, k = OW[st[st.length-1]], run = C.topRun(st);
  ctx.fillStyle = '#fff'; ctx.font = '900 '+Math.round(s*0.46)+'px "Apple SD Gothic Neo","Noto Sans KR",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(INI[k], x, yt - s*0.08);
  ctx.font = '800 '+Math.round(s*0.3)+'px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fillText(run + (st.length > run ? '/' + st.length : ''), x, yt + s*0.38);
  ctx.restore();
}

function draw(){
  const now = performance.now(), dt = Math.min(0.05, (now - t0)/1000); t0 = now;
  ctx.fillStyle = '#2F3A4A'; ctx.fillRect(0,0,W,H);
  if(!g){ requestAnimationFrame(draw); return; }
  // 점수판
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#F2C14B'; ctx.font = '400 34px "Black Han Sans",sans-serif'; ctx.fillText(g.score.toLocaleString(), W/2, 52);
  ctx.fillStyle = '#B9C2CE'; ctx.font = '700 12px sans-serif';
  ctx.fillText('최고 ' + Math.max(best, g.score).toLocaleString() + ' · 배달 ' + g.st.sent + ' · 주민 ' + g.nColors() + '명', W/2, 72);
  // 분류대
  for(let i=0;i<g.cells.length;i++){ const p = cellXY(i); hexPath(p.x, p.y, HEX*0.95);
    const hot = drag && drag.over === i;
    ctx.fillStyle = hot ? '#55657C' : '#3C485A'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = hot ? '#F2C14B' : '#4C5A6E'; ctx.stroke(); }
  // 들고 있는 더미가 닿을 칸 미리 보기: 맨 위가 같은 이웃을 표시
  if(drag && drag.over != null){ const c = C.top(g.tray[drag.i]);
    for(const y of g.nb[drag.over]) if(disp[y].length && C.top(disp[y]) === c){ const p = cellXY(y); hexPath(p.x, p.y, HEX*0.98); ctx.lineWidth = 3; ctx.strokeStyle = '#F2C14B'; ctx.stroke(); } }
  // 위쪽 줄부터 그려야 아래 줄 더미가 위 줄을 자연스럽게 덮는다
  const order = g.cells.map((_,i)=>i).sort((a,b) => cellXY(a).y - cellXY(b).y);
  for(const i of order){ const p = cellXY(i); drawStack(disp[i], p.x, p.y, HEX); }
  // 날아가는 편지
  for(let k=anim.length-1;k>=0;k--){ const a = anim[k]; a.t += dt; const u = Math.min(1, Math.max(0, a.t / a.d));
    if(a.t < 0) continue;
    const e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2, x = a.x0 + (a.x1-a.x0)*e, y = a.y0 + (a.y1-a.y0)*e - Math.sin(Math.PI*u)*HEX*0.9;
    hexPath(x, y, HEX*0.8); ctx.fillStyle = COL[OW[a.c]]; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = shade(COL[OW[a.c]], 0.5); ctx.stroke();
    if(u >= 1){ anim.splice(k,1); a.done && a.done(); } }
  // 받침대(아래 더미 세 개)
  for(let i=0;i<3;i++){ const st = g.tray[i]; if(!st) continue; if(drag && drag.i === i) continue;
    const p = trayXY(i); ctx.beginPath(); ctx.ellipse(p.x, p.y + HEX*0.6, HEX*0.95, HEX*0.3, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();
    drawStack(st, p.x, p.y, HEX*0.9, busy ? 0.55 : 1);
    if(sel === i){ hexPath(p.x, p.y - (Math.min(st.length,12)-1)*Math.min(HEX*0.9*0.075, 3), HEX*0.9); ctx.lineWidth = 3; ctx.strokeStyle = '#F2C14B'; ctx.stroke(); } }
  if(drag){ drawStack(g.tray[drag.i], drag.x, drag.y, HEX, 0.95); }
  // 효과: 터지는 조각·글자
  for(let k=fx.length-1;k>=0;k--){ const f = fx[k]; f.t += dt;
    if(f.kind === 'bit'){ f.vy += 600*dt; f.x += f.vx*dt; f.y += f.vy*dt; ctx.globalAlpha = Math.max(0, 1 - f.t/0.8);
      ctx.fillStyle = f.col; ctx.fillRect(f.x-3, f.y-3, 6, 6); ctx.globalAlpha = 1; if(f.t > 0.8) fx.splice(k,1); }
    else { const u = f.t/1.1; ctx.globalAlpha = Math.max(0, 1-u*u); ctx.textAlign = 'center';
      ctx.font = '400 '+f.sz+'px "Black Han Sans",sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,26,36,.85)';
      ctx.strokeText(f.txt, f.x, f.y - u*40); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y - u*40); ctx.globalAlpha = 1; if(u >= 1) fx.splice(k,1); } }
  if(notice){ notice.t += dt; const u = notice.t/2.2; ctx.globalAlpha = Math.max(0, Math.min(1, 3*(1-u)));
    ctx.fillStyle = 'rgba(20,26,36,.85)'; const w = Math.min(W-40, 280); ctx.beginPath(); ctx.roundRect(W/2-w/2, 86, w, 34, 17); ctx.fill();
    ctx.fillStyle = '#FFF8EC'; ctx.font = '800 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(notice.txt, W/2, 103);
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic'; if(u >= 1) notice = null; }
  requestAnimationFrame(draw);
}

// ── 소리 (합성음) ──
let AC = null;
function beep(f, d, type, v){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  const o = AC.createOscillator(), gn = AC.createGain(); o.type = type || 'triangle'; o.frequency.value = f;
  gn.gain.setValueAtTime(v || 0.12, AC.currentTime); gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
  o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime + d); }catch(e){} }

// ── 놓기와 연출 ── 규칙 계산은 core가 한 번에 끝내고, 화면(disp)은 기록(steps)을 따라 한 걸음씩 따라간다
function doPlace(i, at){
  if(busy || !g.tray[i] || disp[at].length) return;
  const colorsBefore = g.nColors(), placed = g.tray[i].slice();
  const res = g.place(i, at); if(!res) return;
  busy = true; sel = -1; disp[at] = placed; beep(330, 0.08);
  let delay = 0.05;
  const run = (k) => {
    if(k >= res.steps.length){ setTimeout(finish, 120); return; }
    const s = res.steps[k];
    if(s.t === 'move'){
      const a = cellXY(s.from), b = cellXY(s.to); let left = s.n;
      for(let j=0;j<s.n;j++){
        setTimeout(() => { disp[s.from].pop(); }, (j*0.06)*1000);
        anim.push({ c: s.c, x0: a.x, y0: a.y, x1: b.x, y1: b.y, t: -j*0.06, d: 0.26, done: () => { disp[s.to].push(s.c); beep(520 + 30*disp[s.to].length, 0.05, 'sine', 0.06); if(--left === 0) run(k+1); } });
      }
    } else {
      const p = cellXY(s.at); for(let j=0;j<s.n;j++) disp[s.at].pop();
      for(let j=0;j<18;j++) fx.push({ kind:'bit', x:p.x, y:p.y, vx:(Math.random()-.5)*320, vy:-120-Math.random()*260, t:0, col: COL[OW[s.c]] });
      fx.push({ kind:'txt', x:p.x, y:p.y - HEX*0.4, txt: NAME[OW[s.c]] + ' 배달! +' + s.pts, sz: 20, col:'#FFF8EC', t:0 });
      if(s.chain >= 2) fx.push({ kind:'txt', x:W/2, y:BY - HEX*3.6, txt: s.chain + '연쇄 ×' + s.chain, sz: 30, col:'#F2C14B', t:0 });
      [0,1,2].forEach(j => setTimeout(() => beep(523*Math.pow(1.26, j + s.chain - 1), 0.14, 'triangle', 0.13), j*70));
      setTimeout(() => run(k+1), 380);
    }
  };
  setTimeout(() => run(0), delay*1000);
  function finish(){
    disp = g.board.map(s => s.slice());   // 혹시 어긋났으면 규칙 쪽 상태로 맞춤
    busy = false;
    if(g.nColors() > colorsBefore) notice = { txt: NAME[OW[g.nColors()-1]] + ' 편지도 오기 시작했어요', t: 0 };
    if(g.score > best){ best = g.score; try{ localStorage.setItem('somsom_post_best', String(best)); }catch(e){} }
    if(g.over) setTimeout(showResult, 500);
  }
}
function showResult(){
  $('resBig').textContent = g.score.toLocaleString();
  const fav = Object.entries(g.st.sentBy).sort((a,b)=>b[1]-a[1])[0];
  $('resNote').innerHTML = '배달 <b>' + g.st.sent + '번</b> · 가장 긴 연쇄 <b>' + g.st.maxChain + '</b> · 놓은 더미 <b>' + g.placed + '개</b>' +
    (fav ? '<br>가장 많이 배달한 주민: <b>' + NAME[fav[0]] + '</b> (' + fav[1] + '번)' : '') +
    '<br>' + (g.score >= best ? '<b>새 최고 기록!</b>' : '최고까지 <b>' + (best - g.score).toLocaleString() + '점</b>');
  $('sResult').classList.remove('hidden');
}
function newGame(){
  g = C.Game((Math.random()*2**32)>>>0); disp = g.board.map(s => s.slice()); anim = []; fx = []; busy = false; sel = -1; notice = null;
  $('sResult').classList.add('hidden'); $('sTitle').classList.add('hidden');
}

// ── 입력: 끌어서 놓기 (또는 더미를 눌러 고르고 칸을 눌러 놓기) ──
const hitCell = (x, y) => { let bi = null, bd = HEX*0.95; for(let i=0;i<g.cells.length;i++){ const p = cellXY(i), d = Math.hypot(p.x-x, p.y-y); if(d < bd){ bd = d; bi = i; } } return bi; };
const hitTray = (x, y) => { for(let i=0;i<3;i++){ if(!g.tray[i]) continue; const p = trayXY(i); if(Math.abs(p.x-x) < HEX*1.4 && y > p.y - HEX*2.6 && y < p.y + HEX*1.4) return i; } return -1; };
cv.addEventListener('pointerdown', e => {
  if(!g || busy || g.over) return;
  const i = hitTray(e.clientX, e.clientY);
  if(i >= 0){ drag = { i, x: e.clientX, y: e.clientY - HEX*1.6, sx: e.clientX, sy: e.clientY, over: null, moved: false }; cv.setPointerCapture(e.pointerId); return; }
  if(sel >= 0){ const c = hitCell(e.clientX, e.clientY); if(c != null && !disp[c].length) doPlace(sel, c); }
});
cv.addEventListener('pointermove', e => {
  if(!drag) return;
  drag.x = e.clientX; drag.y = e.clientY - HEX*1.6;
  if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
  const c = hitCell(drag.x, drag.y); drag.over = (c != null && !disp[c].length) ? c : null;
});
cv.addEventListener('pointerup', () => {
  if(!drag) return; const d = drag; drag = null;
  if(!d.moved){ sel = sel === d.i ? -1 : d.i; return; }
  if(d.over != null) doPlace(d.i, d.over);
});
cv.addEventListener('pointercancel', () => { drag = null; });

$('btnStart').onclick = newGame;
$('btnAgain').onclick = newGame;
resize();
g = C.Game(1); disp = g.board.map(s => s.slice());   // 타이틀 뒤에 보일 판
requestAnimationFrame(draw);
</script>
</body>
</html>
