<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3B2F28">
<title>솜솜시티: 주민 원정 (시험판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
:root{--ink:#2B2118;--paper:#FFF8EC;--accent:#E0663F;--gold:#F2B33D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#3B2F28;color:var(--ink);font-family:"Gowun Dodum",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 16px;background:rgba(43,33,24,.78);z-index:5;overflow-y:auto}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:18px 16px;max-width:380px;width:100%;box-shadow:0 6px 0 var(--ink)}
.tag{display:inline-block;font-size:12px;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;background:#FFE08A}
h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:40px;margin:8px 0 2px;letter-spacing:-1px;text-align:center}
.sub{font-size:14px;margin:0 0 12px;text-align:center}
.heroes{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.hero{border:2.5px solid var(--ink);border-radius:16px;padding:10px;display:flex;gap:10px;background:#fff;cursor:pointer;text-align:left}
.hero.sel{background:#FFF1C9;box-shadow:0 0 0 3px var(--gold) inset}
.hero img{width:64px;height:64px;object-fit:contain;flex:none}
.hero .nm{font-family:"Black Han Sans",sans-serif;font-size:20px;display:flex;align-items:center;gap:8px}
.hero .lv{font-size:13px;background:var(--ink);color:var(--paper);border-radius:8px;padding:1px 7px;font-family:"Black Han Sans",sans-serif}
.hero .bar{height:8px;border:2px solid var(--ink);border-radius:99px;background:#eee;overflow:hidden;margin:4px 0 6px}
.hero .bar i{display:block;height:100%;background:#7BC86C}
.hero ul{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.5}
.hero li.off{opacity:.45}
.hero li b{font-weight:700}
.btn{font-family:"Black Han Sans",sans-serif;font-size:24px;border:3px solid var(--ink);background:var(--accent);color:#fff;border-radius:16px;padding:12px 0;width:100%;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:15px;padding:8px 0;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:8px;margin-top:8px}
.note{font-size:12px;opacity:.7;text-align:center;margin-top:8px}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;z-index:3;padding:calc(env(safe-area-inset-top) + 8px) 10px 0}
#xpbar{height:12px;border:2.5px solid var(--ink);border-radius:99px;background:rgba(255,248,236,.9);overflow:hidden;max-width:520px;margin:0 auto}
#xpbar i{display:block;height:100%;background:linear-gradient(90deg,#9BE07F,#5FB84C);width:0}
#hudrow{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:6px auto 0;font-family:"Black Han Sans",sans-serif;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke}
#lvl{font-size:22px}
#time{font-size:28px}
#time.boss{color:#FFB3A8}
#kills{font-size:16px}
#skills{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-wrap:wrap;gap:4px;max-width:70%;pointer-events:none;z-index:3}
#skills span{font-size:11px;background:rgba(255,248,236,.92);border:2px solid var(--ink);border-radius:8px;padding:1px 6px}
#skills span.evo{background:#FFE08A}
#up{z-index:6}
#up h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:38px;color:#FFE08A;-webkit-text-stroke:2px var(--ink);paint-order:stroke;margin:0 0 4px;text-align:center}
#up .lvtxt{color:var(--paper);text-align:center;margin-bottom:12px;font-size:14px}
.cards{display:flex;flex-direction:column;gap:10px;max-width:380px;width:100%}
.opt{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left;animation:pop .28s ease-out both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}
@keyframes pop{from{transform:translateY(16px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt .t{display:flex;align-items:center;gap:8px;font-family:"Black Han Sans",sans-serif;font-size:19px}
.opt .chip{font-size:11px;font-family:"Gowun Dodum",sans-serif;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:0 6px}
.opt .chip.new{background:#9BE07F}
.opt .chip.up{background:#fff}
.opt .chip.evo{background:#FFE08A}
.opt .d{font-size:14px;margin-top:4px}
.opt .pips{display:flex;gap:3px;margin-left:auto}
.opt .pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.opt .pips i.on{background:var(--accent)}
.opt.evo{background:linear-gradient(135deg,#FFF1C9,#FFE08A);border-color:#8A5A10}
/* 카드: 그림 + 등급 테두리 + 뒤집히며 등장 */
.opt{display:flex;gap:12px;align-items:center;perspective:600px;animation:flip .42s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none;position:relative;overflow:hidden}
.cards.ready .opt{pointer-events:auto}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.opt:nth-child(1){animation-delay:.05s}.opt:nth-child(2){animation-delay:.2s}.opt:nth-child(3){animation-delay:.35s}
.opt .ic{width:58px;height:58px;flex:none;border-radius:14px;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center}
.opt .ic img{width:52px;height:52px}
.opt .body{flex:1;min-width:0}
.opt.new{border-color:#2E6FB0;box-shadow:0 4px 0 #2E6FB0}.opt.new .ic{background:#DDEBFA}
.opt.pas .ic{background:#E6F4DE}
.opt.evo{box-shadow:0 4px 0 #8A5A10,0 0 24px rgba(255,210,90,.8)}
.opt.evo .ic{background:#FFE08A}
.opt.evo::after,.opt.new::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 1.6s 0.6s infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.opt.chosen{animation:chosen .38s ease-out forwards!important}
@keyframes chosen{0%{transform:scale(1)}40%{transform:scale(1.08);box-shadow:0 0 0 6px #FFE08A,0 0 40px #FFE08A}100%{transform:scale(.6) translateY(120px);opacity:0}}
.opt.gone{animation:gone .25s ease-in forwards!important}
@keyframes gone{to{transform:scale(.85);opacity:0}}
#up h2{animation:uph .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes uph{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
/* 보물 상자 */
#chest{z-index:7}
#chest .box{width:150px;height:120px;position:relative;margin:34px auto 12px}
#chest .lid,#chest .base{position:absolute;left:10px;right:10px;border:4px solid var(--ink);background:#B9743E}
#chest .base{bottom:0;height:62px;border-radius:0 0 14px 14px;background:linear-gradient(#B9743E,#8C5428)}
#chest .lid{top:14px;height:44px;border-radius:30px 30px 6px 6px;transform-origin:10% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#chest .base::before,#chest .lid::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:16px;margin-left:-8px;background:#F2B33D;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
#chest.shake .box{animation:shake .12s linear 6}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
#chest.open .lid{transform:rotate(-28deg) translateY(-6px)}
#chest .rays{position:absolute;left:50%;top:40%;width:340px;height:340px;margin:-170px;background:conic-gradient(from 0deg,rgba(255,224,138,.55) 0 10deg,transparent 10deg 30deg,rgba(255,224,138,.55) 30deg 40deg,transparent 40deg 60deg,rgba(255,224,138,.55) 60deg 70deg,transparent 70deg 90deg,rgba(255,224,138,.55) 90deg 100deg,transparent 100deg 120deg,rgba(255,224,138,.55) 120deg 130deg,transparent 130deg 150deg,rgba(255,224,138,.55) 150deg 160deg,transparent 160deg 180deg,rgba(255,224,138,.55) 180deg 190deg,transparent 190deg 210deg,rgba(255,224,138,.55) 210deg 220deg,transparent 220deg 240deg,rgba(255,224,138,.55) 240deg 250deg,transparent 250deg 270deg,rgba(255,224,138,.55) 270deg 280deg,transparent 280deg 300deg,rgba(255,224,138,.55) 300deg 310deg,transparent 310deg 330deg,rgba(255,224,138,.55) 330deg 340deg,transparent 340deg 360deg);border-radius:50%;opacity:0;transition:opacity .3s;animation:spin 6s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
#chest.open .rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
#chest .slot{width:104px;height:104px;margin:0 auto;border:4px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;position:relative;box-shadow:0 0 0 4px #F2B33D}
#chest .reel{position:absolute;left:0;top:0;width:100%}
#chest .reel img{display:block;width:88px;height:88px;padding:4px;box-sizing:content-box}
#chest .got{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px;margin-top:12px}
#chest .gotc{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;animation:pop .3s ease-out both}
#chest .gotc img{width:44px;height:44px}
#chest .gotc b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:17px}
#chest h2{position:relative;z-index:2;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:34px;color:#FFE08A;-webkit-text-stroke:2px var(--ink);paint-order:stroke;margin:0 0 6px;text-align:center}
.screen>:first-child{margin-top:auto!important}.screen>:last-child{margin-bottom:auto!important}
#res .big{font-family:"Black Han Sans",sans-serif;font-size:44px;text-align:center;line-height:1.1}
#res .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 12px;text-align:center}
#res .stats div{border:2px solid var(--ink);border-radius:12px;padding:6px 2px;font-size:12px;background:#fff}
#res .stats b{display:block;font-family:"Black Han Sans",sans-serif;font-size:20px;font-weight:400}
#res .hxp{border:2.5px solid var(--ink);border-radius:14px;padding:10px;background:#fff;margin-bottom:12px}
#res .hxp .bar{height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#eee;margin:6px 0}
#res .hxp .bar i{display:block;height:100%;background:#7BC86C;width:0;transition:width .9s ease-out}
#res .unl{background:#FFE08A;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14px;animation:pop .35s ease-out both}
#res .unl b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:17px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><i></i></div>
  <div id="hudrow"><span id="lvl">Lv 1</span><span id="time">3:00</span><span id="kills">0</span></div>
</div>
<div id="skills" class="hidden"></div>

<div class="screen" id="sTitle">
  <div class="card">
    <div style="text-align:center"><span class="tag">시험판 · 색깔 블록</span></div>
    <h1>주민 원정</h1>
    <p class="sub">은행나무 골목에 골칫거리가 몰려와요. 3분만 버텨 주세요!</p>
    <div class="heroes" id="heroes"></div>
    <button class="btn" id="goBtn">출발</button>
    <div class="row"><button class="btn sm" id="dbgUp">레벨 올려 보기(시험)</button><button class="btn sm" id="dbgReset">처음부터</button></div>
    <div class="note">화면을 밀어서 움직여요. 공격은 저절로 해요.</div>
  </div>
</div>

<div class="screen hidden" id="up">
  <h2>레벨 업!</h2>
  <div class="lvtxt" id="upTxt">기술 하나를 골라요</div>
  <div class="cards" id="cards"></div>
</div>

<div class="screen hidden" id="chest">
  <h2 id="chTitle">보물 상자!</h2>
  <div style="position:relative"><div class="rays"></div><div class="box"><div class="lid"></div><div class="base"></div></div></div>
  <div class="slot hidden" id="slot"><div class="reel" id="reel"></div></div>
  <div class="got" id="got"></div>
  <button class="btn hidden" id="chOk" style="max-width:380px;margin-top:12px">받기</button>
</div>

<div class="screen hidden" id="sRes">
  <div class="card" id="res">
    <div class="big" id="rBig">성공!</div>
    <div class="stats"><div>버틴 시간<b id="rT">0</b></div><div>물리친 수<b id="rK">0</b></div><div>판 레벨<b id="rL">0</b></div></div>
    <div class="hxp"><div style="display:flex;justify-content:space-between;font-size:14px"><b id="rHero">람다</b><span id="rGain">+0</span></div>
      <div class="bar"><i id="rBar"></i></div><div style="font-size:12px" id="rNext"></div>
      <div id="rUnl"></div></div>
    <button class="btn" id="againBtn">한 판 더</button>
    <div class="row"><button class="btn sm" id="titleBtn">주민 바꾸기</button></div>
  </div>
</div>

<script src="core.js"></script>
<script>
const C = PatrolCore;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){ const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();
const COL = { ramda:'#D0563B', bookgeo:'#3E9C9A' };
const SKCOL = { acorn:'#8B5A2B', tail:'#D0563B', button:'#C9A15A', pocket:'#B9743E', storm:'#F2B33D', spray:'#B79AD8', wave:'#4FA3D9', euca:'#6FA866', shell:'#6F5B3F', tide:'#2E7FC2', shoes:'#888', lunch:'#E98A5B', lens:'#6FA8DC', clock:'#C8A85A' };

// ── 그림 ──
const img = s => { const i = new Image(); i.src = s; return i; };
const ok = i => i && i.complete && i.naturalWidth > 0;
const IMG = {};
for(const k of ['ramda','bookgeo']){ for(let i = 0; i < 4; i++) IMG[k + i] = img('../assets/frame_' + k + '_' + i + '.png'); IMG['p_' + k] = img('../assets/basket/ch_' + k + '.webp'); IMG['h_' + k] = img('../assets/basket/ch_' + k + '_hit.webp'); }

// ── 기술 그림: 작은 캔버스에 그려 이미지로 씀 ──
const ICON = {};
function icon(id){
  if(ICON[id]) return ICON[id];
  const c = document.createElement('canvas'); c.width = c.height = 104; const x = c.getContext('2d'); x.translate(52, 52); x.lineWidth = 4; x.strokeStyle = '#2B2118'; x.lineJoin = 'round'; x.lineCap = 'round';
  const acornAt = (ax, ay, s, gold) => { x.save(); x.translate(ax, ay); x.scale(s, s); x.fillStyle = gold ? '#F2B33D' : '#B9743E'; x.beginPath(); x.ellipse(0, 6, 14, 17, 0, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#6B4A2E'; x.beginPath(); x.ellipse(0, -8, 17, 10, 0, 0, 7); x.fill(); x.stroke(); x.beginPath(); x.moveTo(0, -17); x.lineTo(3, -25); x.stroke(); x.restore(); };
  const leaf = (ax, ay, a, s, col) => { x.save(); x.translate(ax, ay); x.rotate(a); x.scale(s, s); x.fillStyle = col; x.beginPath(); x.moveTo(0, 18); x.quadraticCurveTo(22, -6, 0, -22); x.quadraticCurveTo(-22, -6, 0, 18); x.fill(); x.stroke(); x.beginPath(); x.moveTo(0, 16); x.lineTo(0, -18); x.lineWidth = 2; x.stroke(); x.restore(); x.lineWidth = 4; };
  switch(id){
    case 'acorn': acornAt(-8, 6, 1.1); x.strokeStyle = '#D0563B'; x.lineWidth = 5; x.beginPath(); x.moveTo(14, -10); x.lineTo(34, -26); x.moveTo(20, 2); x.lineTo(38, -6); x.stroke(); break;
    case 'tail': x.fillStyle = '#D0563B'; x.beginPath(); x.moveTo(-30, 30); x.bezierCurveTo(-40, -10, 0, -40, 26, -24); x.bezierCurveTo(42, -12, 30, 12, 10, 4); x.bezierCurveTo(-4, -2, -8, 14, -6, 30); x.closePath(); x.fill(); x.stroke();
      x.strokeStyle = '#F7C59F'; x.lineWidth = 4; x.beginPath(); x.arc(0, 0, 40, -2.6, -1.2); x.stroke(); break;
    case 'button': x.fillStyle = '#E3C27A'; x.beginPath(); x.arc(0, 0, 32, 0, 7); x.fill(); x.stroke(); x.beginPath(); x.arc(0, 0, 22, 0, 7); x.lineWidth = 2; x.stroke(); x.fillStyle = '#2B2118'; [[-7,-7],[7,-7],[-7,7],[7,7]].forEach(([a,b]) => { x.beginPath(); x.arc(a, b, 4, 0, 7); x.fill(); }); break;
    case 'pocket': x.fillStyle = '#6B4A2E'; x.beginPath(); x.roundRect(-30, -20, 60, 52, 10); x.fill(); x.stroke(); x.beginPath(); x.moveTo(-30, -6); x.lineTo(30, -6); x.stroke(); acornAt(-10, -22, 0.6); acornAt(12, -26, 0.6); break;
    case 'storm': x.strokeStyle = 'rgba(242,179,61,.7)'; x.lineWidth = 6; x.beginPath(); x.arc(0, 0, 32, 0, 7); x.stroke(); x.strokeStyle = '#2B2118'; x.lineWidth = 4; for(let i = 0; i < 5; i++){ const a = i*1.256 - 1.57; acornAt(Math.cos(a)*32, Math.sin(a)*32, 0.5, true); } break;
    case 'spray': x.fillStyle = '#9FD8E8'; x.beginPath(); x.roundRect(-34, -6, 30, 40, 8); x.fill(); x.stroke(); x.fillStyle = '#2B2118'; x.fillRect(-26, -18, 14, 12); x.fillStyle = '#E4D4F5'; for(let i = 0; i < 6; i++){ x.beginPath(); x.arc(4 + i*6, -14 + Math.sin(i)*14, 5 + i*0.6, 0, 7); x.fill(); } break;
    case 'wave': case 'tide': { const col = id === 'tide' ? '#2E7FC2' : '#4FA3D9'; x.strokeStyle = col; for(let i = 0; i < 3; i++){ x.lineWidth = 7 - i*1.5; x.beginPath(); x.arc(0, 8, 14 + i*12, Math.PI*1.1, Math.PI*1.9); x.stroke(); }
      if(id === 'tide'){ x.fillStyle = '#2E7FC2'; x.strokeStyle = '#2B2118'; x.lineWidth = 4; x.beginPath(); x.moveTo(-38, 34); x.bezierCurveTo(-30, 4, -6, -6, 10, 6); x.bezierCurveTo(0, 6, -4, 18, 8, 22); x.lineTo(38, 22); x.lineTo(38, 34); x.closePath(); x.fill(); x.stroke(); } break; }
    case 'euca': leaf(-12, 4, -0.5, 1.1, '#6FA866'); leaf(14, -4, 0.5, 1, '#8FBF7A'); break;
    case 'shell': x.fillStyle = '#6F5B3F'; x.beginPath(); x.ellipse(0, 6, 36, 28, 0, Math.PI, 0); x.lineTo(36, 14); x.lineTo(-36, 14); x.closePath(); x.fill(); x.stroke(); x.lineWidth = 2; x.beginPath(); for(let i = -1; i <= 1; i++){ x.moveTo(i*14 - 7, -10); x.lineTo(i*14 + 7, -10); x.lineTo(i*14 + 10, 2); x.lineTo(i*14 - 10, 2); x.closePath(); } x.stroke(); break;
    case 'shoes': x.fillStyle = '#6FA8DC'; x.beginPath(); x.moveTo(-34, 4); x.lineTo(-24, -20); x.lineTo(0, -20); x.quadraticCurveTo(6, 0, 34, 6); x.lineTo(34, 18); x.lineTo(-34, 18); x.closePath(); x.fill(); x.stroke(); x.fillStyle = '#fff'; x.fillRect(-34, 12, 68, 8); x.strokeRect(-34, 12, 68, 8); break;
    case 'lunch': x.fillStyle = '#E98A5B'; x.beginPath(); x.roundRect(-34, -14, 68, 44, 8); x.fill(); x.stroke(); x.fillStyle = '#F7F1E6'; x.beginPath(); x.moveTo(-10, -14); x.quadraticCurveTo(0, -34, 10, -14); x.fill(); x.stroke(); x.fillStyle = '#E06C75'; x.beginPath(); x.arc(0, 8, 8, 0, 7); x.fill(); break;
    case 'lens': x.lineWidth = 7; x.beginPath(); x.moveTo(14, 14); x.lineTo(34, 34); x.stroke(); x.lineWidth = 4; x.fillStyle = '#DDEBFA'; x.beginPath(); x.arc(-6, -6, 26, 0, 7); x.fill(); x.stroke(); break;

function drawHero(t){
  const p = g.p, k = g.hero, moving = Math.hypot(p.ix, p.iy) > 0.1;
  if(moving){ walkPh += (1/60)*p.spd/22; if(Math.abs(p.ix) > 0.15) face = p.ix > 0 ? 1 : -1; }
  const im = p.hurt > 0.2 && ok(IMG['h_' + k]) ? IMG['h_' + k] : IMG[k + (moving ? Math.floor(walkPh) % 4 : 0)];
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(40,30,20,.25)'; ctx.beginPath(); ctx.ellipse(0, 14, 20, 7, 0, 0, 7); ctx.fill();
  // 주민 색 발밑 고리 (5레벨 새 옷이면 금빛)
  ctx.strokeStyle = p.outfit ? '#F2B33D' : COL[k]; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 14, 22, 8, 0, 0, 7); ctx.stroke();
  if(ok(im)){ const hh = k === 'bookgeo' ? 40 : 58, ww = hh*im.naturalWidth/im.naturalHeight, bob = moving ? -Math.abs(Math.sin(walkPh*Math.PI/2))*4 : Math.sin(t*3)*1.5;
    ctx.scale(face, 1); if(p.hurt > 0 && Math.floor(t*30) % 2) ctx.globalAlpha = 0.5; ctx.drawImage(im, -ww/2, 16 - hh + bob, ww, hh); ctx.globalAlpha = 1; }
  else { ctx.fillStyle = COL[k]; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill(); }
  ctx.restore();
  // 체력 막대
  const w = 44; ctx.fillStyle = '#2B2118'; ctx.fillRect(p.x - w/2 - 2, p.y + 24, w + 4, 8); ctx.fillStyle = p.hp/p.maxhp < 0.3 ? '#E0663F' : '#7BC86C'; ctx.fillRect(p.x - w/2, p.y + 26, w*p.hp/p.maxhp, 4);
}

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; sfxBudget = 4;
  requestAnimationFrame(frame);
  if(!g){ ctx.fillStyle = '#3B2F28'; ctx.fillRect(0, 0, W, H); return; }
  if(mode === 'PLAY'){
    const [ax, ay] = input(); g.setInput(ax, ay);
    if(slow > 0) slow -= dt;
    g.update(dt*(slow > 0 ? 0.35 + 0.65*(1 - slow/0.9) : 1)); events();
    if(g.chest) openChest();
    else if(g.choices){ mode = 'UPWAIT'; addFx({ k:'lvBurst', life:0.45 }); blip(660, 0.1, 'triangle', 0.08); setTimeout(() => blip(990, 0.2, 'triangle', 0.08), 90); buzz(30); setTimeout(showChoices, 420); }
    if(g.over && mode === 'PLAY') finish();
  }
  const p = g.p, t = g.t;
  cam.x += (p.x - cam.x)*Math.min(1, dt*8); cam.y += (p.y - cam.y)*Math.min(1, dt*8);
  shake = Math.max(0, shake - dt); flashRing = Math.max(0, flashRing - dt*2);
  const sx = shake ? (Math.random() - 0.5)*shake*18 : 0, sy = shake ? (Math.random() - 0.5)*shake*18 : 0;
  ctx.save(); ctx.translate(W/2 - cam.x + sx, H/2 - cam.y + sy);
  try{ drawWorld(t, p, dt); } catch(err){ console.error(err); }
  ctx.restore();
  drawScreen(t, p, dt);
}
function drawWorld(t, p, dt){
  drawGround();
  // 깔린 것·퍼지는 것
  for(const a of g.areas){
    if(a.k === 'euca'){ ctx.globalAlpha = Math.min(1, a.life)*0.5; ctx.fillStyle = '#8FBF7A'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.fill(); ctx.globalAlpha = Math.min(1, a.life);
      ctx.fillStyle = '#5E8F4E'; for(let i = 0; i < 6; i++){ const an = i*1.05 + a.t*0.5; ctx.save(); ctx.translate(a.x + Math.cos(an)*a.r*0.6, a.y + Math.sin(an)*a.r*0.6); ctx.rotate(an); ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, 7); ctx.fill(); ctx.restore(); } ctx.globalAlpha = 1; }
    if(a.k === 'wave'){ const al = Math.min(1, a.life*3); ctx.strokeStyle = a.big ? `rgba(46,127,194,${al})` : `rgba(79,163,217,${al})`; ctx.lineWidth = a.big ? 14 : 8; ctx.beginPath(); ctx.arc(a.x, a.y, Math.max(0, a.r), 0, 7); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${al*0.7})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(a.x, a.y, Math.max(0, a.r - 4), 0, 7); ctx.stroke(); }
  }
  // 도토리 (경험치)
  for(const m of g.gems){ ctx.save(); ctx.translate(m.x, m.y + Math.sin(t*5 + m.x)*1.5); const s = m.big ? 1.6 : 1;
    ctx.fillStyle = '#B9743E'; ctx.beginPath(); ctx.ellipse(0, 1.5*s, 3.6*s, 4.2*s, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#6B4A2E'; ctx.beginPath(); ctx.ellipse(0, -1.8*s, 4.2*s, 2.2*s, 0, 0, 7); ctx.fill(); ctx.restore(); }
  for(const e of g.foes) drawFoe(e, t);
  // 날아가는 것
  for(const s of g.shots){ ctx.save(); ctx.translate(s.x, s.y);
    if(s.k === 'acorn'){ ctx.rotate(t*12); ctx.fillStyle = '#B9743E'; ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0, 1.5, s.r*0.75, s.r*0.9, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#6B4A2E'; ctx.beginPath(); ctx.ellipse(0, -s.r*0.4, s.r*0.9, s.r*0.5, 0, 0, 7); ctx.fill(); ctx.stroke(); }
    else if(s.k === 'button'){ ctx.rotate(s.t*14); ctx.fillStyle = '#E3C27A'; ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, s.r, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#2B2118'; for(let i = 0; i < 4; i++){ ctx.beginPath(); ctx.arc(Math.cos(i*Math.PI/2 + 0.78)*3.5, Math.sin(i*Math.PI/2 + 0.78)*3.5, 1.4, 0, 7); ctx.fill(); } }
    ctx.restore(); }
  // 도토리 폭풍 (돌아가는 도토리)
  if(p.skills.storm){ const R = 70*p.area; for(let i = 0; i < 5; i++){ const a = g.orbit + i*Math.PI*2/5; ctx.save(); ctx.translate(p.x + Math.cos(a)*R, p.y + Math.sin(a)*R); ctx.rotate(a*3);
    ctx.fillStyle = '#F2B33D'; ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0, 2, 7, 8, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#6B4A2E'; ctx.beginPath(); ctx.ellipse(0, -4, 8, 4.5, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.strokeStyle = 'rgba(242,179,61,.25)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7); ctx.stroke(); }
  // 보물 상자 (떨어진 것)
  for(const c of g.chests){ const bob = Math.sin(t*4)*3; ctx.save(); ctx.translate(c.x, c.y + bob);
    ctx.globalAlpha = 0.35 + Math.sin(t*6)*0.15; ctx.fillStyle = '#FFE08A'; ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#B9743E'; ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.roundRect(-14, -4, 28, 16, 3); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.roundRect(-14, -14, 28, 11, [9, 9, 2, 2]); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F2B33D'; ctx.fillRect(-3, -14, 6, 26); ctx.strokeRect(-3, -14, 6, 26); ctx.restore(); }
  drawHero(t);
  // 월드 연출
  for(const f of fx){ f.t += dt; const a = 1 - f.t/(f.life || 1); if(a <= 0) continue;
    if(f.k === 'num'){ ctx.globalAlpha = a; ctx.font = '400 13px "Black Han Sans",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#2B2118'; ctx.strokeText(f.s, f.x, f.y - f.t*30); ctx.fillStyle = '#FFF8EC'; ctx.fillText(f.s, f.x, f.y - f.t*30); ctx.globalAlpha = 1; }
    else if(f.k === 'bit'){ f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= 1 - dt*3; f.vy *= 1 - dt*3; ctx.globalAlpha = a; ctx.fillStyle = f.c; ctx.fillRect(f.x - f.s/2, f.y - f.s/2, f.s, f.s); ctx.globalAlpha = 1; }
    else if(f.k === 'poof'){ ctx.globalAlpha = a*0.6; ctx.strokeStyle = '#FFF8EC'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.r*(1 + f.t*4), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    else if(f.k === 'tail'){ ctx.globalAlpha = a*0.8; ctx.strokeStyle = '#D0563B'; ctx.lineWidth = 10*a + 2; const st = f.t*18; ctx.beginPath(); ctx.arc(p.x, p.y, f.r*(0.7 + f.t*1.2), st, st + Math.PI*1.4); ctx.stroke();
      ctx.strokeStyle = '#F7C59F'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, f.r*(0.6 + f.t*1.2), st, st + Math.PI*1.2); ctx.stroke(); ctx.globalAlpha = 1; }
    else if(f.k === 'spray'){ ctx.globalAlpha = a*0.45; const g2 = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, f.len); g2.addColorStop(0, '#E4D4F5'); g2.addColorStop(1, 'rgba(183,154,216,0)'); ctx.fillStyle = g2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, f.len*(0.6 + f.t*1.2), f.a - 0.5, f.a + 0.5); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }
    else if(f.k === 'lvBurst'){ const q = f.t/f.life; ctx.globalAlpha = 1 - q; ctx.strokeStyle = '#FFE08A'; ctx.lineWidth = 10*(1 - q) + 2; ctx.beginPath(); ctx.arc(p.x, p.y, 20 + q*160, 0, 7); ctx.stroke();
      for(let i = 0; i < 12; i++){ const an = i*Math.PI/6 + q; ctx.beginPath(); ctx.moveTo(p.x + Math.cos(an)*(30 + q*60), p.y + Math.sin(an)*(30 + q*60)); ctx.lineTo(p.x + Math.cos(an)*(50 + q*140), p.y + Math.sin(an)*(50 + q*140)); ctx.stroke(); } ctx.globalAlpha = 1; }
    else if(f.k === 'pickRing'){ const q = f.t/f.life; ctx.globalAlpha = 1 - q; ctx.strokeStyle = f.c; ctx.lineWidth = 14*(1 - q) + 2; ctx.beginPath(); ctx.arc(p.x, p.y, 16 + q*120, 0, 7); ctx.stroke(); ctx.fillStyle = f.c; ctx.globalAlpha = (1 - q)*0.25; ctx.beginPath(); ctx.arc(p.x, p.y, 16 + q*120, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    else if(f.k === 'pickTxt'){ const q = f.t/f.life, sc = 1 + Math.max(0, 0.25 - f.t)*2; ctx.save(); ctx.translate(p.x, p.y - 60 - q*30); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, (1 - q)*3); ctx.textAlign = 'center'; ctx.font = `400 ${f.evo ? 24 : 18}px "Black Han Sans",sans-serif`; ctx.lineWidth = 5; ctx.strokeStyle = '#2B2118'; ctx.strokeText(f.s, 0, 0); ctx.fillStyle = f.evo ? '#FFE08A' : '#FFF8EC'; ctx.fillText(f.s, 0, 0); ctx.restore(); ctx.globalAlpha = 1; }
    else if(f.k === 'glow'){ ctx.globalAlpha = a; ctx.strokeStyle = '#FFE08A'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(p.x, p.y, 20 + f.t*90, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
  }
}
function drawScreen(t, p, dt){
  // 화면 연출
  if(bossBanner > 0){ bossBanner -= dt; const a = Math.min(1, bossBanner*2); ctx.globalAlpha = a*0.35; ctx.fillStyle = '#5A2A2A'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = a;
    ctx.textAlign = 'center'; ctx.font = '400 34px "Black Han Sans",sans-serif'; ctx.lineWidth = 7; ctx.strokeStyle = '#2B2118'; ctx.strokeText('왕꼬릿 구름이 나타났다!', W/2, H*0.38); ctx.fillStyle = '#FFB3A8'; ctx.fillText('왕꼬릿 구름이 나타났다!', W/2, H*0.38); ctx.globalAlpha = 1; }
  for(const f of fx){ if(f.k !== 'banner') continue; const a = Math.min(1, (f.life - f.t)*3); if(a <= 0) continue;
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.font = `400 ${f.small ? 22 : 30}px "Black Han Sans",sans-serif`; ctx.lineWidth = 6; ctx.strokeStyle = '#2B2118'; ctx.strokeText(f.s, W/2, H*0.3); ctx.fillStyle = f.small ? '#FFF8EC' : '#FFE08A'; ctx.fillText(f.s, W/2, H*0.3); ctx.globalAlpha = 1; }
  for(const f of fx){ if(f.k === 'flash' && f.t < f.life){ ctx.globalAlpha = (1 - f.t/f.life)*0.7; ctx.fillStyle = '#FFF3C4'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  fx = fx.filter(f => f.t < (f.life || 1));
  if(p.hp/p.maxhp < 0.3 && mode === 'PLAY'){ const a = 0.25 + Math.sin(performance.now()/150)*0.1; const v = ctx.createRadialGradient(W/2, H/2, Math.min(W, H)*0.35, W/2, H/2, Math.max(W, H)*0.75); v.addColorStop(0, 'rgba(224,102,63,0)'); v.addColorStop(1, `rgba(224,102,63,${a})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }
  if(joy.on && mode === 'PLAY'){ ctx.globalAlpha = 0.3; ctx.fillStyle = '#FFF8EC'; ctx.beginPath(); ctx.arc(joy.x0, joy.y0, 42, 0, 7); ctx.fill(); ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.arc(joy.x, joy.y, 17, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  // HUD
  if(mode !== 'TITLE' && mode !== 'END'){
    $('xpbar').firstElementChild.style.width = (p.xp/p.next*100) + '%';
    $('lvl').textContent = 'Lv ' + p.lv;
    const left = Math.max(0, Math.ceil(g.P.time - t)); $('time').textContent = Math.floor(left/60) + ':' + String(left % 60).padStart(2, '0'); $('time').classList.toggle('boss', !!g.boss);
    $('kills').textContent = '물리침 ' + g.kills;
  }
}
requestAnimationFrame(frame);
</script>
</body>
