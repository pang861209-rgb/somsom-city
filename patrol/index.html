<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3B2F28">
<title>솜솜시티: 주민 원정</title>
<meta name="description" content="솜솜시티 주민 여섯이 골목을 지키는 3분 원정. 기술을 고르고 진화시키고, 주민마다 레벨을 올려요.">
<script src="../village.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
:root{--ink:#2B2118;--paper:#FFF8EC;--accent:#E0663F;--gold:#F2B33D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#3B2F28;color:var(--ink);font-family:"Gowun Dodum",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 16px;background:rgba(43,33,24,.78);z-index:5;overflow-y:auto}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:18px 16px;max-width:380px;width:100%;box-shadow:0 6px 0 var(--ink)}
.tag{display:inline-block;font-size:12px;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;background:#FFE08A}
h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:40px;margin:8px 0 2px;letter-spacing:-1px;text-align:center}
.sub{font-size:14px;margin:0 0 12px;text-align:center}
.heroes{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.hero{border:2.5px solid var(--ink);border-radius:16px;padding:10px;display:flex;gap:10px;background:#fff;cursor:pointer;text-align:left}
.hero.sel{background:#FFF1C9;box-shadow:0 0 0 3px var(--gold) inset}
.hero{padding:8px 10px}.hero:not(.sel) img{width:44px;height:44px}.hero img{width:64px;height:64px;object-fit:contain;flex:none}
.hero .nm{font-family:"Black Han Sans",sans-serif;font-size:20px;display:flex;align-items:center;gap:8px}
.hero .lv{font-size:13px;background:var(--ink);color:var(--paper);border-radius:8px;padding:1px 7px;font-family:"Black Han Sans",sans-serif}
.hero .bar{height:8px;border:2px solid var(--ink);border-radius:99px;background:#eee;overflow:hidden;margin:4px 0 6px}
.hero .bar i{display:block;height:100%;background:#7BC86C}
.hero ul{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.5}
.hero li.off{opacity:.45}
.hero li b{font-weight:700}
.btn{font-family:"Black Han Sans",sans-serif;font-size:24px;border:3px solid var(--ink);background:var(--accent);color:#fff;border-radius:16px;padding:12px 0;width:100%;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:15px;padding:8px 0;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:8px;margin-top:8px}
.note{font-size:12px;opacity:.7;text-align:center;margin-top:8px}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;z-index:3;padding:calc(env(safe-area-inset-top) + 8px) 10px 0}
#xpbar{height:12px;border:2.5px solid var(--ink);border-radius:99px;background:rgba(255,248,236,.9);overflow:hidden;max-width:520px;margin:0 auto}
#xpbar i{display:block;height:100%;background:linear-gradient(90deg,#9BE07F,#5FB84C);width:0}
#hudrow{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:6px auto 0;font-family:"Black Han Sans",sans-serif;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke}
#lvl{font-size:22px}
#time{font-size:28px}
#time.boss{color:#FFB3A8}
#kills{font-size:16px}
#skills{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-wrap:wrap;gap:4px;max-width:70%;pointer-events:none;z-index:3}
#skills span{font-size:11px;background:rgba(255,248,236,.92);border:2px solid var(--ink);border-radius:8px;padding:1px 6px}
#skills span.evo{background:#FFE08A}
#up{z-index:6}
#up h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:38px;color:#FFE08A;-webkit-text-stroke:2px var(--ink);paint-order:stroke;margin:0 0 4px;text-align:center}
#up .lvtxt{color:var(--paper);text-align:center;margin-bottom:12px;font-size:14px}
.cards{display:flex;flex-direction:column;gap:10px;max-width:380px;width:100%}
.opt{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left;animation:pop .28s ease-out both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}
@keyframes pop{from{transform:translateY(16px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt .t{display:flex;align-items:center;gap:8px;font-family:"Black Han Sans",sans-serif;font-size:19px}
.opt .chip{font-size:11px;font-family:"Gowun Dodum",sans-serif;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:0 6px}
.opt .chip.new{background:#9BE07F}
.opt .chip.up{background:#fff}
.opt .chip.evo{background:#FFE08A}
.opt .d{font-size:14px;margin-top:4px}
.opt .pips{display:flex;gap:3px;margin-left:auto}
.opt .pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.opt .pips i.on{background:var(--accent)}
.opt.evo{background:linear-gradient(135deg,#FFF1C9,#FFE08A);border-color:#8A5A10}
/* 카드: 그림 + 등급 테두리 + 뒤집히며 등장 */
.opt{display:flex;gap:12px;align-items:center;perspective:600px;animation:flip .42s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none;position:relative;overflow:hidden}
.cards.ready .opt{pointer-events:auto}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.opt:nth-child(1){animation-delay:.05s}.opt:nth-child(2){animation-delay:.2s}.opt:nth-child(3){animation-delay:.35s}
.opt .ic{width:58px;height:58px;flex:none;border-radius:14px;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center}
.opt .ic img{width:52px;height:52px}
.opt .body{flex:1;min-width:0}
.opt.new{border-color:#2E6FB0;box-shadow:0 4px 0 #2E6FB0}.opt.new .ic{background:#DDEBFA}
.opt.pas .ic{background:#E6F4DE}
.opt.evo{box-shadow:0 4px 0 #8A5A10,0 0 24px rgba(255,210,90,.8)}
.opt.evo .ic{background:#FFE08A}
.opt.evo::after,.opt.new::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 1.6s 0.6s infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.opt.chosen{animation:chosen .38s ease-out forwards!important}
@keyframes chosen{0%{transform:scale(1)}40%{transform:scale(1.08);box-shadow:0 0 0 6px #FFE08A,0 0 40px #FFE08A}100%{transform:scale(.6) translateY(120px);opacity:0}}
.opt.gone{animation:gone .25s ease-in forwards!important}
@keyframes gone{to{transform:scale(.85);opacity:0}}
#up h2{animation:uph .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes uph{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
/* 보물 상자 */
#chest{z-index:7}
#chest .box{width:150px;height:120px;position:relative;margin:34px auto 12px}
#chest .lid,#chest .base{position:absolute;left:10px;right:10px;border:4px solid var(--ink);background:#B9743E}
#chest .base{bottom:0;height:62px;border-radius:0 0 14px 14px;background:linear-gradient(#B9743E,#8C5428)}
#chest .lid{top:14px;height:44px;border-radius:30px 30px 6px 6px;transform-origin:10% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#chest .base::before,#chest .lid::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:16px;margin-left:-8px;background:#F2B33D;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
#chest.shake .box{animation:shake .12s linear 6}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
#chest.open .lid{transform:rotate(-28deg) translateY(-6px)}
#chest .rays{position:absolute;left:50%;top:40%;width:340px;height:340px;margin:-170px;background:conic-gradient(from 0deg,rgba(255,224,138,.55) 0 10deg,transparent 10deg 30deg,rgba(255,224,138,.55) 30deg 40deg,transparent 40deg 60deg,rgba(255,224,138,.55) 60deg 70deg,transparent 70deg 90deg,rgba(255,224,138,.55) 90deg 100deg,transparent 100deg 120deg,rgba(255,224,138,.55) 120deg 130deg,transparent 130deg 150deg,rgba(255,224,138,.55) 150deg 160deg,transparent 160deg 180deg,rgba(255,224,138,.55) 180deg 190deg,transparent 190deg 210deg,rgba(255,224,138,.55) 210deg 220deg,transparent 220deg 240deg,rgba(255,224,138,.55) 240deg 250deg,transparent 250deg 270deg,rgba(255,224,138,.55) 270deg 280deg,transparent 280deg 300deg,rgba(255,224,138,.55) 300deg 310deg,transparent 310deg 330deg,rgba(255,224,138,.55) 330deg 340deg,transparent 340deg 360deg);border-radius:50%;opacity:0;transition:opacity .3s;animation:spin 6s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
#chest.open .rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
#chest .slot{width:104px;height:104px;margin:0 auto;border:4px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;position:relative;box-shadow:0 0 0 4px #F2B33D}
#chest .reel{position:absolute;left:0;top:0;width:100%}
#chest .reel img{display:block;width:88px;height:88px;padding:4px;box-sizing:content-box}
#chest .got{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px;margin-top:12px}
#chest .gotc{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;animation:pop .3s ease-out both}
#chest .gotc img{width:44px;height:44px}
#chest .gotc b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:17px}
#chest h2{position:relative;z-index:2;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:34px;color:#FFE08A;-webkit-text-stroke:2px var(--ink);paint-order:stroke;margin:0 0 6px;text-align:center}
.screen>:first-child{margin-top:auto!important}.screen>:last-child{margin-bottom:auto!important}
#res .big{font-family:"Black Han Sans",sans-serif;font-size:44px;text-align:center;line-height:1.1}
#res .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 12px;text-align:center}
#res .stats div{border:2px solid var(--ink);border-radius:12px;padding:6px 2px;font-size:12px;background:#fff}
#res .stats b{display:block;font-family:"Black Han Sans",sans-serif;font-size:20px;font-weight:400}
#res .hxp{border:2.5px solid var(--ink);border-radius:14px;padding:10px;background:#fff;margin-bottom:12px}
#res .hxp .bar{height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#eee;margin:6px 0}
#res .hxp .bar i{display:block;height:100%;background:#7BC86C;width:0;transition:width .9s ease-out}
#res .unl{background:#FFE08A;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14px;animation:pop .35s ease-out both}
#res .unl b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:17px}

.homeBtn{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;z-index:8;background:rgba(43,38,32,.86);border:none;border-radius:13px;padding:6px 13px;font:700 13px "Gowun Dodum",sans-serif;color:#EFE7D6;text-decoration:none;box-shadow:0 4px 14px -6px rgba(0,0,0,.8)}
#pauseBtn{position:fixed;top:calc(env(safe-area-inset-top) + 66px);right:10px;z-index:4;width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);background:rgba(255,248,236,.92);font:700 15px "Black Han Sans",sans-serif;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
#pauseBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.key{width:calc(100% + 32px);margin:-18px -16px 6px;height:190px;border-radius:19px 19px 0 0;overflow:hidden;border-bottom:3px solid var(--ink);background:#F6EBD5}
.key img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;display:block}
.best{font-size:13px;text-align:center;margin:-4px 0 10px}
.best b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:16px}
#res .score{text-align:center;font-size:13px;margin-top:2px}
#res .score b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:34px;color:var(--accent);line-height:1.1}
#res .score .nb{display:inline-block;background:#FFE08A;border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:12px;margin-left:4px}
#rRival{font-size:13px;text-align:center;margin:4px 0 10px;min-height:18px}
.ach{font-size:13px;background:#E6F4DE;border:2px solid var(--ink);border-radius:10px;padding:5px 9px;margin-top:6px}
#board .card{max-height:calc(100vh - 40px);display:flex;flex-direction:column}
#board h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:28px;margin:0 0 8px;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs .btn{font-size:14px;padding:6px 0}.tabs .btn.on{background:var(--ink);color:var(--paper)}
#bNote{font-size:12px;opacity:.7;text-align:center;margin-bottom:6px}
#bList{overflow-y:auto;flex:1;min-height:120px}
.bRow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1.5px dashed rgba(43,33,24,.25);font-size:15px}
.bRow .rk{width:36px;font-family:"Black Han Sans",sans-serif}.bRow img{width:30px;height:30px;object-fit:contain}.bRow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bRow .sc{font-family:"Black Han Sans",sans-serif}
.bRow.top .rk{color:var(--accent)}.bRow.me{background:#FFF1C9;border-radius:8px}
.bMsg{text-align:center;font-size:14px;padding:18px 6px;line-height:1.6}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 90px);transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--paper);border-radius:12px;padding:7px 14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><i></i></div>
  <div id="hudrow"><span id="lvl">Lv 1</span><span id="time">3:00</span><span id="kills">0</span></div>
</div>
<div id="skills" class="hidden"></div>
<button id="pauseBtn" class="hidden" aria-label="잠깐 멈춤">II</button>
<a class="homeBtn" id="homeLink" href="../" title="솜솜시티 홈">← 홈</a>
<div id="toast"></div>

<div class="screen" id="sTitle">
  <div class="card">
    <div class="key"><img src="../assets/patrol/key.webp" alt="주민 원정" onerror="this.parentNode.remove()"></div>
    <h1>주민 원정</h1>
    <p class="sub">은행나무 골목에 골칫거리가 몰려와요. 3분만 버텨 주세요!</p>
    <div class="best" id="best"></div>
    <div class="heroes" id="heroes"></div>
    <button class="btn" id="goBtn">출발</button>
    <div class="row"><button class="btn sm" id="rankBtn">순위 보기</button></div>
    <div class="row hidden" id="dbgRow"><button class="btn sm" id="dbgUp">레벨 올려 보기(개발)</button><button class="btn sm" id="dbgReset">처음부터</button></div>
    <div class="note">화면을 밀어서 움직여요. 공격은 저절로 해요.<br>판을 마칠 때마다 그 주민의 레벨이 올라가요.</div>
  </div>
</div>

<div class="screen hidden" id="up">
  <h2>레벨 업!</h2>
  <div class="lvtxt" id="upTxt">기술 하나를 골라요</div>
  <div class="cards" id="cards"></div>
</div>

<div class="screen hidden" id="chest">
  <h2 id="chTitle">보물 상자!</h2>
  <div style="position:relative"><div class="rays"></div><div class="box"><div class="lid"></div><div class="base"></div></div></div>
  <div class="slot hidden" id="slot"><div class="reel" id="reel"></div></div>
  <div class="got" id="got"></div>
  <button class="btn hidden" id="chOk" style="max-width:380px;margin-top:12px">받기</button>
</div>

<div class="screen hidden" id="sPause">
  <div class="card" style="text-align:center">
    <h1 style="font-size:34px">잠깐 멈춤</h1>
    <p class="sub">숨 고르고 다시 가요.</p>
    <button class="btn" id="resumeBtn">계속하기</button>
    <div class="row"><button class="btn sm" id="quitBtn">그만하기</button></div>
  </div>
</div>

<div class="screen hidden" id="board">
  <div class="card">
    <h2>원정 순위</h2>
    <div class="tabs" id="bTabs"><button class="btn sm on" data-r="week">이번 주</button><button class="btn sm" data-r="all">전체</button></div>
    <div id="bNote"></div>
    <div id="bList"></div>
    <div class="row"><button class="btn sm" id="bClose">닫기</button></div>
  </div>
</div>

<div class="screen hidden" id="sRes">
  <div class="card" id="res">
    <div class="big" id="rBig">성공!</div>
    <div class="score">점수<b id="rScore">0</b></div>
    <div id="rRival"></div>
    <div class="stats"><div>버틴 시간<b id="rT">0</b></div><div>물리친 수<b id="rK">0</b></div><div>판 레벨<b id="rL">0</b></div></div>
    <div class="hxp"><div style="display:flex;justify-content:space-between;font-size:14px"><b id="rHero">람다</b><span id="rGain">+0</span></div>
      <div class="bar"><i id="rBar"></i></div><div style="font-size:12px" id="rNext"></div>
      <div id="rUnl"></div></div>
    <div id="rAch"></div>
    <button class="btn" id="againBtn" style="margin-top:12px">한 판 더</button>
    <div class="row"><button class="btn sm" id="titleBtn">주민 바꾸기</button><button class="btn sm" id="resRank">순위</button></div>
  </div>
</div>

<script src="../assets/bgm.js" data-pos="left:74px;top:calc(env(safe-area-inset-top) + 8px)" data-show-if="#sTitle:not(.hidden)" data-vol="0.35" data-mute-key="somsom_patrol_muted"></script>
<script src="core.js"></script>
<script>
const C = PatrolCore;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){ const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();
const ZOOM = 0.85;   // 화면을 조금 멀리서 보기 (시야 넓게)
const COL = { ramda:'#D0563B', bookgeo:'#3E9C9A', kkito:'#EE8FAE', migae:'#4A5582', lachilchin:'#A98BD8', boneul:'#E9B840' };
const SKCOL = { acorn:'#8B5A2B', tail:'#D0563B', button:'#C9A15A', pocket:'#B9743E', storm:'#F2B33D', spray:'#B79AD8', wave:'#4FA3D9', euca:'#6FA866', shell:'#6F5B3F', tide:'#2E7FC2', shoes:'#888', lunch:'#E98A5B', lens:'#6FA8DC', clock:'#C8A85A', ear:'#EE8FAE', brush:'#6FA8DC', pearl:'#F4EFE6', scare:'#EE8FAE', rainbow:'#E0663F', ants:'#2B2B2B', zap:'#F2A7BF', burrow:'#9A6B43', ribbon:'#F2A7BF', march:'#4A5582', yarn:'#A98BD8', tongs:'#F2C230', tea:'#C9A15A', net:'#B79AD8', scarf:'#D0563B', roll:'#A9A79C', flop:'#97782A', snack:'#E98A5B', yawn:'#B79AD8', bigroll:'#E9B840' };

// ── 그림 ──
const img = s => { const i = new Image(); i.src = s; return i; };
const ok = i => i && i.complete && i.naturalWidth > 0;
const IMG = {};

const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
let SAVE = store.get('somsom_patrol', { xp:{}, pick:'ramda', runs:0 }); SAVE.xp = SAVE.xp || {}; SAVE.best = SAVE.best || 0; SAVE.used = SAVE.used || {};
const DEV = /[?&]dev=1/.test(location.search);   // 개발용 버튼은 ?dev=1 일 때만
const save = () => store.set('somsom_patrol', SAVE);

// ── 소리 ──
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === 'suspended') AC.resume(); }
function blip(f, d, type, v, f2){ if(!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f2 || f*0.6, t + d);
  g.gain.setValueAtTime(v || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); }
let sfxBudget = 0;
const sfx = (...a) => { if(sfxBudget-- > 0) blip(...a); };
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

// ── 타이틀 ──
function heroInfo(k){ const xp = SAVE.xp[k] || 0, lv = C.heroLevel(xp), X = C.HERO_XP; const cur = X[lv] || 0, nxt = X[lv + 1]; return { xp, lv, p: nxt ? (xp - cur)/(nxt - cur) : 1, nxt }; }
function renderTitle(){
  $('heroes').innerHTML = Object.keys(C.HEROES).map(k => { const H = C.HEROES[k], hi = heroInfo(k);
    return `<div class="hero ${SAVE.pick === k ? 'sel' : ''}" data-k="${k}"><img src="../assets/basket/ch_${k}.webp" alt="">
      <div style="flex:1"><div class="nm">${H.n}<span class="lv">주민 Lv ${hi.lv}${hi.nxt == null ? ' · 최고' : ''}</span></div>
      <div class="bar"><i style="width:${Math.round(hi.p*100)}%"></i></div>
      ${SAVE.pick === k ? `<ul>${H.unlock.map(u => `<li class="${hi.lv >= u.lv ? '' : 'off'}">${hi.lv >= u.lv ? '✓' : '잠김'} <b>Lv${u.lv}</b> ${u.txt}</li>`).join('')}</ul>` : `<div style="font-size:12px;opacity:.7">${C.SKILLS[H.start].n} 외</div>`}</div></div>`; }).join('');
  $('dbgRow').classList.toggle('hidden', !DEV); $('dbgUp').classList.toggle('hidden', heroInfo(SAVE.pick).nxt == null);
  $('best').innerHTML = SAVE.best ? '내 최고 점수 <b>' + SAVE.best.toLocaleString() + '</b>' : '';
  document.querySelectorAll('.hero').forEach(el => el.onclick = () => { SAVE.pick = el.dataset.k; save(); renderTitle(); });
}
renderTitle();
$('dbgUp').onclick = () => { const k = SAVE.pick, hi = heroInfo(k); if(hi.nxt != null) SAVE.xp[k] = hi.nxt; save(); renderTitle(); blip(660, 0.15, 'triangle', 0.06); };
$('dbgReset').onclick = () => { SAVE.xp = {}; save(); renderTitle(); };

// ── 조작 ──
const joy = { on:false, x0:0, y0:0, x:0, y:0 }, keys = {};
cv.addEventListener('pointerdown', e => { audio(); joy.on = true; joy.x0 = joy.x = e.clientX; joy.y0 = joy.y = e.clientY; });
cv.addEventListener('pointermove', e => { if(!joy.on) return; joy.x = e.clientX; joy.y = e.clientY; const dx = joy.x - joy.x0, dy = joy.y - joy.y0, m = Math.hypot(dx, dy); if(m > 60){ joy.x0 = joy.x - dx/m*60; joy.y0 = joy.y - dy/m*60; } });
const up = () => joy.on = false; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { keys[e.key] = 1; audio(); }); addEventListener('keyup', e => keys[e.key] = 0);
function input(){
  let ax = 0, ay = 0;
  if(joy.on){ const dx = joy.x - joy.x0, dy = joy.y - joy.y0, m = Math.hypot(dx, dy); if(m > 6){ const s = Math.min(1, m/34); ax = dx/m*s; ay = dy/m*s; } }
  const kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0), ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  if(kx || ky){ ax = kx; ay = ky; }
  return [ax, ay];
}

  }
}
