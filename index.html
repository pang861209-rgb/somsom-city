<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>솜솜시티 — 미니게임 마을</title>
<meta name="description" content="솜솜시티 친구들과 즐기는 미니게임 3종: 낙엽피하기 · 달리기 · 짝맞추기">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#4a3b2c;
    display:flex;justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#faf4e8 0%,#f1e7d3 60%,#ecdfc6 100%);
  }
  #app{width:min(470px,100vw);height:100dvh;display:flex;flex-direction:column;
    padding:18px 15px 16px;gap:14px;overflow:hidden;}

  /* ── header ── */
  header{flex:0 0 auto;text-align:center;padding-top:2px;}
  .logo{font-size:29px;font-weight:900;letter-spacing:-.5px;color:#3f3122;
    display:inline-flex;align-items:center;gap:7px;}
  .logo .lf{font-size:23px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));}
  .tag{margin-top:4px;font-size:12.5px;font-weight:600;color:#a8977f;letter-spacing:.2px;word-break:keep-all;}

  /* ── picker ── */
  .picker{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px;}

  .card{
    position:relative;flex:1 1 0;min-height:0;display:block;border-radius:24px;overflow:hidden;
    text-decoration:none;isolation:isolate;
    box-shadow:0 14px 28px -12px rgba(74,52,26,.5), 0 3px 8px -2px rgba(74,52,26,.22),
               inset 0 0 0 1px rgba(255,255,255,.14);
    transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s;
    transform:translateZ(0);
  }
  .card:active{transform:scale(.975);
    box-shadow:0 8px 16px -10px rgba(74,52,26,.5),0 2px 5px -2px rgba(74,52,26,.2),inset 0 0 0 1px rgba(255,255,255,.14);}

  .art{position:absolute;inset:0;z-index:0;}
  .art .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .art .ch{position:absolute;bottom:0;object-fit:contain;filter:drop-shadow(-3px 6px 7px rgba(40,25,10,.32));}
  .art .deco{position:absolute;object-fit:contain;opacity:.9;filter:drop-shadow(0 2px 3px rgba(40,25,10,.2));}

  /* per-card art placement */
  .leaf .bg{object-position:center 30%;}
  .leaf .ch{right:9%;width:31%;max-width:120px;}
  .leaf .d1{top:14%;right:34%;width:13%;transform:rotate(-14deg);}
  .leaf .d2{top:30%;right:15%;width:11%;transform:rotate(16deg);}
  .run  .bg{object-position:center 62%;}
  .run  .ch{right:4%;width:44%;max-width:180px;}
  .match .bg{object-position:center 78%;}
  .match .ch{right:6%;width:30%;max-width:120px;}

  /* legibility scrim — heavier on the text (left) side */
  .scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(100deg,
      rgba(38,26,14,.82) 0%, rgba(38,26,14,.62) 30%, rgba(38,26,14,.28) 52%, rgba(38,26,14,0) 74%);}

  .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    justify-content:center;gap:7px;padding:16px 18px;max-width:66%;color:#fff7ea;}
  .tagno{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:800;letter-spacing:1.5px;padding:3px 9px;border-radius:999px;
    color:#fff;background:var(--acc);box-shadow:0 2px 6px -1px rgba(0,0,0,.35);}
  .nm{font-size:25px;font-weight:900;line-height:1.05;letter-spacing:-.3px;
    text-shadow:0 2px 8px rgba(20,12,4,.55);}
  .nm .em{font-size:21px;}
  .ds{font-size:12.5px;font-weight:500;line-height:1.4;color:#f4e9d6;
    word-break:keep-all;text-shadow:0 1px 4px rgba(20,12,4,.5);opacity:.95;}
  .play{margin-top:3px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:800;color:#3f3122;background:rgba(255,251,244,.94);
    padding:7px 15px 7px 16px;border-radius:999px;box-shadow:0 3px 9px -2px rgba(0,0,0,.4);}
  .play .arw{font-weight:900;color:var(--acc);}

  @media (max-height:650px){
    #app{gap:10px;padding-top:12px;}
    .logo{font-size:24px;} .tag{display:none;}
    .nm{font-size:21px;} .ds{display:none;} .content{gap:6px;}
  }

  /* 업적 (Phase 2) */
  .footRow{flex:none;display:flex;gap:9px;}
  .footBtn{flex:1;background:rgba(253,251,245,.92);border:2.5px solid #2B2620;border-radius:16px;
    padding:9px;text-align:center;font-size:13px;font-weight:800;color:#2B2620;cursor:pointer;
    box-shadow:0 3px 0 -1px #E4D9C0;font-family:inherit;}
  .footBtn:active{transform:translateY(2px);box-shadow:none;}
  #achPanel{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;
    background:rgba(43,38,32,.46);}
  #achPanel.on{display:flex;}
  #achSheet{width:min(470px,100%);max-height:86vh;overflow-y:auto;background:#FDFBF5;
    border:2.5px solid #2B2620;border-bottom:none;border-radius:26px 26px 0 0;padding:20px 18px 26px;
    display:flex;flex-direction:column;gap:14px;box-shadow:0 -12px 30px -14px rgba(74,52,26,.55);}
  #achSheet .hd{display:flex;align-items:baseline;gap:9px;}
  #achSheet .hd .t{font-size:20px;font-weight:900;color:#2B2620;}
  #achSheet .hd .c{font-size:12.5px;font-weight:700;color:#B08A3A;margin-left:auto;}
  .achGrp{font-size:11px;font-weight:800;letter-spacing:.12em;color:#9A8B7A;margin-top:4px;}
  .achRow{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:14px;
    border:2px solid #E4D9C0;background:#fff;}
  .achRow.got{border-color:#2B2620;background:#F6EED8;}
  .achRow .ic{width:26px;text-align:center;font-size:17px;flex:none;filter:grayscale(1);opacity:.35;}
  .achRow.got .ic{filter:none;opacity:1;}
  .achRow .tx{flex:1;min-width:0;}
  .achRow .nm{font-size:13.5px;font-weight:800;color:#9A8B7A;}
  .achRow.got .nm{color:#2B2620;}
  .achRow .ds{font-size:11.5px;color:#9A8B7A;}

  .sheetWrap{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;background:rgba(43,38,32,.46);}
  .sheetWrap.on{display:flex;}
  .sheetWrap .sheet{width:min(470px,100%);max-height:86vh;overflow-y:auto;background:#FDFBF5;
    border:2.5px solid #2B2620;border-bottom:none;border-radius:26px 26px 0 0;padding:20px 18px 26px;
    display:flex;flex-direction:column;gap:14px;box-shadow:0 -12px 30px -14px rgba(74,52,26,.55);}
  .sheetWrap .hd{display:flex;align-items:baseline;gap:9px;}
  .sheetWrap .hd .t{font-size:20px;font-weight:900;color:#2B2620;}
  .sheetWrap .hd .c{font-size:12.5px;font-weight:700;color:#B08A3A;margin-left:auto;}
  .dexGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .dexCell{border:2px solid #E4D9C0;border-radius:16px;background:#fff;padding:9px 6px;
    display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;}
  .dexCell.got{border-color:#2B2620;background:#F6EED8;}
  .dexCell img{width:100%;height:58px;object-fit:contain;filter:grayscale(1);opacity:.22;}
  .dexCell.got img{filter:none;opacity:1;}
  .dexCell .n{font-size:11.5px;font-weight:800;color:#9A8B7A;}
  .dexCell.got .n{color:#2B2620;}
  .cutRow{display:flex;align-items:center;gap:10px;padding:8px 11px;border:2px solid #E4D9C0;border-radius:14px;background:#fff;}
  .cutRow .nm{flex:1;font-size:13px;font-weight:800;color:#5A4A3A;}
  .cutRow .pg{font-size:12px;font-weight:700;color:#B08A3A;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo"><span class="lf">🍂</span> 솜솜시티</div>
    <div class="tag">오늘은 어떤 놀이? 골라서 바로 시작!</div>
  </header>

  <div class="picker">

    <a class="card leaf" href="leaf/" style="--acc:#e0a12b;">
      <div class="art">
        <img class="bg" src="assets/title_bg_leaf.png" alt="">
        <img class="ch" src="assets/sd_kkito_t.png" alt="">
      </div>
      <div class="scrim"></div>
      <div class="content">
        <span class="tagno">GAME 01</span>
        <span class="nm"><span class="em">🍂</span> 낙엽피하기</span>
        <span class="ds">은행나무 골목, 떨어지는 은행을 요리조리 피해 버텨라!</span>
        <span class="play">플레이 <span class="arw">▶</span></span>
      </div>
    </a>

    <a class="card run" href="run/" style="--acc:#dd7a34;">
      <div class="art">
        <img class="bg" src="assets/bg_runner.png" alt="">
        <img class="ch" src="assets/run_kkito_t.png" alt="">
      </div>
      <div class="scrim"></div>
      <div class="content">
        <span class="tagno">GAME 02</span>
        <span class="nm"><span class="em">🏃</span> 달리기</span>
        <span class="ds">끼토의 마감 질주! 장애물을 뛰어넘어 멀리 달려보자.</span>
        <span class="play">플레이 <span class="arw">▶</span></span>
      </div>
    </a>

    <a class="card match" href="match/" style="--acc:#6f9152;">
      <div class="art">
        <img class="bg" src="assets/title_bg_match.png" alt="">
        <img class="ch" src="assets/sd_boneul_t.png" alt="">
      </div>
      <div class="scrim"></div>
      <div class="content">
        <span class="tagno">GAME 03</span>
        <span class="nm"><span class="em">🃏</span> 짝맞추기</span>
        <span class="ds">뒤집힌 카드 속 솜솜 친구들의 짝꿍을 찾아라!</span>
        <span class="play">플레이 <span class="arw">▶</span></span>
      </div>
    </a>

  </div>

  <div class="footRow">
    <button class="footBtn" id="achOpen">🏅 업적</button>
    <button class="footBtn" id="dexOpen">📖 도감</button>
  </div>


  <div id="dexPanel" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">도감</span><span class="c" id="dexCount"></span></div>
      <div id="dexList"></div>
      <button class="footBtn" id="dexClose">닫기</button>
    </div>
  </div>
  <div id="achPanel">
    <div id="achSheet">
      <div class="hd"><span class="t">업적</span><span class="c" id="achCount"></span></div>
      <div id="achList"></div>
      <button class="footBtn" id="achClose">닫기</button>
    </div>
  </div>

</div>

<script>
// ── 업적 보기 (게임들이 localStorage에 남긴 기록을 모아서 표시) ──
const ACH = [
  {id:'leaf_first', g:'낙엽피하기', n:'가을 첫걸음',   d:'낙엽피하기에서 점수를 남겼어요'},
  {id:'leaf_1000',  g:'낙엽피하기', n:'골목 단골',     d:'낙엽피하기 1,000점'},
  {id:'leaf_5000',  g:'낙엽피하기', n:'은행 도사',     d:'낙엽피하기 5,000점'},
  {id:'leaf_combo10',g:'낙엽피하기',n:'줍기의 달인',   d:'한 판에 10콤보'},
  {id:'leaf_gold5', g:'낙엽피하기', n:'황금잎 수집가', d:'한 판에 황금잎 5장'},
  {id:'run_500',    g:'달리기',    n:'첫 질주',       d:'달리기 500m'},
  {id:'run_2000',   g:'달리기',    n:'출근길 정복',   d:'달리기 2,000m'},
  {id:'run_5000',   g:'달리기',    n:'마감 초월',     d:'달리기 5,000m'},
  {id:'run_near10', g:'달리기',    n:'아슬아슬',      d:'한 판에 아슬아슬 회피 10회'},
  {id:'run_tight3', g:'달리기',    n:'종이 한 장 차', d:'한 판에 완벽 회피 3회'},
  {id:'run_combo5', g:'달리기',    n:'도토리 행진',   d:'달리기에서 5콤보'},
  {id:'match_first',g:'짝맞추기',  n:'짝꿍 상봉',     d:'짝맞추기를 처음 끝냈어요'},
  {id:'match_perfect',g:'짝맞추기',n:'한 번도 안 틀림',d:'실수 없이 클리어'},
  {id:'match_hard', g:'짝맞추기',  n:'열두 쌍의 기억',d:'어려움을 클리어'},
  {id:'match_fast', g:'짝맞추기',  n:'번개 기억력',   d:'60초 안에 클리어'},
  {id:'all_three',  g:'솜솜시티',  n:'마을 한 바퀴',  d:'세 게임을 모두 해봤어요'},
  {id:'all_chars',  g:'솜솜시티',  n:'여섯 친구',     d:'여섯 주민 모두와 놀았어요'},
  {id:'coins_500',  g:'솜솜시티',  n:'도토리 창고',   d:'도토리를 500개 모았어요'},
];
function achLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_ach')||'{}'); }catch(e){ return {}; } }
function renderAch(){
  const got = achLoad(), list = document.getElementById('achList');
  document.getElementById('achCount').textContent = Object.keys(got).length + ' / ' + ACH.length;
  list.innerHTML = '';
  let cur = '';
  for(const a of ACH){
    if(a.g !== cur){ cur = a.g;
      const h = document.createElement('div'); h.className='achGrp'; h.textContent=cur; list.appendChild(h); }
    const r = document.createElement('div');
    r.className = 'achRow' + (got[a.id] ? ' got' : '');
    r.innerHTML = '<span class="ic">🏅</span><span class="tx"><span class="nm">'+a.n+'</span><br><span class="ds">'+a.d+'</span></span>';
    list.appendChild(r);
  }
}
document.getElementById('achOpen').addEventListener('click', ()=>{ renderAch(); document.getElementById('achPanel').classList.add('on'); });
document.getElementById('achClose').addEventListener('click', ()=> document.getElementById('achPanel').classList.remove('on'));
document.getElementById('achPanel').addEventListener('click', e=>{ if(e.target.id==='achPanel') e.currentTarget.classList.remove('on'); });
</script>


<script>
const DEX_ITEMS = [
  {g:'낙엽피하기 소품', items:[
    {id:'leaf_pinecone', f:'assets/dex_leaf_pinecone.png', n:'솔방울'},
    {id:'leaf_maple',    f:'assets/dex_leaf_maple.png',    n:'단풍잎'},
    {id:'leaf_chestnut', f:'assets/dex_leaf_chestnut.png', n:'알밤'},
  ]},
  {g:'달리기 랜드마크', items:[
    {id:'run_postbox', f:'assets/dex_run_postbox.png', n:'골목 우체통'},
    {id:'run_busstop', f:'assets/dex_run_busstop.png', n:'버스 정류장'},
    {id:'run_bench',   f:'assets/dex_run_bench.png',   n:'공원 벤치'},
    {id:'run_lamp',    f:'assets/dex_run_lamp.png',    n:'가로등'},
    {id:'run_bakery',  f:'assets/dex_run_bakery.png',  n:'골목 빵집'},
  ]},
];
const CUT_POOL = {kkito:12, boneul:8, migae:12, ramda:12, bookgeo:8, lachilchin:12};
const CUT_NAME = {kkito:'끼토', boneul:'보늘', migae:'미개', ramda:'람다', bookgeo:'북거씨', lachilchin:'라칠친 할머니'};
function dexLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_dex')||'{}'); }catch(e){ return {}; } }
function cutLoad(){ try{ return JSON.parse(localStorage.getItem('somsom3_dex')||'{}'); }catch(e){ return {}; } }
function renderDex(){
  const got=dexLoad(), cuts=cutLoad(), list=document.getElementById('dexList');
  let have=0, total=0;
  list.innerHTML='';
  for(const sec of DEX_ITEMS){
    const h=document.createElement('div'); h.className='achGrp'; h.textContent=sec.g; list.appendChild(h);
    const grid=document.createElement('div'); grid.className='dexGrid';
    for(const it of sec.items){
      total++; const ok=!!got[it.id]; if(ok) have++;
      const c=document.createElement('div'); c.className='dexCell'+(ok?' got':'');
      c.innerHTML='<img src="'+it.f+'" alt=""><span class="n">'+(ok?it.n:'？')+'</span>';
      grid.appendChild(c);
    }
    list.appendChild(grid);
  }
  const h2=document.createElement('div'); h2.className='achGrp'; h2.textContent='짝맞추기 일상 컷'; list.appendChild(h2);
  for(const k in CUT_POOL){
    const n=(cuts[k]||[]).length, p=CUT_POOL[k]; have+=n; total+=p;
    const r=document.createElement('div'); r.className='cutRow';
    r.innerHTML='<span class="nm">'+CUT_NAME[k]+'</span><span class="pg">'+n+' / '+p+'</span>';
    list.appendChild(r);
  }
  document.getElementById('dexCount').textContent = have+' / '+total;
}
document.getElementById('dexOpen').addEventListener('click', ()=>{ renderDex(); document.getElementById('dexPanel').classList.add('on'); });
document.getElementById('dexClose').addEventListener('click', ()=> document.getElementById('dexPanel').classList.remove('on'));
document.getElementById('dexPanel').addEventListener('click', e=>{ if(e.target.id==='dexPanel') e.currentTarget.classList.remove('on'); });
</script>

</body>
</html>
