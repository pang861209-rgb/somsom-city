<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>솜솜시티 — 미니게임 마을</title>
<meta name="description" content="솜솜시티 친구들과 즐기는 미니게임 4종: 낙엽피하기 · 달리기 · 짝맞추기 · 방범대">
<meta name="theme-color" content="#221E18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#221E18;color:#EFE7D6;font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    display:flex;justify-content:center;word-break:keep-all;-webkit-font-smoothing:antialiased;}
  #app{width:min(470px,100vw);height:100dvh;display:flex;flex-direction:column;
    padding:22px 16px 16px;gap:12px;overflow:hidden;}
  a{color:#F2C14B;text-decoration:none;}

  /* 머리 */
  header{flex:none;display:flex;align-items:center;gap:10px;}
  .logo{font-family:'Black Han Sans',sans-serif;font-size:26px;color:#F2C14B;letter-spacing:-.01em;line-height:1;}
  #profChip{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);
    border-radius:999px;padding:5px 13px 5px 5px;cursor:pointer;flex:none;}
  #profChip img{width:26px;height:26px;border-radius:50%;object-fit:contain;background:transparent;}
  #profChip .pn{font-size:12px;font-weight:700;color:#EFE7D6;max-width:76px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;display:block;}
  #profChip .pc{font-size:11px;font-weight:700;color:#F2C14B;display:block;}

  /* 오늘의 미션 */
  #missionBox{flex:none;background:rgba(255,255,255,.07);border-radius:16px;padding:10px 13px;
    display:flex;flex-direction:column;gap:7px;}
  #missionBox .mh{display:flex;align-items:center;gap:8px;}
  #missionBox .mh .lb{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:#F2C14B;}
  #missionBox .mh .pg{margin-left:auto;font-size:11.5px;font-weight:700;color:#EFE7D6;}
  .mRow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#CFC5B0;}
  .mRow .bx{width:14px;height:14px;border-radius:5px;border:1.5px solid rgba(255,255,255,.28);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#221E18;}
  .mRow.ok .bx{background:#F2C14B;border-color:#F2C14B;}
  .mRow.ok{color:#7E7768;text-decoration:line-through;}

  /* 게임 블록 — 4종: 2×2 그리드 */
  .picker{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:11px;}
  .blk{position:relative;min-height:0;border-radius:20px;display:flex;align-items:flex-start;
    padding:14px 14px;text-decoration:none;transition:transform .12s cubic-bezier(.2,.8,.3,1);overflow:visible;}
  .blk:active{transform:scale(.972);}
  .blk .mask{position:absolute;inset:0;border-radius:20px;overflow:hidden;z-index:1;}
  .blk .mask img{width:100%;height:100%;object-fit:cover;opacity:.20;mix-blend-mode:luminosity;}
  .blk .txt{position:relative;z-index:2;max-width:92%;}
  .blk .no{font-size:9px;font-weight:700;letter-spacing:.18em;opacity:.7;}
  .blk .nm{font-family:'Black Han Sans',sans-serif;font-size:22px;line-height:1.08;margin-top:2px;}
  .blk .ds{font-size:10.5px;opacity:.8;margin-top:3px;line-height:1.35;}
  .blk .ch{position:absolute;right:2px;bottom:-3px;z-index:3;object-fit:contain;
    filter:drop-shadow(-4px 6px 10px rgba(0,0,0,.5));pointer-events:none;}
  .picker .blk:nth-child(1){z-index:4;} .picker .blk:nth-child(2){z-index:3;}
  .picker .blk:nth-child(3){z-index:2;} .picker .blk:nth-child(4){z-index:1;}

  /* 아래 버튼 */
  .footRow{flex:none;display:flex;gap:8px;}
  .footBtn{flex:1;background:rgba(255,255,255,.08);border:none;border-radius:14px;padding:11px;
    text-align:center;font-size:12.5px;font-weight:700;color:#EFE7D6;cursor:pointer;font-family:inherit;}
  .footBtn:active{background:rgba(255,255,255,.14);}

  /* 시트 공통 */
  .sheetWrap{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;
    background:rgba(10,8,5,.62);}
  .sheetWrap.on{display:flex;}
  .sheetWrap .sheet{width:min(470px,100%);max-height:86vh;overflow-y:auto;background:#2B2620;
    border-radius:24px 24px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:13px;}
  .sheetWrap .hd{display:flex;align-items:baseline;gap:9px;}
  .sheetWrap .hd .t{font-family:'Black Han Sans',sans-serif;font-size:21px;color:#F2C14B;}
  .sheetWrap .hd .c{font-size:12px;font-weight:700;color:#A9A08C;margin-left:auto;}
  .achGrp{font-size:10px;font-weight:700;letter-spacing:.14em;color:#8A8271;margin-top:6px;}

  /* 칭호 */
  #titleBar{display:flex;align-items:center;gap:9px;background:rgba(242,193,75,.12);border-radius:13px;padding:9px 12px;}
  #titleBar .tn{font-size:13px;font-weight:800;color:#F2C14B;}
  #titleBar .tp{margin-left:auto;font-size:11px;font-weight:700;color:#A9A08C;}
  #titleBar .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;flex:1;max-width:110px;}
  #titleBar .bar i{display:block;height:100%;background:#F2C14B;}

  /* 업적 행 */
  .achRow{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:13px;background:rgba(255,255,255,.05);}
  .achRow.got{background:rgba(242,193,75,.14);}
  .achRow .ic{width:24px;text-align:center;font-size:16px;flex:none;filter:grayscale(1);opacity:.3;}
  .achRow.got .ic{filter:none;opacity:1;}
  .achRow .nm{font-size:13px;font-weight:800;color:#7E7768;}
  .achRow.got .nm{color:#EFE7D6;}
  .achRow .ds{font-size:11px;color:#7E7768;}

  /* 도감 */
  .dexGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .dexCell{border-radius:14px;background:rgba(255,255,255,.05);padding:9px 6px;
    display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;}
  .dexCell.got{background:rgba(242,193,75,.14);}
  .dexCell img{width:100%;height:54px;object-fit:contain;filter:grayscale(1) brightness(.6);opacity:.35;}
  .dexCell.got img{filter:none;opacity:1;}
  .dexCell .n{font-size:11px;font-weight:700;color:#7E7768;}
  .dexCell.got .n{color:#EFE7D6;}
  .cutRow{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.05);}
  .cutRow .nm{flex:1;font-size:12.5px;font-weight:700;color:#CFC5B0;}
  .cutRow .pg{font-size:12px;font-weight:800;color:#F2C14B;}

  /* 주간 */
  .wkRow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;background:rgba(255,255,255,.05);}
  .wkRow.me{background:rgba(242,193,75,.16);}
  .wkRow .rk{width:26px;font-weight:800;font-size:12px;color:#A9A08C;}
  .wkRow .nm{flex:1;font-size:13px;font-weight:800;color:#EFE7D6;}
  .wkRow .sc{font-size:13px;font-weight:800;color:#F2C14B;}
  .wkRow .br{display:flex;gap:3px;margin-left:6px;align-items:flex-end;}
  .wkRow .br i{width:6px;border-radius:2px;display:block;}

  @media (max-height:660px){ .blk .nm{font-size:18px;} .blk .ds{display:none;} #missionList{display:none;} .blk .ch{max-height:96px;} }
</style>
</head>
<body>

  <header>
    <div class="logo">솜솜시티</div>
    <div id="profChip"><img id="profAv" src="assets/sd_kkito_t.png" alt=""><span><span class="pn" id="profName">솜솜이</span><span class="pc" id="profCoin">🌰 0</span></span></div>

      <div class="mask"><img src="assets/bg_runner.png" alt=""></div>

    </a>
    <a class="blk" href="match/" style="background:#5F8348;color:#0F2007;">
      <div class="mask"><img src="assets/title_bg_match.png" alt=""></div>
      <div class="txt"><div class="no">GAME 03</div><div class="nm">짝맞추기</div><div class="ds">뒤집힌 카드 속 짝꿍</div></div>

    <a class="blk" href="https://pang861209-rgb.github.io/somsom-city-game/defense/" style="background:#6A5890;color:#150F26;">
      <div class="mask"><img src="assets/bg_alley.png" alt="" style="object-position:center 78%;"></div>
      <div class="txt"><div class="no">GAME 04 · NEW</div><div class="nm">방범대</div><div class="ds">꼬릿 구름에서 당근빌라를!</div></div>
      <img class="ch" src="assets/sd_migae_t.png" alt="" style="height:84%;max-height:124px;">
    </a>
  </nav>

  <div class="footRow">
    <button class="footBtn" id="achOpen">🏅 업적</button>
    <button class="footBtn" id="dexOpen">📖 도감</button>
    <button class="footBtn" id="wkOpen">🏆 주간</button>
  </div>

  <div id="wkPanel" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">이번 주 통합 랭킹</span><span class="c" id="wkNote"></span></div>
      <div id="wkList"></div>
      <button class="footBtn" id="wkClose">닫기</button>
    </div>
  </div>

  <div id="dexPanel" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">도감</span><span class="c" id="dexCount"></span></div>
      <div id="dexList"></div>
      <button class="footBtn" id="dexClose">닫기</button>
    </div>
  </div>

  <div id="achPanel" class="sheetWrap">
    <div class="sheet">
      <div class="hd"><span class="t">업적</span><span class="c" id="achCount"></span></div>
      <div id="titleBar"></div>
      <div id="achList"></div>
      <button class="footBtn" id="achClose">닫기</button>
    </div>
  </div>

</div>
<script>
// ── 업적 보기 (게임들이 localStorage에 남긴 기록을 모아서 표시) ──
const ACH = [
  {id:'leaf_first', g:'낙엽피하기', n:'가을 첫걸음',   d:'낙엽피하기에서 점수를 남겼어요'},
  {id:'leaf_1000',  g:'낙엽피하기', n:'골목 단골',     d:'낙엽피하기 1,000점'},
  {id:'leaf_5000',  g:'낙엽피하기', n:'은행 도사',     d:'낙엽피하기 5,000점'},
  {id:'leaf_combo10',g:'낙엽피하기',n:'줍기의 달인',   d:'한 판에 10콤보'},
  {id:'leaf_gold5', g:'낙엽피하기', n:'황금잎 수집가', d:'한 판에 황금잎 5장'},
  {id:'run_500',    g:'달리기',    n:'첫 질주',       d:'달리기 500m'},
  {id:'run_2000',   g:'달리기',    n:'출근길 정복',   d:'달리기 2,000m'},
  {id:'run_5000',   g:'달리기',    n:'마감 초월',     d:'달리기 5,000m'},
  {id:'run_near10', g:'달리기',    n:'아슬아슬',      d:'한 판에 아슬아슬 회피 10회'},
  {id:'run_tight3', g:'달리기',    n:'종이 한 장 차', d:'한 판에 완벽 회피 3회'},
  {id:'run_combo5', g:'달리기',    n:'도토리 행진',   d:'달리기에서 5콤보'},
  {id:'match_first',g:'짝맞추기',  n:'짝꿍 상봉',     d:'짝맞추기를 처음 끝냈어요'},
  {id:'match_perfect',g:'짝맞추기',n:'한 번도 안 틀림',d:'실수 없이 클리어'},
  {id:'match_hard', g:'짝맞추기',  n:'열두 쌍의 기억',d:'어려움을 클리어'},
  {id:'match_fast', g:'짝맞추기',  n:'번개 기억력',   d:'60초 안에 클리어'},
  {id:'defense_first',    g:'방범대', n:'방범대 입단',   d:'스테이지를 처음 지켜냈어요'},
  {id:'defense_boss',     g:'방범대', n:'왕꼬릿 퇴치',   d:'왕꼬릿 구름을 돌려보냈어요'},
  {id:'defense_allclear', g:'방범대', n:'골목 어귀 평정', d:'네 스테이지를 모두 클리어'},
  {id:'defense_endless10',g:'방범대', n:'끝없는 방범',   d:'무한 골목 10웨이브 돌파'},
  {id:'all_three',  g:'솜솜시티',  n:'마을 한 바퀴',  d:'세 게임을 모두 해봤어요'},
  {id:'all_four',   g:'솜솜시티',  n:'네 골목 제패',  d:'네 게임을 모두 해봤어요'},
  {id:'all_chars',  g:'솜솜시티',  n:'여섯 친구',     d:'여섯 주민 모두와 놀았어요'},
  {id:'coins_500',  g:'솜솜시티',  n:'도토리 창고',   d:'도토리를 500개 모았어요'},
];
function achLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_ach')||'{}'); }catch(e){ return {}; } }
function renderAch(){
  const got = achLoad(), list = document.getElementById('achList');
  document.getElementById('achCount').textContent = Object.keys(got).length + ' / ' + ACH.length;
  list.innerHTML = '';
  let cur = '';
  for(const a of ACH){
    if(a.g !== cur){ cur = a.g;
      const h = document.createElement('div'); h.className='achGrp'; h.textContent=cur; list.appendChild(h); }
    const r = document.createElement('div');
    r.className = 'achRow' + (got[a.id] ? ' got' : '');
    r.innerHTML = '<span class="ic">🏅</span><span class="tx"><span class="nm">'+a.n+'</span><br><span class="ds">'+a.d+'</span></span>';
    list.appendChild(r);
  }
}
document.getElementById('achOpen').addEventListener('click', ()=>{ renderAch(); document.getElementById('achPanel').classList.add('on'); });
document.getElementById('achClose').addEventListener('click', ()=> document.getElementById('achPanel').classList.remove('on'));
document.getElementById('achPanel').addEventListener('click', e=>{ if(e.target.id==='achPanel') e.currentTarget.classList.remove('on'); });
</script>
<script>
const DEX_ITEMS = [
  {g:'낙엽피하기 소품', items:[
    {id:'leaf_pinecone', f:'assets/dex_leaf_pinecone.png', n:'솔방울'},
    {id:'leaf_maple',    f:'assets/dex_leaf_maple.png',    n:'단풍잎'},
    {id:'leaf_chestnut', f:'assets/dex_leaf_chestnut.png', n:'알밤'},
  ]},
  {g:'달리기 랜드마크', items:[
    {id:'run_postbox', f:'assets/dex_run_postbox.png', n:'골목 우체통'},
    {id:'run_busstop', f:'assets/dex_run_busstop.png', n:'버스 정류장'},
    {id:'run_bench',   f:'assets/dex_run_bench.png',   n:'공원 벤치'},
    {id:'run_lamp',    f:'assets/dex_run_lamp.png',    n:'가로등'},
    {id:'run_bakery',  f:'assets/dex_run_bakery.png',  n:'골목 빵집'},
  ]},
];
const CUT_POOL = {kkito:12, boneul:8, migae:12, ramda:12, bookgeo:8, lachilchin:12};
const CUT_NAME = {kkito:'끼토', boneul:'보늘', migae:'미개', ramda:'람다', bookgeo:'북거씨', lachilchin:'라칠친 할머니'};
function dexLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_dex')||'{}'); }catch(e){ return {}; } }
function cutLoad(){ try{ return JSON.parse(localStorage.getItem('somsom3_dex')||'{}'); }catch(e){ return {}; } }
function renderDex(){
  const got=dexLoad(), cuts=cutLoad(), list=document.getElementById('dexList');
  let have=0, total=0;
  list.innerHTML='';
  for(const sec of DEX_ITEMS){
    const h=document.createElement('div'); h.className='achGrp'; h.textContent=sec.g; list.appendChild(h);
    const grid=document.createElement('div'); grid.className='dexGrid';
    for(const it of sec.items){
      total++; const ok=!!got[it.id]; if(ok) have++;
      const c=document.createElement('div'); c.className='dexCell'+(ok?' got':'');
      c.innerHTML='<img src="'+it.f+'" alt=""><span class="n">'+(ok?it.n:'？')+'</span>';
      grid.appendChild(c);
    }
    list.appendChild(grid);
  }
  const h2=document.createElement('div'); h2.className='achGrp'; h2.textContent='짝맞추기 일상 컷'; list.appendChild(h2);
  for(const k in CUT_POOL){
    const n=(cuts[k]||[]).length, p=CUT_POOL[k]; have+=n; total+=p;
    const r=document.createElement('div'); r.className='cutRow';
    r.innerHTML='<span class="nm">'+CUT_NAME[k]+'</span><span class="pg">'+n+' / '+p+'</span>';
    list.appendChild(r);
  }
  document.getElementById('dexCount').textContent = have+' / '+total;
}
document.getElementById('dexOpen').addEventListener('click', ()=>{ renderDex(); document.getElementById('dexPanel').classList.add('on'); });
document.getElementById('dexClose').addEventListener('click', ()=> document.getElementById('dexPanel').classList.remove('on'));
document.getElementById('dexPanel').addEventListener('click', e=>{ if(e.target.id==='dexPanel') e.currentTarget.classList.remove('on'); });
</script>
<script>
// ── 프로필 · 오늘의 미션 · 주간 통합 랭킹 (Phase 3) ──
const CH_NAME = {kkito:'끼토', boneul:'보늘', migae:'미개', ramda:'람다', bookgeo:'북거씨', lachilchin:'라칠친 할머니'};
const CH_AV   = {kkito:'assets/sd_kkito_t.png', boneul:'assets/sd_boneul_t.png', migae:'assets/sd_migae_t.png',
                 ramda:'assets/sd_ramda_t.png', bookgeo:'assets/sd_bookgeo_t.png', lachilchin:'assets/sd_lachilchin_t.png'};
const DAILY_ORDER = ['kkito','boneul','migae','ramda','bookgeo','lachilchin'];
function dayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
const DAILY_CHAR_ID = DAILY_ORDER[(Math.imul(dayKey(),2654435761)>>>0)%DAILY_ORDER.length];
function statsLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_stats')||'{}'); }catch(e){ return {}; } }
function missionLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_missions')||'{}'); }catch(e){ return {}; } }
function missionSpec(){
  const r=(Math.imul(dayKey(),2246822519)>>>0);
  // ⚠ r은 부호 없는 32비트인데 `>>`는 부호 있는 시프트라, r이 2^31을 넘는 날엔 음수가 된다.
  //   JS의 %는 부호를 유지하므로 [0,1,2][-2] → undefined. 반드시 >>> 를 쓸 것.
  // ⚠ goal과 label은 반드시 같은 값에서 나와야 한다. 예전엔 각자 따로 계산해
  //   한쪽만 부호 있는 시프트를 써서 서로 어긋날 수 있었다.
  const leafGoal = [300,600,1000][r%3];
  const runGoal  = [500,1000,1500][(r>>>3)%3];
  const missGoal = [0,1,2][(r>>>6)%3];
  const defGoal  = [1,2,3][(r>>>9)%3]; // 방범대 별점 목표 — defense 쪽 hubReport와 동일 수식
  return {leaf: {goal:leafGoal, label:'낙엽피하기 '+leafGoal+'점 넘기'},
          run:  {goal:runGoal,  label:'달리기 '+runGoal+'m 달리기'},
          match:{goal:missGoal, label:'짝맞추기 '+(missGoal===0 ? '실수 없이 클리어'
                                                              : '실수 '+missGoal+'회 이하로 클리어')},
          defense:{goal:defGoal, label:'방범대 '+defGoal+'★로 스테이지 클리어'}};
}
function titleFor(coins){
  if(coins>=2000) return '은행나무 지킴이';
  if(coins>=1000) return '도토리 창고지기';
  if(coins>=300)  return '골목 단골';
  if(coins>=50)   return '마을 새내기';
  return '첫 방문';
}
function renderProfile(){
  const st=statsLoad(), nm=localStorage.getItem('somsom_name')||'솜솜이';
  const chars=st.chars||{};
  let top=st.last||'kkito', best=-1;
  for(const k in chars){ if(chars[k]>best){ best=chars[k]; top=k; } }
  document.getElementById('profName').textContent=nm;
  document.getElementById('profCoin').textContent='🌰 '+(st.coins||0);
  const av=document.getElementById('profAv'); av.src=CH_AV[top]||CH_AV.kkito; av.alt=CH_NAME[top]||'';
  document.getElementById('profChip').title=nm+' · '+titleFor(st.coins||0)+' · 대표 '+(CH_NAME[top]||'');
}
function renderMissions(){
  const sp=missionSpec(), done=(missionLoad()[String(dayKey())])||{};
  document.getElementById('missionChar').innerHTML='<span style="font-size:11.5px;font-weight:700;color:#8A6A1A;">오늘의 친구 '+CH_NAME[DAILY_CHAR_ID]+'</span>';
  const list=document.getElementById('missionList'); list.innerHTML='';
  let n=0;
  for(const g of ['leaf','run','match','defense']){
    const ok=!!done[g]; if(ok) n++;
    const r=document.createElement('div'); r.className='mRow'+(ok?' ok':'');
    r.innerHTML='<span class="bx">'+(ok?'✓':'')+'</span><span>'+sp[g].label+'</span>';
    list.appendChild(r);
  }
  document.getElementById('missionPg').textContent=n+'/4';
}
// 주간 통합 랭킹 — 세 게임 점수를 각 게임 주간 최고 대비 100점으로 환산해 합산
const FB_KEY='AIzaSyBfld7SRrVTxDG0nE_6Z3Mw5kSRTo5bIGY';
const FB_DOCS='https://firestore.googleapis.com/v1/projects/somsom-city/databases/(default)/documents';
async function fetchCol(col){
  try{
    const r=await fetch(FB_DOCS+':runQuery?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({structuredQuery:{from:[{collectionId:col}],orderBy:[{field:{fieldPath:'s'},direction:'DESCENDING'}],limit:1000}})});   // 주간 합산도 같은 이유로 넉넉히
    const j=await r.json(); if(!Array.isArray(j)) return [];
    return j.filter(d=>d.document).map(d=>{const f=d.document.fields||{};
      return {n:(f.n&&f.n.stringValue)||'?', s:+((f.s&&f.s.integerValue)||0), t:+((f.t&&f.t.integerValue)||0)};});
  }catch(e){ return []; }
}
async function renderWeekly(){
  const list=document.getElementById('wkList');
  list.innerHTML='<div class="mRow" style="padding:14px;">불러오는 중…</div>';
  const since=Date.now()-7*24*3600*1000;
  const cols=await Promise.all([fetchCol('scores'),fetchCol('runner_scores'),fetchCol('memory_scores'),fetchCol('defense_scores')]);
  const per=cols.map(rows=>{
    const best={}; for(const e of rows){ if(e.t<since) continue; if(!best[e.n]||e.s>best[e.n]) best[e.n]=e.s; }
    const max=Math.max(1,...Object.values(best));
    return {best,max};
  });
  const tot={};
  per.forEach((p,gi)=>{ for(const n in p.best){ tot[n]=tot[n]||{n, parts:[0,0,0,0], sum:0};
    const v=Math.round(p.best[n]/p.max*100); tot[n].parts[gi]=v; tot[n].sum+=v; } });
  const rows=Object.values(tot).sort((a,b)=>b.sum-a.sum).slice(0,12);
  const me=localStorage.getItem('somsom_name')||'';
  document.getElementById('wkNote').textContent=rows.length?'최근 7일 · 400점 만점':'';
  if(!rows.length){ list.innerHTML='<div class="mRow" style="padding:14px;">이번 주 기록이 아직 없어요.</div>'; return; }
  list.innerHTML='';
  rows.forEach((r,i)=>{
    const d=document.createElement('div'); d.className='wkRow'+(r.n===me?' me':'');
    const bars=r.parts.map(v=>'<i style="height:'+Math.max(4,Math.round(v*0.14))+'px;background:'+(v?'#B08A3A':'#E4D9C0')+'"></i>').join('');
    d.innerHTML='<span class="rk">'+(i<3?['🥇','🥈','🥉'][i]:(i+1)+'위')+'</span><span class="nm">'+String(r.n).slice(0,10).replace(/[<>&]/g,'')+'</span><span class="br">'+bars+'</span><span class="sc">'+r.sum+'</span>';
    list.appendChild(d);
  });
}
renderProfile(); renderMissions();
document.getElementById('wkOpen').addEventListener('click', ()=>{ document.getElementById('wkPanel').classList.add('on'); renderWeekly(); });
document.getElementById('wkClose').addEventListener('click', ()=> document.getElementById('wkPanel').classList.remove('on'));
document.getElementById('wkPanel').addEventListener('click', e=>{ if(e.target.id==='wkPanel') e.currentTarget.classList.remove('on'); });
document.getElementById('profChip').addEventListener('click', ()=>{ document.getElementById('achOpen').click(); });
</script>
<script>
// 누적 도토리로 열리는 칭호 — 도토리를 마을 공용 재화로 쓰는 첫 장치
const TITLES = [
  {at:0,    n:'첫 방문'},
  {at:50,   n:'마을 새내기'},
  {at:300,  n:'골목 단골'},
  {at:1000, n:'도토리 창고지기'},
  {at:2000, n:'은행나무 지킴이'},
];
function renderTitleBar(){
  const el=document.getElementById('titleBar'); if(!el) return;
  const coins=(statsLoad().coins)||0;
  let cur=TITLES[0], next=null;
  for(const t of TITLES){ if(coins>=t.at) cur=t; else { next=t; break; } }
  const pct = next ? Math.min(100, Math.round((coins-cur.at)/(next.at-cur.at)*100)) : 100;
  el.innerHTML = '<span class="tn">'+cur.n+'</span>'
    + '<span class="bar"><i style="width:'+pct+'%"></i></span>'
    + '<span class="tp">'+(next ? '다음 '+next.n+'까지 🌰'+(next.at-coins) : '🌰'+coins+' · 최고 칭호')+'</span>';
}
document.getElementById('achOpen').addEventListener('click', renderTitleBar);
</script>
