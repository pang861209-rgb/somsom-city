<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>솜솜시티 — 미니게임 마을</title>
<meta name="description" content="솜솜시티 친구들과 즐기는 미니게임 3종: 낙엽피하기 · 달리기 · 짝맞추기">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:#f3ede2; font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; color:#5a4a3a;
    display:flex; justify-content:center; }
  #app { width:min(460px,100vw); height:100dvh; display:flex; flex-direction:column;
    padding:16px 14px 16px; gap:12px; overflow:hidden; }

  /* ── 컴팩트 헤더 (큰 그룹 그림 없음) ── */
  header { flex:0 0 auto; text-align:center; }
  .logo { font-size:30px; font-weight:900; letter-spacing:-1px; color:#5a4a3a; }
  .logo .lf { font-size:24px; }
  .tag { margin-top:3px; font-size:12.5px; font-weight:700; color:#9a8b7a; word-break:keep-all; }

  /* ── 게임 3종 선택 (스크롤 없이 화면 채움) ── */
  .picker { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:11px; }
  .gcard { position:relative; flex:1 1 0; min-height:0; display:flex; align-items:stretch;
    text-decoration:none; color:inherit; background:#fdfbf5; border:3px solid #222; border-radius:16px;
    overflow:hidden; box-shadow:3px 3px 0 #222; transition:transform .05s; }
  .gcard:active { transform:translate(3px,3px); box-shadow:none; }

  .thumb { position:relative; flex:0 0 40%; min-width:0; overflow:hidden; border-right:3px solid #222; }
  .thumb .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .thumb .ch { position:absolute; z-index:2; object-fit:contain; filter:drop-shadow(0 3px 4px rgba(90,74,58,.25)); }
  .thumb .lf { position:absolute; z-index:1; object-fit:contain; opacity:.95; }

  /* leaf thumb */
  .leaf .thumb .ch { left:50%; bottom:-4px; transform:translateX(-50%); width:46%; }
  .leaf .thumb .lf1 { top:10%; left:12%; width:22%; transform:rotate(-16deg); }
  .leaf .thumb .lf2 { top:20%; right:10%; width:18%; transform:rotate(18deg); }
  /* run thumb */
  .run .thumb .ch { left:6%; bottom:6%; width:64%; }
  /* match thumb */
  .match .thumb .bg { object-fit:cover; }
  .match .thumb .ch { right:2%; bottom:-2px; width:44%; }

  .info { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center;
    padding:10px 12px; gap:2px; }
  .no { font-size:11px; font-weight:800; color:#b08a3a; letter-spacing:1.5px; }
  .nm { font-size:23px; font-weight:900; color:#5a4a3a; line-height:1.1; }
  .ds { font-size:12.5px; color:#7a6a5a; line-height:1.35; word-break:keep-all; margin-top:2px; }
  .go { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:26px; font-weight:900; color:#d8c9a8; }

  @media (max-height:640px){ .logo{font-size:25px;} .nm{font-size:20px;} .ds{display:none;} }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo"><span class="lf">🍂</span> 솜솜시티</div>
    <div class="tag">오늘은 어떤 놀이? 골라서 바로 시작!</div>
  </header>

  <nav class="picker">

    <a class="gcard leaf" href="leaf/">
      <div class="thumb">
        <img class="bg" src="assets/bg_alley.png" alt="">
        <img class="lf lf1" src="assets/prop_ginkgo.png" alt="">
        <img class="lf lf2" src="assets/prop_acorn.png" alt="">
        <img class="ch" src="assets/sd_kkito_t.png" alt="">
      </div>
      <div class="info">
        <span class="no">GAME 01</span>
        <span class="nm">🍂 낙엽피하기</span>
        <span class="ds">은행나무 골목, 떨어지는 은행을 요리조리 피해 버텨라!</span>
      </div>
      <span class="go">›</span>
    </a>

    <a class="gcard run" href="run/">
      <div class="thumb">
        <img class="bg" src="assets/bg_runner.png" alt="">
        <img class="ch" src="assets/run_kkito_t.png" alt="">
      </div>
      <div class="info">
        <span class="no">GAME 02</span>
        <span class="nm">🏃 달리기</span>
        <span class="ds">끼토의 마감 질주! 장애물을 뛰어넘어 멀리 달려보자.</span>
      </div>
      <span class="go">›</span>
    </a>

    <a class="gcard match" href="match/">
      <div class="thumb">
        <img class="bg" src="assets/title_bg_match.png" alt="">
        <img class="ch" src="assets/sd_boneul_t.png" alt="">
      </div>
      <div class="info">
        <span class="no">GAME 03</span>
        <span class="nm">🃏 짝맞추기</span>
        <span class="ds">뒤집힌 카드 속 솜솜 친구들의 짝꿍을 찾아라!</span>
      </div>
      <span class="go">›</span>
    </a>

  </nav>

</div>
</body>
</html>
