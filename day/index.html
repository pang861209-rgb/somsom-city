<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>솜솜시티: 끼토의 하루</title>
<meta name="description" content="요일마다 다른 사건, 골목에서의 마주침, 며칠 뒤에 터지는 씨앗. 친구들과의 관계가 남는 끼토의 한 주.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#221E18;color:#EFE7D6;font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;display:flex;justify-content:center;word-break:keep-all;-webkit-font-smoothing:antialiased;}
  #app{width:min(470px,100vw);height:100dvh;position:relative;overflow:hidden;background:#221E18;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.on{display:flex;}
  button{font-family:inherit;cursor:pointer;}
  .top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;z-index:5;}
  .top .home{background:rgba(255,255,255,.10);border:none;color:#EFE7D6;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;}
  .top .slot{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.14em;color:#F2C14B;white-space:nowrap;}
  .top .worry{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#A9A08C;}
  .top .worry i{display:block;width:54px;height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
  .top .worry i b{display:block;height:100%;background:#E07A5F;transition:width .4s;}
  .stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#221E18;}
  .stage .bg{position:absolute;inset:0;}
  .stage .bg img{width:100%;height:100%;object-fit:contain;object-position:center center;background:#221E18;}
  .stage .cast{position:absolute;left:0;right:0;bottom:0;height:44%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px;pointer-events:none;}
  .stage .cast img{height:100%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));transition:transform .25s;}
  .stage .cast img.friend{height:100%;}
  .stage .cast img.migae{position:absolute;left:38%;bottom:0;height:24%;}
  .stage .cast img.bump{transform:translateY(-10px);}
  .stage .cast.hidden{display:none;}
  .stage .shade{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,rgba(34,30,24,.55),transparent);pointer-events:none;}
  .stage .badge{position:absolute;left:12px;top:10px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#221E18;background:#F2C14B;border-radius:8px;padding:3px 8px;}
  .dlg{flex:none;background:#FDFBF5;color:#3A2E24;margin:0 10px;border:2.5px solid #222;border-radius:16px;box-shadow:3px 3px 0 rgba(0,0,0,.6);padding:12px 14px 12px;position:relative;z-index:6;transform:translateY(-14px);min-height:96px;max-height:42vh;overflow-y:auto;}
  .dlg .nm{font-size:12px;font-weight:800;color:#B08A3A;margin-bottom:5px;letter-spacing:.02em;}
  .dlg .tx{font-size:14.5px;line-height:1.62;}
  .dlg .tx q{quotes:"“" "”";}
  .dlg .sub{margin-top:6px;font-size:12.5px;color:#7A6A5A;line-height:1.5;}
  .dlg .migaeLine{margin-top:8px;font-size:12px;color:#5A4A3A;display:flex;gap:6px;align-items:flex-start;}
  .dlg .migaeLine img{width:22px;height:22px;object-fit:contain;flex:none;}
  .choices{flex:none;display:flex;flex-direction:column;gap:7px;padding:0 10px calc(12px + env(safe-area-inset-bottom));z-index:6;}
  .choices button{background:#2B2620;color:#EFE7D6;border:1.5px solid rgba(255,255,255,.18);border-radius:13px;padding:11px 14px;text-align:left;font-size:13.5px;line-height:1.4;display:flex;gap:9px;align-items:center;}
  .choices button:active{background:#3A342B;}
  .choices button .tg{flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;color:#221E18;background:#F2C14B;border-radius:6px;padding:2px 6px;}
  .choices button .tg.bread{background:#E9B7C6;}
  .choices button.next{justify-content:center;background:#F2C14B;color:#221E18;border-color:#F2C14B;font-weight:800;}
  .react{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .react .rc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#7A6A5A;background:#F3ECDC;border-radius:10px;padding:5px 9px;min-width:64px;text-align:center;line-height:1.3;}
  .react .rc img{width:34px;height:34px;object-fit:contain;}
  .react .rc b{font-size:11px;}
  .react .rc.up{background:#E6F0D6;color:#4E6A2A;} .react .rc.down{background:#F6DEDA;color:#8A3A2E;}
  .seedTag{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:#5F8348;background:#E6F0D6;border-radius:8px;padding:2px 8px;}
  .worryTag{display:inline-block;margin-top:6px;margin-right:6px;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;background:#F6DEDA;color:#8A3A2E;}
  .worryTag.down{background:#E6F0D6;color:#4E6A2A;}
  .worryPop{position:absolute;left:10px;right:10px;top:10px;z-index:8;background:rgba(43,38,32,.96);border-radius:14px;padding:10px 12px;font-size:12px;color:#EFE7D6;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .worryPop .wh{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#F2C14B;margin-bottom:4px;}
  .worryPop .wr{display:flex;gap:8px;} .worryPop .wr b{flex:none;width:34px;text-align:right;} .worryPop .wr b.up{color:#E07A5F;} .worryPop .wr b.dn{color:#9BC26B;}
  .worryPop .wf{margin-top:6px;font-size:11px;color:#A9A08C;}
  .panel{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;}
  .title{font-family:'Black Han Sans',sans-serif;font-size:30px;color:#F2C14B;line-height:1.05;}
  .title small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:11px;letter-spacing:.2em;color:#A9A08C;margin-bottom:6px;}
  .lead{font-size:13px;color:#CFC5B0;line-height:1.6;}
  .hero{position:relative;flex:none;aspect-ratio:3/4;max-height:50vh;width:auto;align-self:center;border-radius:18px;overflow:hidden;background:#2B2620;}
  .hero img{width:100%;height:100%;object-fit:contain;display:block;}
  .big{background:#F2C14B;color:#221E18;border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;}
  .row{display:flex;gap:8px;}
  .ghost{flex:1;background:rgba(255,255,255,.08);border:none;border-radius:14px;padding:11px;font-size:12.5px;font-weight:700;color:#EFE7D6;text-align:center;text-decoration:none;}
  .cal{display:flex;gap:5px;justify-content:center;}
  .cal i{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;color:#A9A08C;}
  .cal i.done{background:rgba(242,193,75,.25);color:#F2C14B;} .cal i.today{background:#F2C14B;color:#221E18;font-weight:800;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .card{position:relative;border:none;border-radius:16px;padding:10px 10px 8px;text-align:left;color:#221E18;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
  .card img{position:absolute;right:4px;top:4px;height:70px;object-fit:contain;filter:drop-shadow(-2px 4px 6px rgba(0,0,0,.35));}
  .card .cn{font-family:'Black Han Sans',sans-serif;font-size:17px;line-height:1.05;}
  .card .cd{font-size:10.5px;opacity:.85;margin-top:3px;line-height:1.35;}
  .card .tier{position:absolute;left:10px;top:9px;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:rgba(0,0,0,.18);border-radius:6px;padding:2px 6px;}
  .card:active{transform:scale(.975);}
  .rel{display:flex;flex-direction:column;gap:8px;}
  .relRow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px;}
  .relRow img{width:38px;height:38px;object-fit:contain;}
  .relRow .rn{font-size:13px;font-weight:800;color:#EFE7D6;}
  .relRow .rt{font-size:11px;color:#A9A08C;margin-top:2px;line-height:1.4;}
  .relRow .dots{margin-left:auto;display:flex;gap:3px;flex:none;}
  .relRow .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);}
  .relRow .dots i.on{background:#F2C14B;}
  .letter{background:#FDFBF5;color:#3A2E24;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.55;border:2px solid #222;box-shadow:2px 2px 0 rgba(0,0,0,.5);}
  .letter b{color:#B08A3A;}
  .dexGrp{font-size:10px;font-weight:700;letter-spacing:.14em;color:#8A8271;margin-top:6px;}
  .dexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .dexCell{background:rgba(255,255,255,.07);border-radius:12px;padding:6px;text-align:center;font-size:10.5px;color:#CFC5B0;}
  .dexCell img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;filter:grayscale(1) brightness(.3);}
  .dexCell.got img{filter:none;}
  .dexCell .n{display:block;margin-top:4px;line-height:1.3;}
  .dexCell .h{display:block;margin-top:2px;font-size:9.5px;color:#8A8271;line-height:1.3;}
  .viewer{position:absolute;inset:0;z-index:50;background:rgba(10,8,5,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;}
  .viewer.on{display:flex;} .viewer img{max-width:100%;max-height:78vh;border-radius:14px;} .viewer .cap{font-size:13px;color:#EFE7D6;text-align:center;}
  .toast{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-140%);z-index:95;background:#2B2620;color:#EFE7D6;border-radius:14px;padding:9px 14px;display:flex;gap:9px;align-items:center;box-shadow:0 12px 30px -14px rgba(0,0,0,.85);transition:transform .35s,opacity .35s;opacity:0;visibility:hidden;}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;}
  .toast .at{font-size:11px;font-weight:800;color:#F2C14B;letter-spacing:.06em;} .toast .an{font-size:14px;font-weight:800;}
</style>
</head>
<body>
<div id="app">
  <section id="sTitle" class="screen on">
    <div class="top"><a class="home" href="../" style="text-decoration:none;">← 마을</a><span class="slot" id="titleDays"></span></div>
    <div class="panel">
      <div class="hero"><img id="titleImg" src="" alt=""></div>
      <div class="title"><small>GAME 05</small>끼토의 하루</div>
      <div class="cal" id="cal"></div>
      <p class="lead" id="titleLead">요일마다 다른 일이 생기고, 골목에서 누구를 만나느냐가 달라집니다.<br>오늘 고른 것은 며칠 뒤에 돌아옵니다. 미개는 언제나 옆에 있습니다.</p>
      <button class="big" id="btnStart">오늘 하루 시작</button>
      <div class="row"><button class="ghost" id="btnRel">친구들</button><button class="ghost" id="btnDex">그림 도감</button></div>
      <p class="lead" style="font-size:11px;color:#8A8271;" id="titleHint"></p>
    </div>
  </section>

  <section id="sScene" class="screen">
    <div class="top"><button class="home" id="sceneHome">← 마을</button><button class="worry" id="worryBtn" style="background:none;border:none;color:#A9A08C;">걱정 <i><b id="worryBar"></b></i><span id="worryNum" style="font-weight:800;color:#EFE7D6;"></span></button><span class="slot" id="slotLabel"></span></div>
    <div class="stage"><div class="bg"><img id="bgImg" src="" alt=""></div><div class="shade"></div><div class="cast" id="cast"></div><div class="badge" id="badge" hidden></div>
      <div id="worryPop" class="worryPop" hidden></div></div>
    <div class="dlg"><div class="nm" id="dNm"></div><div class="tx" id="dTx"></div><div id="dExtra"></div></div>
    <div class="choices" id="choices"></div>
  </section>

  <section id="sPick" class="screen">
    <div class="top"><button class="home" id="pickHome">← 마을</button><span class="worry">걱정 <i><b id="worryBar2"></b></i></span><span class="slot">낮</span></div>
    <div class="panel"><p class="lead" id="pickLead"></p><div class="grid2" id="pickGrid"></div></div>
  </section>

  <section id="sResult" class="screen">
    <div class="top"><span class="slot" style="margin-left:0;" id="resSlot">오늘의 하루</span></div>
    <div class="panel">
      <div class="hero" style="max-height:38vh;"><img id="resImg" src="" alt=""></div>
      <div class="title" style="font-size:24px;" id="resTitle"></div>
      <p class="lead" id="resText"></p>
      <div id="resLetters" class="rel"></div>
      <div class="rel" id="resRel"></div>
      <p class="lead" id="resCoin" style="color:#F2C14B;font-weight:700;"></p>
      <button class="big" id="btnAgain">다음 날로</button>
      <div class="row"><a class="ghost" href="../">마을로</a><button class="ghost" id="btnDex2">그림 도감</button></div>
    </div>
  </section>

  <section id="sRel" class="screen">
    <div class="top"><button class="home" data-back>← 뒤로</button><span class="slot">친구들</span></div>
    <div class="panel"><div class="rel" id="relList"></div><div id="seedList" class="lead"></div>
      <p class="lead" style="font-size:11.5px;color:#8A8271;">숫자는 보이지 않습니다. 친구의 표정과 며칠 뒤의 아침이 말해 줍니다.</p></div>
  </section>

  <section id="sDex" class="screen">
    <div class="top"><button class="home" data-back>← 뒤로</button><span class="slot" id="dexCount"></span></div>
    <div class="panel" id="dexPanel"></div>
  </section>

  <div class="viewer" id="viewer"><img id="viewerImg" src="" alt=""><div class="cap" id="viewerCap"></div><button class="ghost" id="viewerClose" style="flex:none;padding:10px 26px;">닫기</button></div>
  <div class="toast" id="toast"><span>🏅</span><span><span class="at" id="toastT">업적 달성</span><br><span class="an" id="toastN"></span></span></div>
</div>

<script>
// ====================== 기본 데이터 ======================
const A='../assets/', AD='../assets/day/';
const F={
  boneul:{n:'보늘',sd:'sp_boneul_0.jpg',ok:'sp_boneul_1.png',bad:'sp_boneul_2.png',col:'#5F8348',dark:'#0F2007'},
  ramda:{n:'람다',sd:'sp_ramda_0.jpg',ok:'sp_ramda_1.png',bad:'sp_ramda_2.png',col:'#D2612C',dark:'#2B1305'},
  bookgeo:{n:'북거씨',sd:'sp_bookgeo_0.jpg',ok:'sp_bookgeo_1.png',bad:'sp_bookgeo_2.png',col:'#5C8A8A',dark:'#0D2020'},
  lachil:{n:'라칠친 할머니',sd:'sp_lachilchin_0.jpg',ok:'sp_lachilchin_1.png',bad:'sp_lachilchin_2.png',col:'#9A6A9A',dark:'#241224'},
  migae:{n:'미개',sd:'sp_migae_0.jpg',ok:'sp_migae_1.png',bad:'sp_migae_2.png',col:'#6A5890',dark:'#150F26'},
  kkito:{n:'끼토',sd:'sp_kkito_0.jpg',ok:'sp_kkito_1.png',bad:'sp_kkito_2.png',col:'#E0A12B',dark:'#2B2005'},
};
const SP=(k,st)=> AD+F[k][st||'sd'];
// 꼬리표 → 그 장면의 친구에게만, 그리고 걱정에만 작용한다
const TAG={
  '신중':{boneul:0,ramda:1,lachil:1,worry:-2,migae:'미개가 옆에서 같이 기다린다.'},
  '대담':{boneul:0,ramda:0,lachil:-1,worry:3,migae:'미개가 신나서 앞장선다.'},
  '느긋':{boneul:1,ramda:-1,lachil:0,worry:-1,migae:'미개가 발치에 엎드린다.'},
  '부지런':{boneul:-1,ramda:1,lachil:1,worry:1,migae:'미개가 뽈뽈 따라 뛴다.'},
  '나눔':{boneul:1,ramda:-2,lachil:2,worry:1,migae:'미개가 부스러기를 기대한다.'},
  '알뜰':{boneul:0,ramda:2,lachil:1,worry:0,migae:'미개가 단추를 물어 온다.'},
};
const WD=['월','화','수','목','금','토','일'];
const SEASONS=[{k:'',n:'가을'},{k:'_ginkgo',n:'은행 카펫'},{k:'_dusk',n:'해질녘'},{k:'_rain',n:'장마'},{k:'_winter',n:'겨울'},{k:'_night',n:'밤'}];
const TIER={
  boneul:(v)=> v<=2?'서먹':v<=7?'친구':'단짝',
  ramda:(v)=> v<=5?'지인':v<=8?'통함':'단짝',
  lachil:(v)=> v<=2?'이웃':v<=5?'정든 이웃':'가족 같은',
  bookgeo:(v)=> v<3?'처음':v<6?'배우는 중':'차분해짐',
};
const STAGE_IDX={boneul:(v)=>v<=2?0:v<=7?1:2, ramda:(v)=>v<=5?0:v<=8?1:2, lachil:(v)=>v<=2?0:v<=5?1:2, bookgeo:(v)=>v<3?0:v<6?1:2};

// ====================== 컷 도감 ======================
// img: assets/day/ 아래 파일(접두 없음) 또는 A+ 경로. h: 아직 못 봤을 때 힌트
const CUTS={
  a1:{g:'아침',n:'가스 불 확인',img:'a1_deadline_0.jpg',h:'월요일 아침'}, a2:{g:'아침',n:'잎사귀 고르기',img:'a2_rainwindow_0.jpg',h:'화요일 아침'},
  a3:{g:'아침',n:'장날 골목',img:'a3_market_0.jpg',h:'수요일 아침'}, a4:{g:'아침',n:'냄새 민원',img:'a4_complaint_0.jpg',h:'목요일 아침'},
  a5:{g:'아침',n:'은행 줍기 초대',img:'a5_ginkgo_call_0.jpg',h:'금요일 아침'}, a6:{g:'아침',n:'전구 다는 날',img:'a6_festival_prep_0.jpg',h:'토요일 아침'},
  a7:{g:'아침',n:'늦잠',img:'a7_sleep_in_0.jpg',h:'일요일 아침'}, a8:{g:'아침',n:'미개가 아픈 날',img:'a8_sick_migae_0.jpg',h:'가끔 오는 아침'},
  d1:{g:'낮',n:'대나무 문 앞',img:'d1_boneul_cold_0.jpg',h:'서먹한 보늘'}, d2:{g:'낮',n:'토스트 접시',img:'d2_boneul_toast_0.jpg',h:'친구 보늘'}, d3:{g:'낮',n:'늘보의 식탁 게스트',img:'d3_boneul_camera_0.jpg',h:'단짝 보늘'},

}
function relRows(compact){
  const rows=[['boneul',S.rel.boneul,TIER.boneul(S.rel.boneul),'가장 오랜 친구. 속 이야기를 꺼낼수록 깊어집니다.'],['ramda',S.rel.ramda,(S.ramdaSulky?'서운함 · ':'')+TIER.ramda(S.rel.ramda),'생각이 잘 맞는 친구. 다른 생각을 말하면 서운해합니다.'],['bookgeo',Math.min(10,S.learn),TIER.bookgeo(S.learn),'조향사 이웃 어른. 찾아갈수록 끼토의 걱정이 줄어듭니다.'],['lachil',S.rel.lachil,TIER.lachil(S.rel.lachil),'5층 할머니. 나누는 만큼 정이 듭니다.'],['migae',10,'항상 100','끼토의 반려개미. 눈금이 없습니다.']];
  return rows.map(([k,v,t,d])=>{ const dots=Array.from({length:10},(_,i)=>'<i class="'+(i<v?'on':'')+'"></i>').join(''); return '<div class="relRow"><img src="'+SP(k)+'" alt="" onerror="this.onerror=null;this.src=\''+A+'sd_'+(k==='lachil'?'lachilchin':k)+'_t.png\'"><div><div class="rn">'+F[k].n+' <span style="color:#F2C14B;font-size:11px;">'+t+'</span></div>'+(compact?'':'<div class="rt">'+d+'</div>')+'</div><div class="dots">'+dots+'</div></div>'; }).join('');
}
function renderRel(){ $('relList').innerHTML=relRows(false); $('seedList').innerHTML=S.seeds.length?'심어 둔 씨앗: '+S.seeds.map(s=>SEEDS[s.id].n+(s.fuse>0?' ('+s.fuse+'일 뒤)':s.fuse===0?' (오늘)':' (비 오는 날)')).join(', '):'심어 둔 씨앗이 없습니다.'; show('sRel'); }
function renderDex(){
  const p=$('dexPanel'); p.innerHTML=''; let n=0,total=0; const groups={};
  for(const id in CUTS){ const c=CUTS[id]; (groups[c.g]=groups[c.g]||[]).push(id); total++; if(S.cuts[id]) n++; }
  for(const g in groups){ const h=document.createElement('div'); h.className='dexGrp'; h.textContent=g; p.appendChild(h); const grid=document.createElement('div'); grid.className='dexGrid';
    for(const id of groups[g]){ const c=CUTS[id]; const got=!!S.cuts[id]; const cell=document.createElement('div'); cell.className='dexCell'+(got?' got':''); cell.innerHTML='<img src="'+IMG(id)+'" alt="" onerror="this.onerror=null;this.src=\''+A+'bg_alley.png\'"><span class="n">'+(got?c.n:'？')+'</span>'+(got?'':'<span class="h">'+c.h+'</span>'); if(got) cell.onclick=()=>{ $('viewerImg').src=IMG(id); $('viewerCap').textContent=c.n; $('viewer').classList.add('on'); }; grid.appendChild(cell); }
    p.appendChild(grid); }
  $('dexCount').textContent='그림 '+n+' / '+total; show('sDex');
}
function renderTitle(){
  const wd=weekday(); $('titleDays').textContent=(S.dayNo===1?'첫날':S.dayNo+'일째')+' · '+SEASONS[S.week%6].n;
  $('cal').innerHTML=WD.map((w,i)=>'<i class="'+(i<wd?'done':i===wd?'today':'')+'">'+w+'</i>').join('');
  const n=Object.keys(S.cuts).length; $('titleHint').textContent='모은 그림 '+n+'/'+Object.keys(CUTS).length+' · 하루 시작 걱정 '+startWorry()+'/10'+(S.seeds.length?' · 씨앗 '+S.seeds.length+'개':'');
  const last=Object.keys(S.cuts).pop(); const img=$('titleImg'); img.onerror=()=>{ img.onerror=null; img.src=A+'ending_e5_leafpile.png'; }; img.src=last?IMG(last):A+'ending_e5_leafpile.png';
  show('sTitle');
}
$('btnStart').onclick=newDay; $('btnAgain').onclick=newDay;
$('btnRel').onclick=()=>{ backTo='sTitle'; renderRel(); };
$('btnDex').onclick=()=>{ backTo='sTitle'; renderDex(); }; $('btnDex2').onclick=()=>{ backTo='sResult'; renderDex(); };
$('sceneHome').onclick=()=>{ if(confirm('오늘 하루를 중단하고 마을로 갈까요? 관계와 씨앗은 저장됩니다.')) location.href='../'; }; $('pickHome').onclick=$('sceneHome').onclick;
document.querySelectorAll('[data-back]').forEach(b=> b.onclick=()=>{ if(backTo==='sTitle') renderTitle(); else show(backTo); });
$('worryBtn').onclick=()=>{ const p=$('worryPop'); if(!D) return; if(p.hidden){ worryPopRender(); p.hidden=false; } else p.hidden=true; };
$('worryPop').onclick=()=>{ $('worryPop').hidden=true; };
$('viewerClose').onclick=()=>$('viewer').classList.remove('on'); $('viewer').onclick=(e)=>{ if(e.target.id==='viewer') $('viewer').classList.remove('on'); };
renderTitle();
</script>
</body>
</html>
