<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>솜솜시티: 끼토의 하루</title>
<meta name="description" content="4주 뒤 솜재페의 밤, 누가 어떤 모습으로 올까. 원고 마감과 친구 사이에서 고르는 끼토의 한 시즌.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#221E18;color:#EFE7D6;font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;display:flex;justify-content:center;word-break:keep-all;-webkit-font-smoothing:antialiased;}
  #app{width:min(470px,100vw);height:100dvh;position:relative;overflow:hidden;background:#221E18;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.on{display:flex;}
  button{font-family:inherit;cursor:pointer;}
  .top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;z-index:5;}
  .top .home{background:rgba(255,255,255,.10);border:none;color:#EFE7D6;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;}
  .top .slot{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.14em;color:#F2C14B;white-space:nowrap;}
  .top .worry{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#A9A08C;}
  .top .worry i{display:block;width:54px;height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
  .top .worry i b{display:block;height:100%;background:#E07A5F;transition:width .4s;}
  .top .ms{font-size:10.5px;color:#A9A08C;white-space:nowrap;} .top .ms b{color:#EFE7D6;}
  .stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#221E18;}
  .stage .bg{position:absolute;inset:0;}
  .stage .bg img{width:100%;height:100%;object-fit:contain;object-position:center center;background:#221E18;}
  .stage .cast{position:absolute;left:0;right:0;bottom:0;height:44%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px;pointer-events:none;}
  .stage .cast img{height:100%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));transition:transform .25s;}
  .stage .cast img.friend{height:100%;}
  .stage .cast img.migae{position:absolute;left:38%;bottom:0;height:24%;}
  .stage .cast img.bump{transform:translateY(-10px);}
  .stage .cast.hidden{display:none;}
  .stage .cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);z-index:3;}
  .stage .cols.hidden{display:none;}
  .stage .col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 2px 0;border-right:1px solid rgba(255,255,255,.14);cursor:pointer;background:rgba(20,16,12,.18);transition:background .2s;}
  .stage .col:last-child{border-right:none;}
  .stage .col.off{opacity:.45;} .stage .col .spc{flex:none;width:100%;}
  .stage .col.sel{background:rgba(242,193,75,.22);box-shadow:inset 0 0 0 2px rgba(242,193,75,.8);}
  .stage .col img{height:50%;max-width:96%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));transition:transform .2s;}
  .stage .col.sel img{transform:translateY(-8px) scale(1.06);}
  .stage .col .hd{position:absolute;top:8px;left:2px;right:2px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .stage .col .ct{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:#221E18;background:rgba(242,193,75,.92);border-radius:6px;padding:2px 6px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;}
  .stage .col .cn{font-size:12px;word-break:keep-all;font-weight:800;color:#FDFBF5;text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;line-height:1.25;}
  .stage .col .cs{font-size:9.5px;color:#EFE7D6;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;line-height:1.2;}
  .stage .shade{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,rgba(34,30,24,.55),transparent);pointer-events:none;}
  .stage .badge{position:absolute;left:12px;top:10px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#221E18;background:#F2C14B;border-radius:8px;padding:3px 8px;}
  .dlg{flex:none;background:#FDFBF5;color:#3A2E24;margin:0 10px;border:2.5px solid #222;border-radius:16px;box-shadow:3px 3px 0 rgba(0,0,0,.6);padding:12px 14px 12px;position:relative;z-index:6;transform:translateY(-14px);min-height:96px;max-height:42vh;overflow-y:auto;}
  .dlg .nm{font-size:12px;font-weight:800;color:#B08A3A;margin-bottom:5px;letter-spacing:.02em;}
  .dlg .tx{font-size:14.5px;line-height:1.62;}
  .dlg .tx q{quotes:"“" "”";}
  .dlg .sub{margin-top:6px;font-size:12.5px;color:#7A6A5A;line-height:1.5;}
  .dlg .migaeLine{margin-top:8px;font-size:12px;color:#5A4A3A;display:flex;gap:6px;align-items:flex-start;}
  .dlg .migaeLine img{width:22px;height:22px;object-fit:contain;flex:none;}
  .choices{flex:none;display:flex;flex-direction:column;gap:7px;padding:0 10px calc(12px + env(safe-area-inset-bottom));z-index:6;}
  .choices button{background:#2B2620;color:#EFE7D6;border:1.5px solid rgba(255,255,255,.18);border-radius:13px;padding:11px 14px;text-align:left;font-size:13.5px;line-height:1.4;display:flex;gap:9px;align-items:center;}
  .choices button:active{background:#3A342B;}
  .choices button[disabled]{opacity:.45;}
  .choices button .tg{flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;color:#221E18;background:#F2C14B;border-radius:6px;padding:2px 6px;}
  .choices button .tg.bread{background:#E9B7C6;} .choices button .tg.cost{background:#CFC5B0;}
  .choices button.next{justify-content:center;background:#F2C14B;color:#221E18;border-color:#F2C14B;font-weight:800;}
  .react{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .react .rc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#7A6A5A;background:#F3ECDC;border-radius:10px;padding:5px 9px;min-width:64px;text-align:center;line-height:1.3;}
  .react .rc img{width:34px;height:34px;object-fit:contain;}
  .react .rc b{font-size:11px;}
  .react .rc.up{background:#E6F0D6;color:#4E6A2A;} .react .rc.down{background:#F6DEDA;color:#8A3A2E;}
  .seedTag{display:inline-block;margin-top:6px;margin-right:6px;font-size:11px;font-weight:800;color:#5F8348;background:#E6F0D6;border-radius:8px;padding:2px 8px;}
  .flagTag{display:inline-block;margin-top:6px;margin-right:6px;font-size:11px;font-weight:800;color:#6A5890;background:#E8E2F4;border-radius:8px;padding:2px 8px;}
  .msTag{display:inline-block;margin-top:6px;margin-right:6px;font-size:11px;font-weight:800;color:#8A6A1A;background:#F7EBC6;border-radius:8px;padding:2px 8px;}
  .worryTag{display:inline-block;margin-top:6px;margin-right:6px;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;background:#F6DEDA;color:#8A3A2E;}
  .worryTag.down{background:#E6F0D6;color:#4E6A2A;}
  .worryPop{position:absolute;left:10px;right:10px;top:10px;z-index:8;background:rgba(43,38,32,.96);border-radius:14px;padding:10px 12px;font-size:12px;color:#EFE7D6;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .worryPop .wh{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#F2C14B;margin-bottom:4px;}
  .worryPop .wr{display:flex;gap:8px;} .worryPop .wr b{flex:none;width:34px;text-align:right;} .worryPop .wr b.up{color:#E07A5F;} .worryPop .wr b.dn{color:#9BC26B;}
  .worryPop .wf{margin-top:6px;font-size:11px;color:#A9A08C;}
  .panel{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;}
  .title{font-family:'Black Han Sans',sans-serif;font-size:30px;color:#F2C14B;line-height:1.05;}
  .title small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:11px;letter-spacing:.2em;color:#A9A08C;margin-bottom:6px;}
  .lead{font-size:13px;color:#CFC5B0;line-height:1.6;}
  .hero{position:relative;flex:none;aspect-ratio:3/4;max-height:50vh;width:auto;align-self:center;border-radius:18px;overflow:hidden;background:#2B2620;}
  .hero img{width:100%;height:100%;object-fit:contain;display:block;}
  .fest{position:relative;flex:none;aspect-ratio:3/4;max-height:52vh;width:100%;align-self:center;border-radius:18px;overflow:hidden;background:#15120E;}
  .fest img.b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .fest img.l{position:absolute;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));}
  .fest img.l.far{opacity:.55;filter:grayscale(.4) drop-shadow(0 6px 10px rgba(0,0,0,.5));}
  .fest .win{position:absolute;right:7%;top:10%;width:9%;aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle at 50% 60%,#F7D77A,#C98A2A 70%,transparent 100%);box-shadow:0 0 24px 10px rgba(247,215,122,.45);opacity:0;}
  .fest .win.on{opacity:1;} .fest .win.dim{opacity:.18;box-shadow:none;background:#3A2E24;}
  .big{background:#F2C14B;color:#221E18;border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;}
  .row{display:flex;gap:8px;}
  .ghost{flex:1;background:rgba(255,255,255,.08);border:none;border-radius:14px;padding:11px;font-size:12.5px;font-weight:700;color:#EFE7D6;text-align:center;text-decoration:none;}
  .cal{display:flex;gap:5px;justify-content:center;}
  .cal i{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;color:#A9A08C;}
  .cal i.done{background:rgba(242,193,75,.25);color:#F2C14B;} .cal i.today{background:#F2C14B;color:#221E18;font-weight:800;}
  .weeks{display:flex;gap:6px;justify-content:center;font-size:10.5px;color:#8A8271;} .weeks span{padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.06);} .weeks span.now{background:rgba(242,193,75,.25);color:#F2C14B;font-weight:800;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .card{position:relative;border:none;border-radius:16px;padding:10px 10px 8px;text-align:left;color:#221E18;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
  .card img{position:absolute;right:4px;top:4px;height:70px;object-fit:contain;filter:drop-shadow(-2px 4px 6px rgba(0,0,0,.35));}
  .card .cn{font-family:'Black Han Sans',sans-serif;font-size:17px;line-height:1.05;}
  .card .cd{font-size:10.5px;opacity:.85;margin-top:3px;line-height:1.35;}
  .card .tier{position:absolute;left:10px;top:9px;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:rgba(0,0,0,.18);border-radius:6px;padding:2px 6px;}
  .card:active{transform:scale(.975);}
  .rel{display:flex;flex-direction:column;gap:8px;}
  .relRow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px;}
  .relRow img{width:38px;height:38px;object-fit:contain;}
  .relRow .rn{font-size:13px;font-weight:800;color:#EFE7D6;}
  .relRow .rt{font-size:11px;color:#A9A08C;margin-top:2px;line-height:1.4;}
  .relRow .dots{margin-left:auto;display:flex;gap:3px;flex:none;}
  .relRow .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);}
  .relRow .dots i.on{background:#F2C14B;}
  .letter{background:#FDFBF5;color:#3A2E24;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.55;border:2px solid #222;box-shadow:2px 2px 0 rgba(0,0,0,.5);}
  .letter b{color:#B08A3A;}
  .poem{background:#FDFBF5;color:#3A2E24;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.85;border:2.5px solid #222;box-shadow:3px 3px 0 rgba(0,0,0,.6);}
  .poem .ph{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#B08A3A;margin-bottom:6px;}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:#CFC5B0;}
  .stat div{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;line-height:1.45;} .stat b{color:#F2C14B;display:block;font-size:11px;letter-spacing:.06em;}
  .dexTabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;} .dexTabs::-webkit-scrollbar{display:none;}
  .dexTabs button{flex:none;background:rgba(255,255,255,.08);border:none;color:#CFC5B0;border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .dexTabs button.on{background:#F2C14B;color:#221E18;}
  .dexGrp{font-size:10px;font-weight:700;letter-spacing:.14em;color:#8A8271;margin-top:6px;}
  .dexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .dexCell{background:rgba(255,255,255,.07);border-radius:12px;padding:6px;text-align:center;font-size:10.5px;color:#CFC5B0;}
  .dexCell img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;filter:grayscale(1) brightness(.3);}
  .dexCell.got img{filter:none;}
  .dexCell .n{display:block;margin-top:4px;line-height:1.3;}
  .dexCell .h{display:block;margin-top:2px;font-size:9.5px;color:#8A8271;line-height:1.3;}
  .viewer{position:absolute;inset:0;z-index:50;background:rgba(10,8,5,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;}
  .viewer.on{display:flex;} .viewer img{max-width:100%;max-height:78vh;border-radius:14px;} .viewer .cap{font-size:13px;color:#EFE7D6;text-align:center;}
  .toast{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-140%);z-index:95;background:#2B2620;color:#EFE7D6;border-radius:14px;padding:9px 14px;display:flex;gap:9px;align-items:center;box-shadow:0 12px 30px -14px rgba(0,0,0,.85);transition:transform .35s,opacity .35s;opacity:0;visibility:hidden;}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;}
  .toast .at{font-size:11px;font-weight:800;color:#F2C14B;letter-spacing:.06em;} .toast .an{font-size:14px;font-weight:800;}
</style>
</head>
<body>
<div id="app">
  <section id="sTitle" class="screen on">
    <div class="top"><a class="home" href="../" style="text-decoration:none;">← 마을</a><span class="slot" id="titleDays"></span></div>
    <div class="panel">
      <div class="hero"><img id="titleImg" src="" alt=""></div>
      <div class="title"><small>GAME 05 · 시즌 「솜재페에 누가 오나」</small>끼토의 하루</div>
      <div class="weeks" id="yearRow"></div><div class="weeks" id="weeks"></div>
      <div class="cal" id="cal"></div>
      <p class="lead" id="titleLead">4주 뒤 일요일 밤은 솜재페. 누가 어떤 모습으로 올지는 그때까지의 끼토가 정합니다.<br>매주 월요일은 원고 마감. 친구에게 쓴 하루는 원고에 못 쓴 하루입니다.</p>
      <button class="big" id="btnStart">오늘 하루 시작</button>
      <div class="row"><button class="ghost" id="btnRel">친구들 · 약속</button><button class="ghost" id="btnInter">막간극</button><button class="ghost" id="btnDex">그림 도감</button></div>
      <p class="lead" style="font-size:11px;color:#8A8271;" id="titleHint"></p>
    </div>
  </section>

  <section id="sScene" class="screen">
    <div class="top"><button class="home" id="sceneHome">← 마을</button><button class="worry" id="worryBtn" style="background:none;border:none;color:#A9A08C;">걱정 <i><b id="worryBar"></b></i><span id="worryNum" style="font-weight:800;color:#EFE7D6;"></span></button><span class="ms" id="msLabel"></span><span class="slot" id="slotLabel"></span></div>
    <div class="stage"><div class="bg"><img id="bgImg" src="" alt=""></div><div class="shade"></div><div class="cast" id="cast"></div><div class="cols hidden" id="pickCols"></div><div class="badge" id="badge" hidden></div>
      <div id="worryPop" class="worryPop" hidden></div></div>
    <div class="dlg"><div class="nm" id="dNm"></div><div class="tx" id="dTx"></div><div id="dExtra"></div></div>
    <div class="choices" id="choices"></div>
  </section>

  <section id="sPick" class="screen">
    <div class="top"><button class="home" id="pickHome">← 마을</button><span class="worry">걱정 <i><b id="worryBar2"></b></i></span><span class="ms" id="msLabel2"></span><span class="slot" id="pickSlot">낮</span></div>
    <div class="panel"><p class="lead" id="pickLead"></p><div class="grid2" id="pickGrid"></div></div>
  </section>

  <section id="sResult" class="screen">
    <div class="top"><span class="slot" style="margin-left:0;" id="resSlot">오늘의 하루</span></div>
    <div class="panel">
      <div class="hero" style="max-height:38vh;"><img id="resImg" src="" alt=""></div>
      <div class="title" style="font-size:24px;" id="resTitle"></div>
      <p class="lead" id="resText"></p>
      <div id="resLetters" class="rel"></div>
      <div class="rel" id="resRel"></div>
      <p class="lead" id="resCoin" style="color:#F2C14B;font-weight:700;"></p>
      <button class="big" id="btnAgain">다음 날로</button>
      <div class="row"><a class="ghost" href="../">마을로</a><button class="ghost" id="btnDex2">그림 도감</button></div>
    </div>
  </section>

  <section id="sFest" class="screen">
    <div class="top"><span class="slot" id="festSlot" style="margin-left:0;">솜재페의 밤</span></div>
    <div class="panel">
      <div class="fest" id="festStage"></div>
      <div class="title" style="font-size:22px;" id="festTitle"></div>
      <p class="lead" id="festText"></p>
      <div class="poem" id="festPoem"></div>
      <div class="stat" id="festStat"></div>
      <div class="rel" id="festRel"></div>
      <button class="big" id="btnShare">낭독문 복사하기</button>
      <button class="big" id="btnNewSeason" style="background:#E07A5F;">새 시즌 시작</button>
      <div class="row"><a class="ghost" href="../">마을로</a><button class="ghost" id="btnDex3">그림 도감</button></div>
    </div>
  </section>

  <section id="sRel" class="screen">
    <div class="top"><button class="home" data-back>← 뒤로</button><span class="slot">친구들 · 약속</span></div>
    <div class="panel"><div class="rel" id="relList"></div><div id="seedList" class="lead"></div><div id="flagList" class="lead"></div>
      <p class="lead" style="font-size:11.5px;color:#8A8271;">숫자는 보이지 않습니다. 친구의 표정과 며칠 뒤의 아침이 말해 줍니다.</p></div>
  </section>

  <section id="sDex" class="screen">
    <div class="top"><button class="home" data-back>← 뒤로</button><span class="slot" id="dexCount"></span></div>
    <div class="dexTabs" id="dexTabs" style="padding-left:12px;padding-right:12px;"></div>
    <div class="panel" id="dexPanel"></div>
  </section>

  <div class="viewer" id="viewer"><img id="viewerImg" src="" alt=""><div class="cap" id="viewerCap"></div><button class="ghost" id="viewerClose" style="flex:none;padding:10px 26px;">닫기</button></div>
  <div class="toast" id="toast"><span>🏅</span><span><span class="at" id="toastT">업적 달성</span><br><span class="an" id="toastN"></span></span></div>
</div>

<script>
// ====================== 기본 데이터 ======================
const A='../assets/', AD='../assets/day/';
const F={
  boneul:{n:'보늘',sd:'sp_boneul_0.png',ok:'sp_boneul_1.png',bad:'sp_boneul_2.png',col:'#5F8348',dark:'#0F2007'},

  mon:{n:'원고 마감',cut:'a1',bg:'bg_day_entry.png',alt:['마감 날 아침의 끼토는 문을 세 번 연다. 오늘은 두 번째. <q>잠갔나?</q> 미개가 더듬이를 흔든다. 8시 41분.','세 번째 마감 날. 이제는 문 앞에서 멈추는 것도 습관이다. <q>...잠갔지.</q> 8시 41분. 미개가 먼저 계단을 본다.','네 번째 월요일. 가스 불은 잠겨 있다. 안다. 그래도 문 앞에서 한 번은 선다. 8시 41분.'],

  wed:{n:'장날',cut:'a3',bg:'bg_day_market.png',alt:['수요일은 장날. 골목에 줄무늬 천막이 섰다. 람다는 새벽부터 나와 있었을 것이다.','세 번째 장날. 나이테존 팻말 글씨가 바뀌어 있다. 람다 글씨다. 할머니 장바구니는 오늘도 무거워 보인다.','마지막 장날. 솜재페 부스 자리 표시가 골목 바닥에 분필로 그려져 있다.'],

ARC3.search=()=>{ const helpers=FRIENDS.filter(k=>(k==='bookgeo'?STAGE_IDX.bookgeo(S.learn):STAGE_IDX[k](S.rel[k]))>=1 && !(k==='boneul'&&S.flags.bon_cold) && !(k==='ramda'&&S.sulk>=2));

  if(helpers.length>=2) text+='<br><span class="sub">끼토는 이번 봄 발자국을 제일 많이 남긴 곳을 떠올렸다. '+(top?'<b>'+PLACE[top].n+'</b>.':'...집이었다. 미개가 갈 만한 곳이 떠오르지 않았다.')+'</span>';

ARC4.eve=()=>{ const can=memCount()>=2||S.rel.boneul>=7;

function u_arcMorning(){ const d=S.dayNo; if(d===1) return ARC4.meet(); if(d===6) return ARC4.page('fall',0); if(d===13) return ARC4.page('winter',1); if(d===18) return ARC4.permit(); if(d===19) return ARC4.grandma(); if(d===20) return ARC4.page('spring',2); if(d===27) return ARC4.eve(); return null; }
function u_arcNoon(k){ const d=S.dayNo; if(d===4&&k==='boneul'&&S.flags.movie!=='solo') return ARC4.meeting(); if(d===10&&k==='ramda') return ARC4.projector(); if(d===11&&k==='boneul') return ARC4.screen(); if(d===24&&k==='boneul') return ARC4.film(); if(d===25&&k==='ramda') return ARC4.mc(); return null; }
function u_arcForce(){ const d=S.dayNo; const r=[]; if(d===4&&S.flags.movie!=='solo') r.push('boneul'); if(d===10) r.push('ramda'); if(d===11) r.push('boneul'); if(d===24) r.push('boneul'); if(d===25) r.push('ramda'); return r; }
const U_TYPES=[
  {k:'bff',n:'절친이 된 끼토',d:'서먹함이 옥상에서 끝났다.',if:()=>isBff()},

  {k:'mc',n:'무대 뒤의 끼토',d:'인사는 남에게 맡겼다. 늘 그랬듯.',if:()=>S.flags.mc&&S.flags.mc!=='both'},
  {k:'side',n:'곁을 지키는 끼토',d:'원고보다 사람 쪽에 하루를 더 많이 썼다.',if:()=>true},
];
function u_held(){ const f=S.flags; return f.movie&&f.movie!=='solo'&&f.projector!=='broken'&&!!f.permit_roof; }
function u_outcomes(){ const f=S.flags; const o={}; const held=u_held();
  o.boneul=(f.bon_cold||S.rel.boneul<=2||f.movie==='solo')?'absent':isBff()?'bff':(held&&S.rel.boneul>=5)?'special':'guest';
  o.ramda=S.sulk>=2?'far':(held&&f.projector==='ok')?'special':'guest';
  o.bookgeo=S.learn<=2?'absent':(f.proj_by==='bookgeo'||f.screen_ask)?'special':'guest';
  o.lachil=S.rel.lachil<=2?'dark':(f.gm_movie||f.mem3==='told'||f.mem3==='carried')&&S.rel.lachil>=5?'special':S.rel.lachil>=4?'guest':'window';
  return o; }
const U_OUT_N={boneul:{bff:'절친 · 옆자리',special:'두 반장 · 나란히 인사',guest:'손님으로',absent:'오지 않았다 (문 앞에 토마토 한 알)'},ramda:{special:'영사기 담당',guest:'손님으로',far:'무대 뒤, 등을 보인 채'},bookgeo:{special:'옛날처럼 영사기 옆',guest:'계단 밑에서',absent:'공방 문이 닫혔다'},lachil:{special:'옥상 맨 앞줄',guest:'골목에 내려와서',window:'5층 창문에서 옥상을 보며',dark:'창문이 어두웠다'}};
function u_heroCut(o){ const held=u_held(); if(o.boneul==='bff'&&held&&o.ramda==='special'&&o.lachil==='special') return 'u_fest_full'; if(o.boneul==='absent'&&o.ramda==='far') return 'u_fest_alone'; if(o.boneul==='bff') return 'u_fest_bff'; if(S.flags.film==='book'&&held) return 'u_fest_book'; if(held) return 'u_fest_screen'; if(o.lachil==='window') return 'u_fest_window'; return 'u_fest_wall'; }
function u_story(o){ const f=S.flags; const L=[]; const held=u_held(); const bp=bookPages();
  L.push(held?'영화제는 '+(f.venue==='bamboo'?'대나무숲 빌라 옥상':'당근빌라 옥상')+'에서 열렸다. 의자 열두 개, 스크린은 '+(f.screen_ask?'북거씨의 시향지 말리던 천':'보늘네 이불보')+'.':'영화제는 옥상에서 열리지 못했다. 골목 벽에 빛을 비췄다. 그것도 영화제였다.');
  L.push(f.mem1&&f.mem1!=='skip'?'쓰레기장 사건의 진짜 사정: 5층 할머니 김치 통 하나. 둘 다 몰래 버리러 갔다. 같은 밤에.':'쓰레기장 사건은 아직 얘기하지 않았다.');
  L.push(f.mem2&&f.mem2!=='skip'?'첫 반장 회의: 둘 다 손을 안 들어서 반장이 됐다. 같은 빵집에 갔다.':'첫 반장 회의 얘기는 꺼내지 않았다.');
  L.push(f.mem3&&f.mem3!=='skip'?'할머니 접시는 처음부터 두 개였다. 둘 다 자기만 받는 줄 알았다.':'할머니 접시가 두 개였다는 건 아직 모른다.');
  L.push('그림책 「골목 이야기」 '+bookCount()+'장: '+(['fall','winter','spring','summer'].filter(k=>bp[k]).map(k=>BOOK_N[k].split(' · ')[0]+' — '+bp[k]).join(' / ')||'아직 빈 책'));
  L.push(o.boneul==='bff'?'끼토와 보늘은 둘도 없는 절친이 됐다. 말은 여전히 적다. 그게 둘의 방식이다.':f.told?'옛날 얘기를 했다. 절친까지는 한 계절 더.':'끼토와 보늘은 아직 서먹하다. 조금 덜.');
  return L; }
function u_finaleStart(){ S.week=3; const w0=startWorry();

function u_festival(){ const o=u_outcomes(); const hero=u_heroCut(o); S.outcome=o; const held=u_held();
  const showCard=()=>{ seeCut('u_fest_bg'); const lines=u_story(o); const ty=kkitoType();
    const msFinal=S.serialStop?null:(S.ms>=5?'ok':S.ms>=3?'half':'fail'); if(msFinal){ S.msLog.push(msFinal); if(msFinal==='ok') S.acorn+=6; else if(msFinal==='half') S.acorn+=3; }

    S.flags.bff=o.boneul==='bff'?1:0;
    S.seasons.push({o,ty:ty.k,ms:[...S.msLog],label:S.flags.film==='book'?'골목 이야기':''}); S.dayNo=29; save();
    show('sFest'); $('festSlot').textContent=CH().finaleBtn; renderFest(o); $('btnNewSeason').hidden=false; $('btnShare').textContent='이야기 복사하기';
    $('festTitle').textContent=o.boneul==='bff'?'둘도 없는 절친':held?'옥상 영화제 · '+(S.flags.film==='book'?'골목 이야기':S.flags.film==='old'?'옛날 영화':'늘보의 식탁'):'골목 벽의 밤';
    $('festText').innerHTML=(held?'옥상에 의자 열두 개. 스크린에 빛이 떴다. '+(S.flags.mc==='both'?'두 반장이 나란히 인사했다. 둘 다 짧게.':S.flags.mc==='boneul'?'보늘이 인사했다. 카메라 없이도 됐다.':S.flags.mc==='ramda'?'람다가 마이크를 잡았다. 가을 무대처럼.':'인사는 없었다. 바로 영화.'):'옥상은 못 썼다. 람다가 골목 벽에 빛을 비췄다. 의자는 벤치였다.')+'<br>'+FRIENDS.map(k=>'<b>'+F[k].n+'</b> · '+U_OUT_N[k][o[k]]).join('<br>');
    $('festPoem').innerHTML='<div class="ph">한 해의 끝 · 골목 이야기</div>'+lines.join('<br>');

    $('festStat').innerHTML='<div><b>당신의 끼토는</b>'+ty.n+'<br><span style="font-size:11px;color:#A9A08C;">'+ty.d+'</span></div><div><b>원고 4주</b>'+(S.serialStop?'연재 중단 ('+msTxt+')':msTxt)+'<br><span style="font-size:11px;color:#A9A08C;">도토리 '+S.acorn+'</span></div><div><b>미개 더위</b>'+(S.flags.migae_cool?'등딱지 밑에서':S.flags.helpersN!==undefined?'선풍기 앞에서':'-')+'</div><div><b>회상</b>'+memCount()+'/3 · 절친 점수 '+bffPoints()+'</div>';
    $('festRel').innerHTML=relRows(true);
    D.poemText='[솜솜시티 · 끼토의 하루] 여름 「두 반장 이야기」 · 한 해의 끝\n'+lines.join('\n')+'\n— '+ty.n+' · '+FRIENDS.map(k=>F[k].n+': '+U_OUT_N[k][o[k]]).join(' / ')+'\nhttps://pang861209-rgb.github.io/somsom-city/day/';
    report('kkito',40+(o.boneul==='bff'?30:0)); };
  playCut({cut:hero,bg:AD+'bg_alley_night.jpg',name:'영화제의 밤 · '+CUTS[hero].n,text:{u_fest_full:'옥상. 의자 열두 개가 다 찼다. 람다가 영사기를 돌리고, 북거씨가 그 옆에서 렌즈를 봤고, 할머니는 맨 앞줄에서 얼음 쑥떡을 돌렸다. 스크린에 골목이 떴다. 끼토와 보늘은 맨 뒷줄. 나란히. 보늘: <q>...내년에도 해.</q> 절친이 된 밤.',u_fest_alone:'골목 벽에 빛. 의자 대신 벤치. 끼토와 미개. 람다는 상점 안에서 나오지 않았고, 대나무숲 빌라 창문은 어두웠다. 그래도 빛은 벽에 떴다. 골목이 잠깐 환했다.',u_fest_bff:'영화가 끝나고 다들 내려간 옥상. 난간에 끼토와 보늘. 골목에 불이 하나씩 꺼졌다. 보늘: <q>...김치 통.</q> 끼토: <q>...김치 통.</q> 둘 다 웃었다. 둘도 없는 절친이 된 밤.',u_fest_book:'스크린에 그림책 「골목 이야기」가 떴다. 한 장에 한 계절. 끼토가 읽었다. 목소리가 갈라졌다. 객석에서 누가 웃었다. 보늘이었다. 마지막 장은 오늘 밤이었다.',u_fest_screen:'옥상. 스크린에 빛이 떴다. 의자 열두 개. 두 빌라가 처음으로 같은 화면을 봤다. 매미가 그쳤다. 미개가 스크린 앞을 지나가서 그림자가 됐다. 다들 웃었다.',u_fest_window:'옥상은 못 썼다. 골목 벽에 빛. 5층 창문이 열리고 할머니가 내려다봤다. 벽에 뜬 빛이 창문까지 닿았다. 할머니가 손을 흔들었다. 끼토도, 미개도.',u_fest_wall:'골목 벽에 빛. 벤치 세 개. 람다가 빔을 돌렸다. 옥상은 아니었지만 골목이 잠깐 극장이 됐다. 북거씨가 계단 밑에서 봤다.'}[hero],migae:'미개가 스크린 앞을 지나갔다. 그림자가 제일 컸다.',btn:'결산 카드'},showCard); }
