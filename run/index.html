<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="달려라 솜솜시티">
<meta name="theme-color" content="#e9e2d4">
<title>달려라 솜솜시티! (솜솜시티 러너)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { background:#0e0e0e; font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; display:flex; justify-content:center; align-items:center; }
  #app { width:100vw; height:100vh; height:100dvh; position:relative; user-select:none; }
  canvas { display:block; width:100%; height:100%; background:#fdfbf5; touch-action:none; }
  #rotate { position:fixed; inset:0; z-index:99; background:#fdfbf5; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-size:20px; font-weight:800; color:#5a4a3a; text-align:center; padding:24px; }
  @media (orientation:portrait) { #rotate { display:flex; } }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:14px 18px; text-align:center; overflow-y:auto; }
  .hidden { display:none; }
  h1 { font-size:24px; color:#5a4a3a; }
  .sub { color:#7a6a5a; font-size:12px; line-height:1.5; }
  button { border:2px solid #222; background:#fff; border-radius:10px; padding:9px 22px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:2px 2px 0 #222; }
  button:active { transform:translate(2px,2px); box-shadow:none; }
  #title { overflow:hidden; justify-content:space-between; padding:22px 18px; }
  #titleBg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  #titleTop, #titleBtns { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #logo { font-size:30px; color:#5a4a3a; text-shadow:-2px -2px 0 #fdfbf5,2px -2px 0 #fdfbf5,-2px 2px 0 #fdfbf5,2px 2px 0 #fdfbf5,0 3px 0 #fdfbf5; }
  #logoSub { font-size:12px; color:#6a5a48; text-shadow:-1px -1px 0 #fdfbf5,1px -1px 0 #fdfbf5,-1px 1px 0 #fdfbf5,1px 1px 0 #fdfbf5; }
  #fsHint { font-size:11px; color:#6a5a48; text-shadow:-1px -1px 0 #fdfbf5,1px -1px 0 #fdfbf5,-1px 1px 0 #fdfbf5,1px 1px 0 #fdfbf5; }
  #select, #ranking, #result { background:#fdfbf5; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:720px; }
  .card { border:2px solid #2b2620; border-radius:14px; background:#fff; padding:8px 10px; cursor:pointer; display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; box-shadow:0 3px 0 #2b2620; position:relative; transition:transform .05s; }
  .card:active { transform:translateY(3px); box-shadow:0 0 0 #2b2620; }
  .card .por { width:54px; height:50px; display:flex; align-items:flex-end; justify-content:center; }
  .card .por img { max-width:54px; max-height:50px; object-fit:contain; }
  .card .info { text-align:left; min-width:0; }
  .card .top { display:flex; align-items:center; gap:5px; margin-bottom:1px; }
  .card .nm { font-weight:900; font-size:14px; color:#3a3128; }
  .card .badge { font-size:9px; font-weight:800; padding:1px 6px; border-radius:8px; color:#fff; white-space:nowrap; }
  .card .abil { font-size:10px; color:#6a5a48; font-weight:700; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .bar { display:flex; align-items:center; gap:5px; margin-top:1px; }
  .card .bar .lab { font-size:8px; color:#9a8b7a; width:20px; font-weight:700; }
  .card .seg { display:flex; gap:2px; }
  .card .seg i { width:9px; height:5px; border-radius:1px; background:#e7e1d2; display:block; }
  .card .seg i.on { background:#e0a83a; }
  .card .best { position:absolute; top:7px; right:9px; font-size:9px; font-weight:800; color:#b08a3a; }
  #resQuote { font-size:13px; color:#5a4a3a; background:#f3ede2; border-radius:8px; padding:6px 12px; }
  #nameRow { display:none; gap:8px; align-items:center; }
  #nameRow input { border:2px solid #222; border-radius:10px; padding:8px 12px; font-size:15px; width:120px; background:#fff; }
  .rankrow { display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px dashed #d8cdb8; font-size:13px; color:#5a4a3a; text-align:left; }
  .rankrow .rk { width:34px; font-weight:800; }
  .rankrow img { width:28px; height:28px; object-fit:contain; }
  .rankrow .rname { font-weight:800; flex:1; }
  .rankrow .rscore { font-weight:800; color:#b08a3a; }
  .rankrow.me { background:#f6eed8; border-radius:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  /* 캐릭터 인트로 삽화 (가로) */
  #intro { padding:0; overflow:hidden; justify-content:flex-end; cursor:pointer; }
  #introImg { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; background:#f3ede2; z-index:0; }   /* contain: 삽화 잘림 방지 */
  #introBox { position:relative; z-index:1; margin:0 14px 12px 14px; max-width:min(400px,54%); width:auto; align-self:flex-start; background:rgba(253,251,245,.92); border:2.5px solid #222; border-radius:14px; box-shadow:3px 3px 0 rgba(34,34,34,.75); padding:8px 12px; text-align:left; animation:introUp .5s ease-out; }   /* introBox 축소·좌하단 */   /* introBox 축소·좌하단 정렬 (캐릭터 가림 방지) */
  #introBox .iname { font-weight:800; font-size:14px; color:#b08a3a; margin-bottom:4px; }
  #introBox .itext { font-size:13px; color:#5a4a3a; line-height:1.55; }
  #introBox .ihint { margin-top:6px; font-size:10px; color:#9a8b7a; text-align:right; animation:iblink 1.4s infinite; }
  @keyframes introUp { from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes iblink { 50%{opacity:.35} }
  /* introCompact: 낮은 화면에서 말풍선이 화면을 덮지 않도록 */
  @media (max-height:430px){ #introBox{max-width:min(360px,52%); padding:7px 11px; margin-bottom:10px;}
    #introBox .iname{font-size:12px;} #introBox .itext{font-size:11.5px; line-height:1.4;}
    #introBox .ihint{font-size:9px;} }
  .homeBtn{position:absolute;top:8px;left:8px;z-index:60;background:rgba(255,255,255,.88);border:2px solid #222;border-radius:8px;padding:4px 11px;font:700 13px "Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#222;text-decoration:none;box-shadow:2px 2px 0 #222;}
  .homeBtn:active{transform:translate(2px,2px);box-shadow:none;}

  /* ── 일시정지 (Phase 1) ── */
  .pauseBtn{position:absolute;top:8px;left:76px;z-index:60;background:rgba(255,251,244,.94);border:2.5px solid #2B2620;
    border-radius:14px;padding:4px 12px;font:700 14px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#2B2620;
    box-shadow:0 3px 0 -1px #E4D9C0;cursor:pointer;display:none;line-height:1.2;}
  .pauseBtn:active{transform:translateY(2px);box-shadow:none;}
  #pauseWrap{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(43,38,32,.44);padding:20px;}
  #pauseWrap.on{display:flex;}
  #pauseCard{background:#FDFBF5;border:2.5px solid #2B2620;border-radius:24px;padding:22px 24px;display:flex;
    flex-direction:column;gap:14px;align-items:center;min-width:210px;
    box-shadow:0 6px 0 -1px #E4D9C0, 0 18px 28px -16px rgba(74,52,26,.55);}
  #pauseCard .pt{font-size:19px;font-weight:800;color:#2B2620;}
  #pauseCard .ps{font-size:12.5px;color:#7A6A5A;margin-top:-6px;}
  #pauseCard .prow{display:flex;gap:9px;}
  #pauseCard button{border:2.5px solid #2B2620;border-radius:16px;padding:10px 18px;font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer;background:#FDFBF5;color:#2B2620;box-shadow:0 3px 0 -1px #E4D9C0;}
  #pauseCard button.pri{background:#E0A83A;box-shadow:0 3px 0 -1px #A8781F;}
  #pauseCard button:active{transform:translateY(2px);box-shadow:none;}

  /* 조작 안내 (Phase 1) — 낙엽피하기와 같은 패턴 */
  .howto { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:2px; }
  .howto .pill { font-size:11px; font-weight:700; color:#5a4a3a; background:#f3ede2;
    border:1.5px solid #e2d8c4; border-radius:20px; padding:4px 12px; white-space:nowrap; }

  /* 업적 (Phase 2) */
  #achToast{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-140%);z-index:95;
    background:#FDFBF5;border:2.5px solid #2B2620;border-radius:18px;padding:9px 16px;display:flex;align-items:center;gap:10px;
    box-shadow:0 5px 0 -1px #E4D9C0, 0 14px 22px -14px rgba(74,52,26,.5);opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.3,1),opacity .3s;
    font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;white-space:nowrap;pointer-events:none;}
  #achToast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;}
  #achToast .ai{font-size:20px;}
  #achToast .at{font-size:11px;font-weight:800;color:#B08A3A;letter-spacing:.06em;}
  #achToast .an{font-size:14px;font-weight:800;color:#2B2620;}

  #dailyRow{display:flex;justify-content:center;}
  #dailyBtn2{background:#F6EED8;border:2.5px solid #2B2620;border-radius:16px;padding:9px 18px;
    font-size:13.5px;font-weight:800;color:#2B2620;cursor:pointer;font-family:inherit;
    box-shadow:0 3px 0 -1px #C9B98F;}
  #dailyBtn2:active{transform:translateY(2px);box-shadow:none;}
</style>
</head>
<body>
<div id="rotate">📱 가로로 돌려주세요!<div style="font-size:13px;font-weight:600;color:#7a6a5a;">마감 질주는 가로 화면 전용이에요</div></div>
<div id="app">
  <div id="achToast"><span class="ai">🏅</span><span><span class="at">업적 달성</span><br><span class="an"></span></span></div>
  <button id="pauseBtn" class="pauseBtn" title="일시정지">❙❙</button>
  <div id="pauseWrap"><div id="pauseCard">
    <div class="pt">잠깐 쉬는 중</div>
    <div class="ps">기록은 그대로 있어요</div>
    <div class="prow">
      <button class="pri" id="pauseResume">이어하기</button>
      <button id="pauseQuit">그만두기</button>
    </div>
  </div></div>
  <a href="../" class="homeBtn" title="솜솜시티 홈">← 홈</a>
  <canvas id="cv" width="760" height="420"></canvas>

  <div id="title" class="screen">
    <img id="titleBg" src="../assets/bg_runner.png" onerror="this.style.display='none'" alt="">
    <div id="titleTop">
      <div id="logo">🏃 달려라 솜솜시티!</div>
      <div id="logoSub">은행잎 골목을 달려 최대한 멀리! · 탭 / 스페이스 = 점프 (공중에서 한 번 더!)</div>
    </div>
    <div id="titleBtns" class="row">
      <button onclick="ui.toSelect()">캐릭터 선택 ▶</button>
      <button onclick="ui.showRanking()" style="font-size:13px;padding:7px 16px;">🏆 랭킹</button>
      <button onclick="goFullscreen()" style="font-size:13px;padding:7px 16px;">⛶ 전체화면</button>
    </div>
  </div>

  <div id="select" class="screen hidden">
    <h1>캐릭터 선택</h1>
    <div class="sub">함께 달릴 친구를 골라보세요 · 속도 · 점프 · 회피가 캐릭터마다 달라요</div>
    <div class="howto">
      <span class="pill">👆 탭 = 점프</span>
      <span class="pill">공중에서 한 번 더</span>
      <span class="pill">🌰 도토리 모으기</span>
      <span class="pill">아슬아슬 넘으면 보너스</span>
      <span class="pill">⚠ 떨어지는 은행 주의</span>
    </div>
    <div id="dailyRow"><button id="dailyBtn2"></button></div>
    <div class="grid" id="charGrid"></div>
    <button onclick="ui.toTitle()" style="font-size:13px;padding:7px 16px;">← 뒤로</button>
  </div>

  <div id="intro" class="screen hidden" onclick="ui.beginFromIntro()">
    <img id="introImg" src="" alt="">
    <div id="introBox">
      <div class="iname" id="introName"></div>
      <div class="itext" id="introText"></div>
      <div class="ihint">탭하면 바로 출발 ▶</div>
    </div>
  </div>

  <div id="ranking" class="screen hidden">
    <h1>🏆 마감 질주 랭킹</h1>
    <div id="rankList" style="width:100%;max-width:520px;max-height:60%;overflow-y:auto;"></div>
    <button onclick="ui.toTitle()">닫기</button>
  </div>

  <div id="result" class="screen hidden">
    <h1 id="resTitle">결과</h1>
    <img id="resImg" src="" style="height:96px;">
    <div id="resQuote"></div>
    <div id="resScore" style="font-size:22px;font-weight:800;color:#5a4a3a;"></div>
    <div id="resDetail" class="sub"></div>
    <div id="resBest" class="sub"></div>
    <div id="nameRow"><input id="nameInput" maxlength="8" placeholder="이름 (8자)"><button id="submitBtn" onclick="submitScore()">🏆 랭킹 등록</button></div>
    <div class="row">
      <button onclick="ui.replay()">다시</button>
      <button onclick="ui.toSelect()">캐릭터 변경</button>
      <button onclick="shareCard()">📸 자랑</button>
      <button onclick="ui.toTitle()" style="font-size:13px;padding:7px 14px;">메인</button>
    </div>
  </div>
</div>

<script>
// ================= 캐릭터 (밸런스) =================
// spd:기본속도배수  jv/djv:점프력/더블점프력  grav:중력  dw:그리기/히트박스 크기
// shield:첫충돌 무효 횟수  magnet:도토리 자석 범위  coinx:도토리 점수배수
const CHARS = {
  kkito:      { name:'끼토',  spr:'../assets/run_kkito.png',  sd:'../assets/sd_kkito.png',  dw:80, spd:1.0,  jv:800, djv:720, grav:2500, shield:0, magnet:0,   coinx:1,
    trait:'점프 장인 — 가장 높은 점프 + 더블점프 (만능 기본)', intro:'마감이다! 달려, 끼토!' },
  migae:      { name:'미개',  spr:'../assets/run_migae.png',  sd:'../assets/sd_migae.png',  dw:24, spd:1.0, jv:700, djv:600, grav:2350, shield:0, magnet:0, coinx:1, jumps:3,
    trait:'삼단 점프 — 6다리로 공중에서 두 번 더! 작아서 잘 안 맞음', intro:'뽈뽈뽈—! 따라와!' },
  ramda:      { name:'람다',  spr:'../assets/run_ramda.png',  sd:'../assets/sd_ramda.png',  dw:58, spd:1.0,  jv:770, djv:700, grav:2500, shield:0, magnet:135, coinx:1,
    trait:'수집형 — 도토리 자석 (주변 도토리가 끌려옴)', intro:'도토리는 다 내 거야!' },
  boneul:     { name:'보늘',  spr:'../assets/run_boneul.png', sd:'../assets/sd_boneul.png', dw:74, spd:0.82, jv:715, djv:650, grav:2700, shield:1, magnet:0,   coinx:1,
    trait:'탱커형 — 첫 충돌 1회 무효 (느리지만 든든)', intro:'천천히 가도 안 죽어~' },
  bookgeo:    { name:'북거씨', spr:'../assets/run_bookgeo.png', sd:'../assets/sd_bookgeo.png', dw:49, spd:0.85, jv:720, djv:660, grav:1750, shield:0, magnet:0, coinx:1,
    trait:'플로팅형 — 천천히 떨어져 타이밍이 관대 (쉬움)', intro:'서두르지 않아도 돼요.' },
  lachilchin: { name:'라칠친 할머니', spr:'../assets/run_lachilchin.png', sd:'../assets/sd_lachilchin.png', dw:35, spd:0.9, jv:760, djv:690, grav:2500, shield:0, magnet:0, coinx:2,
    trait:'알뜰형 — 도토리 점수 2배 (느린 시작)', intro:'아이구, 천천히 줍자 그래~' },
};

// ================= 캐릭터 카드 표시용 (타입·특기·스탯) =================
// st: [속도, 점프, 회피] 0~5
const CARD = {
  kkito:      { type:'만능', col:'#4a78c0', abil: '최고 점프 + 더블점프',  st:[3,5,3] },
  migae:      { type:'기동', col:'#8a6fb0', abil: '삼단 점프 · 작은 몸',    st:[3,4,5] },
  ramda:      { type:'수집', col:'#d08a3a', abil: '도토리 자석',          st:[3,3,3] },
  boneul:     { type:'탱커', col:'#5a9a5a', abil: '첫 충돌 1회 무효',      st:[1,2,5] },
  bookgeo:    { type:'안정', col:'#3a9a9a', abil: '느린 낙하 (쉬움)',      st:[2,2,4] },
  lachilchin: { type:'알뜰', col:'#c87a9a', abil: '도토리 점수 2배',      st:[2,3,3] },
};

// ================= 기본 =================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(3, window.devicePixelRatio || 1);
let W = 760, H = 420, GROUND = 353, PX = 114;   // 화면 크기에 맞춰 layout()에서 갱신
function layout(){
  const r = cv.getBoundingClientRect();
  W = Math.max(360, Math.round(r.width)); H = Math.max(240, Math.round(r.height));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  GROUND = Math.round(H * 0.84); PX = Math.round(W * 0.15);
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 250));
const $ = id => document.getElementById(id);
const LOSE = '으아아—! 마감 늦었어!';
const NEAR_MAX = 34, NEAR_TIGHT = 14;   // 니어미스 판정 간격(px): 34 이내=아슬아슬, 14 이내=완벽

function downscale(src, tw){ let c=src; while(c.width/2>tw){ const n=document.createElement('canvas'); n.width=(c.width/2)|0; n.height=(c.height/2)|0; const x=n.getContext('2d'); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(c,0,0,n.width,n.height); c=n; } return c; }
function keyOutWhiteBg(im){ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); x.drawImage(im,0,0); const d=x.getImageData(0,0,c.width,c.height),p=d.data,w=c.width,h=c.height; const white=i=>p[i]>228&&p[i+1]>228&&p[i+2]>228; const seen=new Uint8Array(w*h),q=[]; for(let X=0;X<w;X++)q.push(X,(h-1)*w+X); for(let Y=0;Y<h;Y++)q.push(Y*w,Y*w+w-1); while(q.length){const n=q.pop(); if(n<0||n>=w*h||seen[n])continue; seen[n]=1; if(!white(n*4))continue; p[n*4+3]=0; const X=n%w; if(X>0)q.push(n-1); if(X<w-1)q.push(n+1); q.push(n-w,n+w);} x.putImageData(d,0,0); return c; }
// 투명 여백 잘라내기 (발이 땅에 붙고 히트박스가 실제 몸에 맞도록)

function loadAB(k,target){   // 폴백: 기존 단일/2프레임
  const c=CHARS[k], out=[null,null];

    im.onload=()=>{ try{out[i]=downscale(trimCanvas(keyOutWhiteBg(im)),target);}catch(e){out[i]=im;} sprites[k]=out.filter(Boolean); };
    im.onerror=()=>{ if(fb){ const f=new Image(); f.src=fb; f.onload=()=>{ try{out[i]=downscale(trimCanvas(keyOutWhiteBg(f)),target);}catch(e){out[i]=f;} sprites[k]=out.filter(Boolean); }; } };
  };

}
function loadFrames(k){

    im.onload=()=>{ try{ out[i]=downscale(im,target); }catch(e){ out[i]=im; } sprites[k]=out.filter(Boolean); };

}

function tone(f,d,t,g,when,sl){ const a=ac(),o=a.createOscillator(),gn=a.createGain(),t0=a.currentTime+(when||0); o.type=t||'square'; o.frequency.setValueAtTime(f,t0); if(sl)o.frequency.exponentialRampToValueAtTime(sl,t0+d); gn.gain.setValueAtTime(g||.07,t0); gn.gain.exponentialRampToValueAtTime(.0001,t0+d); o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0+d+.02); }
function sfx(n){ if(muted)return; try{

  else if(n==='land')tone(150,.06,'triangle',.05);

  else if(n==='block')tone(300,.2,'sine',.07,0,460);
  else if(n==='hit'){tone(220,.22,'sawtooth',.08,0,70);tone(110,.25,'square',.05,.02,60);}
  else if(n==='record')[523,659,784].forEach((f,i)=>tone(f,.16,'square',.05,i*.09));
  else if(n==='over')[392,311,233].forEach((f,i)=>tone(f,.25,'triangle',.07,i*.18));
  else if(n==='near'){tone(1180,.05,'triangle',.045);tone(1560,.07,'triangle',.04,.04);}
  else if(n==='warn'){tone(980,.07,'square',.05);tone(980,.07,'square',.05,.12);}

  else if(r<0.9){ h=44+Math.random()*12; w=26+Math.random()*10; }
  else { s.obs.push({x:W+40+130,w:26,h:40}); h=38; w=24; }   // 연속 2개 (10%)

function spawnGems(s){

  for(let i=0;i<cnt;i++){ const yy=arc?baseY-Math.sin(i/(cnt-1)*Math.PI)*50:baseY; s.gems.push({x:W+30+i*36,y:yy,taken:false}); }
}

// ================= 루프 =================
function loop(now){
  const s=S; if(!s||paused)return;   // 정지 중엔 프레임을 진행하지 않음
  if(H>W){ s.last=performance.now(); raf=requestAnimationFrame(loop); return; }   // 세로 화면 = 일시정지
  let dt=Math.min(.05,(now-s.last)/1000); s.last=now;
  if(s.over)dt*=.25; if(s.hitstop>0){ s.hitstop-=dt; dt=0; }
  if(s.introT>0)s.introT-=dt;
  if(s.inv>0)s.inv-=dt;

  if(!s.over){
    s.speed=Math.min(s.cap, s.speed+4.2*s.c.spd*dt);
    s.dist+=s.speed*dt; s.run+=s.speed*dt;
    s.vy+=s.c.grav*dt; s.y+=s.vy*dt;
    if(s.y>=0){ if(!s.onGround){ sfx('land'); for(let i=0;i<5;i++)s.parts.push({x:PX,y:GROUND,vx:(Math.random()-.3)*80,vy:-15,g:300,life:.3,max:.3,size:3,col:'#d8c8a8'}); } s.y=0; s.vy=0; s.onGround=true; s.jumps=(s.c.jumps||2); s.airJumps=0; }
    if(s.onGround&&Math.random()<.25)s.parts.push({x:PX-15,y:GROUND-2,vx:-55,vy:-8,g:120,life:.3,max:.3,size:2.5,col:'rgba(180,160,120,.5)'});
    s.nextObs-=s.speed*dt; if(s.nextObs<=0){ spawnObstacle(s); s.nextObs=420+Math.random()*300; }
    s.nextGem-=s.speed*dt; if(s.nextGem<=0){ spawnGems(s); s.nextGem=360+Math.random()*260; }
    s.nextMark-=s.speed*dt; if(s.nextMark<=0){ const L=LANDMARKS[(s.markIdx=(s.markIdx||0)+1)%LANDMARKS.length];
      s.marks.push({x:W+60, id:L.id, n:L.n, got:false}); s.nextMark=900+Math.random()*500; }   // 코스 랜드마크
    s.nextDrop-=s.speed*dt; if(s.nextDrop<=0 && s.dist>500){ s.drops.push({x:W+70,ph:0,t:0,y:-70}); s.nextDrop=850+Math.random()*750; }   // 낙하 은행 (경고→낙하→잔류)
  }

  const _set=sprites[s.key], _fa=(_set&&_set.length)?_set[0]:null;
  const drawW=_fa?s.c.dw*((_fa.width||_fa.naturalWidth)/(_fa.height||_fa.naturalHeight)):s.c.dw*0.7;
  const half=Math.max(10,Math.min(24,drawW*0.30)), py=GROUND+s.y, cx=PX, cy=py-s.c.dw*0.45;
  for(const o of s.obs){
    o.x-=s.speed*dt;
    const ovX = cx+half>o.x+6 && cx-half<o.x+o.w-6;                       // 가로로 겹치는 중
    if(!s.over && s.inv<=0 && ovX && py>GROUND-o.h+6){
      if(s.shield>0){ s.shield--; s.inv=1.1; s.shake=.35; s.combo=0; s.comboT=0; sfx('block'); s.floats.push({x:PX,y:py-70,txt:'막았다!',col:'#3a7a5a',life:1.1}); }
      else { s.over=true; s.overAt=now; s.shake=.5; s.hitstop=.12; sfx('hit'); sfx('over'); stopBgm(); }
    }
    // ── 니어미스: 장애물 위를 아슬아슬하게 넘으면 보너스 (붙어서 달릴수록 이득) ──
    if(!s.over && s.inv<=0){
      if(ovX){
        const cl=(GROUND-o.h)-py;                                          // 발끝과 장애물 윗면 간격
        if(cl>-8 && cl<(o.mc===undefined?1e9:o.mc)) o.mc=cl;               // 지나가는 동안 최소 간격 기록
      } else if(o.mc!==undefined && !o.nmDone && o.x+o.w<cx-half){
        o.nmDone=true;
        if(o.mc<=NEAR_MAX){
          const tight=o.mc<=NEAR_TIGHT, pts=tight?40:20;
          s.coinPts+=pts; s.nears=(s.nears||0)+1;
          if(tight)s.tights=(s.tights||0)+1;
          sfx('near');
          s.floats.push({x:PX+34,y:py-96,txt:(tight?'완벽! +':'아슬아슬! +')+pts,
                         col:tight?'#d2452a':'#b08a3a',life:1.0});
        }
      }
    }
  }
  s.obs=s.obs.filter(o=>o.x+o.w>-20);
  // ── 낙하 은행 업데이트: 경고(그림자) → 낙하 → 바닥 잔류 후 소멸 ──
  const dropHit=()=>{ if(s.shield>0){ s.shield--; s.inv=1.1; s.shake=.35; sfx('block'); s.floats.push({x:PX,y:py-70,txt:'막았다!',col:'#3a7a5a',life:1.1}); }
    else { s.over=true; s.overAt=now; s.shake=.5; s.hitstop=.12; sfx('hit'); sfx('over'); stopBgm(); } };
  for(const d of s.drops){
    d.x-=s.speed*dt; d.t+=dt;
    if(d.ph===0){ if(d.t>0.75){ d.ph=1; d.t=0; sfx('warn'); } }
    else if(d.ph===1){
      d.y+=1500*dt;
      if(d.y>=GROUND-14){ d.y=GROUND-14; d.ph=2; d.t=0; s.shake=Math.max(s.shake,.18); sfx('thud');
        for(let i=0;i<7;i++)s.parts.push({x:d.x,y:GROUND,vx:(Math.random()-.5)*140,vy:-30-Math.random()*60,g:340,life:.4,max:.4,size:3,col:'#8a8a3a'}); }
      if(!s.over && s.inv<=0 && Math.abs(d.x-cx)<half+9 && d.y+13>py-s.c.dw*0.9 && d.y-13<py) dropHit();
    }
    else if(d.ph===2){
      if(!s.over && s.inv<=0 && cx+half>d.x-11 && cx-half<d.x+11 && py>GROUND-27) dropHit();
      if(d.t>3.2){ d.ph=3; for(let i=0;i<5;i++)s.parts.push({x:d.x,y:GROUND-10,vx:(Math.random()-.5)*80,vy:-40,g:300,life:.35,max:.35,size:2.5,col:'#d8c8a8'}); }
    }
  }
  s.drops=s.drops.filter(d=>d.x>-40 && d.ph<3);
  for(const m of s.marks){ m.x-=s.speed*dt;
    if(!m.got && m.x<cx){ m.got=true; dexAdd(m.id, m.n); } }
  s.marks=s.marks.filter(m=>m.x>-140);
  for(const g of s.gems){
    g.x-=s.speed*dt;
    if(!g.taken && s.c.magnet){ const dx=cx-g.x, dy=cy-g.y, d=Math.hypot(dx,dy)||1; if(d<s.c.magnet){ g.x+=dx/d*220*dt; g.y+=dy/d*220*dt; } }
    if(!g.taken && Math.abs(g.x-cx)<26 && Math.abs(g.y-cy)<34){
      g.taken=true; s.coins++;
      s.combo++; if(s.combo>s.bestCombo)s.bestCombo=s.combo; s.comboT=3.0;   // 연속 줍기 = 콤보
      const mult=Math.min(5,s.combo), pts=30*s.c.coinx*mult; s.coinPts+=pts; sfx('coin');
      for(let i=0;i<8;i++)s.parts.push({x:g.x,y:g.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120-40,g:300,life:.5,max:.5,size:3,col:['#b5824a','#e8c14a','#fff'][i%3]});
      s.floats.push({x:g.x,y:g.y-10,txt:'+'+pts,col:'#b08a3a',life:.7});
    }
  }
  s.gems=s.gems.filter(g=>!g.taken&&g.x>-20);

  const score=scoreOf(s);
  if(!s.recordShown && s.best>0 && score>s.best && !s.over){ s.recordShown=true; sfx('record'); s.floats.push({x:PX,y:py-80,txt:'신기록!',col:'#d2452a',life:1.5}); }

  for(const p of s.parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; } s.parts=s.parts.filter(p=>p.life>0);
  for(const f of s.floats){ f.life-=dt; f.y-=34*dt; } s.floats=s.floats.filter(f=>f.life>0);
  s.shake=Math.max(0,s.shake-dt);
  if(s.spin>0)s.spin=Math.max(0,s.spin-dt*2.8);   // 공중 플립 감쇠
  if(s.comboT>0 && !s.over){ s.comboT-=dt; if(s.comboT<=0) s.combo=0; }   // 줍기 끊기면 콤보 리셋

  draw(s,now,score);
  if(s.over && now-s.overAt>800) return endGame(score);
  raf=requestAnimationFrame(loop);
}

// ================= 그리기 =================
function draw(s,now,score){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.save();
  if(s.shake>0){ const m=s.shake*16; ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m); }
  // 배경 패럴랙스
  if(bgReady){ const sc=(GROUND+14)/bg.height, dw=bg.width*sc, dh=bg.height*sc; let off=-((s.dist*0.4)%dw); for(let x=off;x<W;x+=dw)ctx.drawImage(bg,x,(GROUND+14)-dh,dw,dh); }
  else { ctx.fillStyle='#fdfbf5'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#f0d878'; for(let x=-10;x<=W+10;x+=46){ctx.beginPath();ctx.arc(x,40,34,0,Math.PI);ctx.fill();} }
  ctx.fillStyle='rgba(252,250,244,0.55)'; ctx.fillRect(0,0,W,GROUND+2);   // 배경 죽이기 (전경 가독성)
  ctx.fillStyle='#efe6d2'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  ctx.strokeStyle='rgba(150,130,90,.35)'; ctx.lineWidth=3; ctx.beginPath(); let lo=-((s.dist)%64); for(let x=lo;x<W;x+=64){ctx.moveTo(x,GROUND+24);ctx.lineTo(x+28,GROUND+24);} ctx.stroke();
  // 장애물
  for(const m of s.marks){ const im=lmImg[m.id]; if(!im) continue;
    const h=Math.min(96,GROUND*0.30), w=h*(im.width||im.naturalWidth)/(im.height||im.naturalHeight);
    ctx.globalAlpha=.92; ctx.drawImage(im, m.x-w/2, GROUND-h, w, h); ctx.globalAlpha=1; }
  for(const o of s.obs){ const top=GROUND-o.h; ctx.fillStyle=o.h>48?'#b07a4a':'#9a7a4a'; ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(o.x,top,o.w,o.h,5); ctx.fill(); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.roundRect(o.x+3,top+3,o.w-6,6,3); ctx.fill(); }
  // ── 낙하 은행(썩은 열매) 렌더 — '먹는 것'과 확실히 구분되게 위험 신호 강조 ──
  for(const d of s.drops){
    if(d.ph===0){                                        // 경고: 붉은 링 + 깜빡임 + ⚠
      const bl=.30+.35*Math.abs(Math.sin(now/90));
      ctx.globalAlpha=bl; ctx.fillStyle='#c2452a'; ctx.beginPath(); ctx.ellipse(d.x,GROUND+4,17,6,0,0,7); ctx.fill();
      ctx.globalAlpha=bl*.9; ctx.strokeStyle='#c2452a'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(d.x,GROUND+4,23,8,0,0,7); ctx.stroke(); ctx.globalAlpha=1;
      ctx.font='800 18px sans-serif'; ctx.textAlign='center'; ctx.strokeStyle='#fff'; ctx.lineWidth=3.5;
      ctx.strokeText('⚠',d.x,GROUND-18); ctx.fillStyle='#c2452a'; ctx.fillText('⚠',d.x,GROUND-18);
    } else {
      const gy=(d.ph===1)?d.y:GROUND-16;
      ctx.globalAlpha=.28; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(d.x,GROUND+4,14,5,0,0,7); ctx.fill(); ctx.globalAlpha=1;
      if(d.ph===1){                                      // 낙하: 붉은 경고 링을 달고 떨어짐
        ctx.globalAlpha=.5; ctx.strokeStyle='#c2452a'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(d.x,gy,21,0,7); ctx.stroke(); ctx.globalAlpha=1;
      }
      const img=(d.ph===1)?stinkFall:stinkSplat;
      if(img){ const w=(d.ph===1)?34:40, h=w*img.height/img.width;
        ctx.save(); ctx.translate(d.x,gy); if(d.ph===1)ctx.rotate(Math.sin(now/150)*0.5);
        ctx.drawImage(img,-w/2,-h/2,w,h); ctx.restore(); }
      else { ctx.fillStyle='#9a8a3a'; ctx.strokeStyle='#222'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(d.x,gy,13,0,7); ctx.fill(); ctx.stroke(); }
      if(d.ph===2){                                      // 착지: 악취 물결 (밟으면 아웃 신호)
        ctx.globalAlpha=.55+.25*Math.sin(now/160); ctx.strokeStyle='#7a7a3a'; ctx.lineWidth=2;
        for(let k=0;k<2;k++){ const bx=d.x-7+k*14, t=now/170+k;
          ctx.beginPath(); ctx.moveTo(bx,GROUND-30);
          ctx.quadraticCurveTo(bx+5*Math.sin(t),GROUND-40,bx,GROUND-50); ctx.stroke(); }
        ctx.globalAlpha=1;
      }
    }
  }
  // 도토리
  for(const g of s.gems){ ctx.globalAlpha=0.5; ctx.fillStyle='#fffaf0'; ctx.beginPath(); ctx.arc(g.x,g.y,16,0,7); ctx.fill(); ctx.globalAlpha=1; if(acorn){ const w=28,h=28*acorn.height/acorn.width; ctx.drawImage(acorn,g.x-w/2,g.y-h/2,w,h);} else { ctx.font='24px serif'; ctx.textAlign='center'; ctx.fillText('🌰',g.x,g.y+8);} }
  // 파티클
  for(const p of s.parts){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); } ctx.globalAlpha=1;
  // 캐릭터 (선택) — 발을 땅에 붙이고 2프레임 달리기 애니메이션
  const frames=sprites[s.key];
  let im=null;
  if(frames && frames.length){
    if(!s.onGround){                       // 공중에서도 포즈가 바뀌어야 '멈춘 것'처럼 안 보임
      const nf=frames.length;
      im = nf>=4 ? (s.vy<-140 ? frames[3] : (s.vy>140 ? frames[1] : frames[0])) : frames[nf-1];
    }
    else im=frames[Math.floor(s.run/22)%frames.length];              // 땅 = 런사이클 재생
  }
  const py=GROUND+s.y; const bob=s.onGround?-Math.abs(Math.sin(s.run*0.08))*2:0;
  // 그림자
  const sa=Math.max(.1,.3-(-s.y)/600); ctx.globalAlpha=sa; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(PX,GROUND+4,Math.max(1.5,s.c.dw*0.3-(-s.y)/28),Math.max(1.5,5.5-(-s.y)/300),0,0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.save(); ctx.translate(PX,py+bob); if(!s.onGround)ctx.rotate((s.vy<0?-0.12:0.12)-(s.spin||0)*Math.PI*2);
  if(s.inv>0 && Math.floor(now/70)%2===0)ctx.globalAlpha=0.4;
  if(im){ const sw=im.width||im.naturalWidth, sh=im.height||im.naturalHeight, dh=s.c.dw, dw=dh*sw/sh; ctx.drawImage(im,-dw/2,-dh,dw,dh); }
  ctx.globalAlpha=1; ctx.restore();
  // 플로터
  for(const f of s.floats){ ctx.globalAlpha=Math.min(1,f.life/.4); ctx.font='800 16px sans-serif'; ctx.textAlign='center'; ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeText(f.txt,f.x,f.y); ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x,f.y); } ctx.globalAlpha=1;
  // 인트로
  if(s.introT>0){ ctx.globalAlpha=Math.min(1,s.introT/.4); ctx.font='800 18px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#5a4a3a'; ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeText(s.c.intro,W/2,80); ctx.fillText(s.c.intro,W/2,80); ctx.globalAlpha=1; }
  // HUD
  ctx.fillStyle='#5a4a3a'; ctx.font='800 22px sans-serif'; ctx.textAlign='left'; ctx.fillText(score+' m',150,36);   // 88: 좌상단 '← 홈' 버튼과 겹치지 않게
  ctx.font='800 15px sans-serif'; ctx.textAlign='right'; ctx.fillText('🌰 '+s.coins,W-14,30);
  if(s.combo>=2){                                     // 콤보 표시 (남은 시간 줄면 흐려짐)
    ctx.globalAlpha=Math.min(1,0.4+s.comboT/3.0*0.6);
    ctx.fillStyle='#d2452a'; ctx.font='800 14px sans-serif'; ctx.textAlign='right';
    ctx.fillText('🔥 '+s.combo+'콤보 ×'+Math.min(5,s.combo),W-14,68); ctx.globalAlpha=1; ctx.fillStyle='#5a4a3a'; }
  if(s.shield>0){ ctx.fillStyle='#3a7a5a'; ctx.font='800 13px sans-serif'; ctx.fillText('🛡 보호막',W-14,50); }
  ctx.restore();
}

// 게임이 끝날 때 한 번 호출 — 누적 기록을 갱신하고 조건을 확인합니다
function achReport(ev){
  const st = achStats();
  st.played = st.played || {}; st.played[ev.g] = (st.played[ev.g]||0) + 1;
  st.chars  = st.chars  || {}; if(ev.key) st.chars[ev.key] = 1;
  st.coins  = (st.coins||0) + (ev.coins||0);
  try{ localStorage.setItem('somsom_stats', JSON.stringify(st)); }catch(e){}
  if(ev.g==='leaf'){
    if(ev.score>0) achUnlock('leaf_first');
    if(ev.score>=1000) achUnlock('leaf_1000');
    if(ev.score>=5000) achUnlock('leaf_5000');
    if((ev.combo||0)>=10) achUnlock('leaf_combo10');
    if((ev.gold||0)>=5)  achUnlock('leaf_gold5');
  } else if(ev.g==='run'){
    if((ev.dist||0)>=500)  achUnlock('run_500');
    if((ev.dist||0)>=2000) achUnlock('run_2000');
    if((ev.dist||0)>=5000) achUnlock('run_5000');
    if((ev.nears||0)>=10)  achUnlock('run_near10');
    if((ev.tights||0)>=3)  achUnlock('run_tight3');
    if((ev.combo||0)>=5)   achUnlock('run_combo5');
  } else if(ev.g==='match'){
    if(ev.cleared){
      achUnlock('match_first');
      if((ev.misses||0)===0) achUnlock('match_perfect');
      if(ev.diff==='hard')   achUnlock('match_hard');
      if((ev.time||1e9)<60)  achUnlock('match_fast');
    }
  }
  const p = st.played||{};
  if(p.leaf && p.run && p.match) achUnlock('all_three');
  if(Object.keys(st.chars||{}).length >= 6) achUnlock('all_chars');
  if((st.coins||0) >= 500) achUnlock('coins_500');
}

// ── 도감 (Phase 2) — 게임에서 만난 것을 모아 허브에서 봅니다 ──
function dexLoad(){ try{ return JSON.parse(localStorage.getItem('somsom_dex')||'{}'); }catch(e){ return {}; } }
function dexAdd(id, label){
  const d = dexLoad(); if(d[id]) return false;
  d[id] = Date.now(); try{ localStorage.setItem('somsom_dex', JSON.stringify(d)); }catch(e){}
  const el = document.getElementById('achToast');
  if(el){ el.querySelector('.at').textContent='도감 발견'; el.querySelector('.an').textContent=label;
    el.classList.add('on'); try{ if(typeof sfx==='function') sfx('record'); }catch(e){}
    setTimeout(()=>{ el.classList.remove('on');
      setTimeout(()=>{ el.querySelector('.at').textContent='업적 달성'; }, 500); }, 2000); }
  return true;
}
// ── 오늘의 도전 — 세 게임이 같은 씨앗을 써서 마을 전체가 같은 친구와 놉니다 ──
function dayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }

const LANDMARKS = [
  {id:'run_postbox', f:'dex_run_postbox.png',  n:'골목 우체통'},
  {id:'run_busstop', f:'dex_run_busstop.png',  n:'버스 정류장'},
  {id:'run_bench',   f:'dex_run_bench.png',    n:'공원 벤치'},
  {id:'run_lamp',    f:'dex_run_lamp.png',     n:'가로등'},
  {id:'run_bakery',  f:'dex_run_bakery.png',   n:'골목 빵집'},
];
const lmImg = {};
for(const L of LANDMARKS){ const im=new Image(); im.src='../assets/'+L.f;
  im.onload=()=>{ try{ lmImg[L.id]=downscale(keyOutWhiteBg(im),150); }catch(e){ lmImg[L.id]=im; } }; }

// 세 게임이 같은 친구를 뽑도록 순서를 고정합니다 (게임마다 CHARS 정의 순서가 달라서)
const DAILY_ORDER = ['kkito','boneul','migae','ramda','bookgeo','lachilchin'];
const DAILY_CHAR_ID = DAILY_ORDER[(Math.imul(dayKey(), 2654435761) >>> 0) % DAILY_ORDER.length];

// 오늘의 도전 — 마을 전체가 같은 친구와 놉니다
(function(){ const b=document.getElementById('dailyBtn2'); if(!b) return;
  const c=CHARS[DAILY_CHAR_ID]; if(!c) return;
  b.textContent='📅 오늘의 도전 — '+c.name;
  b.addEventListener('click', ()=> ui.showIntro(DAILY_CHAR_ID));
})();
</script>
